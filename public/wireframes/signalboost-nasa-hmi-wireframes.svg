<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">SignalBoost NASA-style HMI wireframes</title>
  <desc id="desc">Marketplace homepage, SaaS dashboard modules, reviews cockpit, and pricing panel wireframe preview.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#02040a"/><stop offset="1" stop-color="#071b2c"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .panel{fill:rgba(255,255,255,.06);stroke:#00ffff;stroke-opacity:.45;stroke-width:2;rx:22;filter:url(#glow)}
      .gold{stroke:#ffd700}.mag{stroke:#ff00ff}.txt{fill:#fff;font-family:Inter,Arial,sans-serif}.muted{fill:#9aa8b8;font-size:16px}.label{fill:#ffd700;font-size:14px;font-weight:700;letter-spacing:2px}.h{font-size:30px;font-weight:800}.s{fill:#00ffff}.line{stroke:#fff;stroke-opacity:.18;stroke-width:2}
    </style>
  </defs>
  <rect width="1400" height="980" fill="url(#bg)"/>
  <g transform="translate(60 50)">
    <text class="txt h" x="0" y="0">Marketplace Homepage Cockpit</text>
    <rect class="panel gold" x="0" y="30" width="600" height="230"/>
    <text class="label" x="28" y="72">HERO + CONCIERGE</text>
    <rect class="panel" x="28" y="98" width="360" height="54" rx="27"/><text class="muted" x="52" y="132">Search: flights to Lima next month.</text>
    <rect class="panel mag" x="410" y="92" width="160" height="125"/><text class="txt" x="432" y="135">AI Guidance</text><text class="muted" x="432" y="166">intent → route</text>
    <rect class="panel" x="0" y="285" width="600" height="210"/>
    <text class="label" x="28" y="327">CATEGORY PANELS</text>
    <g transform="translate(28 350)"><rect class="panel" width="165" height="55"/><rect class="panel" x="185" width="165" height="55"/><rect class="panel" x="370" width="165" height="55"/><rect class="panel" y="75" width="165" height="55"/><rect class="panel" x="185" y="75" width="165" height="55"/><rect class="panel" x="370" y="75" width="165" height="55"/></g>
    <rect class="panel mag" x="0" y="520" width="600" height="130"/><text class="label" x="28" y="560">PARTNER VITRINA + EXEC STRIP</text><line class="line" x1="40" y1="600" x2="555" y2="600"/>
  </g>
  <g transform="translate(720 50)">
    <text class="txt h" x="0" y="0">Unified SaaS Dashboard</text>
    <rect class="panel gold" x="0" y="30" width="620" height="620"/>
    <rect class="panel" x="28" y="65" width="150" height="540"/><text class="label" x="48" y="100">SIDEBAR</text>
    <text class="muted" x="48" y="145">Promote</text><text class="muted" x="48" y="185">Reviews</text><text class="muted" x="48" y="225">Calendar</text><text class="muted" x="48" y="265">Sheets</text><text class="muted" x="48" y="305">Outreach</text><text class="muted" x="48" y="345">Assistant</text>
    <rect class="panel mag" x="205" y="65" width="375" height="140"/><text class="label" x="230" y="105">TELEMETRY GRID</text>
    <rect class="panel" x="205" y="230" width="178" height="150"/><rect class="panel" x="402" y="230" width="178" height="150"/>
    <rect class="panel" x="205" y="405" width="178" height="160"/><rect class="panel" x="402" y="405" width="178" height="160"/>
  </g>
  <g transform="translate(60 735)">
    <text class="txt h" x="0" y="0">Reviews Module</text>
    <rect class="panel" x="0" y="28" width="380" height="160"/><text class="label" x="24" y="68">SUBMISSION</text><text class="muted" x="24" y="105">stars · text · media · locale</text>
    <rect class="panel mag" x="410" y="28" width="380" height="160"/><text class="label" x="434" y="68">SENTIMENT + MODERATION</text><text class="muted" x="434" y="105">trend · queue · approvals</text>
    <rect class="panel gold" x="820" y="28" width="380" height="160"/><text class="label" x="844" y="68">PRICING CARDS</text><text class="muted" x="844" y="105">tiered module CTAs</text>
  </g>
</svg>
