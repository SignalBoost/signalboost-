<!DOCTYPE html>
<html lang="en">
<head>
  <!--
  ========================================================
  SIGNALBOOST VIDEO MALL
  VERSION: simple multi-platform embed build

  PURPOSE
  - Show a grid of pre-defined videos from many platforms
  - Open each video in a modal player when clicked
  - Keep UI clean and neutral
  - Easy to extend later (URL intake, AI, etc.)

  MAINTENANCE NOTES
  - Add / edit videos only inside VIDEO_SOURCES
  - Platform labels/colors live in PLATFORM_COLORS + getPlatformLabel()
  ========================================================
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SignalBoost Video Mall</title>
  <style>
    :root{
      --bg:#0b1220;
      --bg2:#020617;
      --surface:rgba(15,23,42,.98);
      --soft:rgba(15,23,42,.94);
      --text:#e5e7eb;
      --muted:#9ca3af;
      --border:rgba(148,163,184,.35);
      --accent:#38bdf8;
      --accent2:#a855f7;
      --shadow:0 18px 48px rgba(0,0,0,.55);
      --rx:22px;
      --rl:18px;
      --max:1240px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:radial-gradient(circle at top,var(--bg2),#020617 52%,#000 100%);
      color:var(--text);
    }
    a{text-decoration:none;color:inherit}
    button{font:inherit;cursor:pointer}
    .app{
      width:min(var(--max),calc(100vw - 24px));
      margin:0 auto;
      padding:18px 0 40px;
    }
    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      padding:12px 16px;
      border-radius:18px;
      background:linear-gradient(135deg,rgba(15,23,42,.96),rgba(15,23,42,.9));
      border:1px solid var(--border);
      box-shadow:var(--shadow);
      flex-wrap:wrap;
    }
    .brand-wrap{display:flex;align-items:center;gap:10px}
    .logo-mark{
      width:46px;height:46px;border-radius:16px;
      background:radial-gradient(circle at 20% 0%,#38bdf8,transparent 55%),radial-gradient(circle at 80% 100%,#a855f7,transparent 55%);
      border:1px solid rgba(148,163,184,.6);
      display:grid;place-items:center;
      color:#e5e7eb;font-size:22px;font-weight:700;
    }
    .brand-title{font-size:20px;font-weight:800}
    .brand-sub{font-size:12px;color:var(--muted)}
    .topbar-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .chip{
      border-radius:999px;
      padding:7px 13px;
      border:1px solid var(--border);
      background:rgba(15,23,42,.9);
      color:var(--muted);
      font-size:12px;
    }
    .chip.active{
      border-color:#38bdf8;
      color:#e5e7eb;
      background:rgba(15,23,42,1);
    }
    .hero{
      margin-top:16px;
      padding:26px 22px 20px;
