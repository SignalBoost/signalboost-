name: Generate Trending Feed

on:
  schedule:
    # Runs every hour at :05 to avoid peak GitHub Actions load
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate feed.json
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: npm run generate-feed

      - name: Commit and push feed.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.json
          # Only commit when feed.json actually changed
          if git diff --cached --quiet; then
            echo "feed.json unchanged – nothing to commit."
          else
            git commit -m "chore: update feed.json [skip ci]"
            git push origin main
          fi
