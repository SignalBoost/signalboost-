<!--
================ SIGNALBOOST AI =================

CURRENT MODE: PUBLIC SAFE MODE

GOAL:
- Allow public users to access ONLY videos
- Hide all unfinished or monetization features
- Prevent exposing incomplete tools

VISIBLE TO PUBLIC:
- YouTube videos (engagement layer)

HIDDEN:
- Travel monetization
- AI tools
- Admin features

NOTE:
- Switch visibility later when monetization is ready
================================================
-->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SignalBoost AI</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #f5f5f5;
      text-align: center;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      font-size: 22px;
      font-weight: bold;
    }

    .container {
      padding: 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 30px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 10px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .thumb {
      width: 100%;
      border-radius: 10px;
    }

    .title {
      font-weight: bold;
      margin-top: 10px;
      font-size: 14px;
    }

    .hidden {
      display: none;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: none;
      justify-content: center;
      align-items: center;
    }

    .modal iframe {
      width: 80%;
      height: 70%;
      border: none;
    }
  </style>
</head>

<body>

<header>
  SignalBoost AI
</header>

<div class="container">

  <h2>Trending Videos</h2>

  <!-- ✅ PUBLIC CONTENT (VIDEOS ONLY) -->
  <div id="videos" class="grid"></div>

  <!-- ❌ HIDDEN FOR NOW (MONETIZATION + TOOLS) -->
  <div id="travelSection" class="hidden">
    <h2>Travel Deals</h2>
    <a href="https://expedia.com/affiliate/6N7hRHZ" target="_blank">
      Search Hotels
    </a>
  </div>

</div>

<!-- VIDEO MODAL -->
<div id="modal" class="modal" onclick="closeModal()">
  <iframe id="player"></iframe>
</div>

<script>
/*
================================================
VIDEO SYSTEM (PUBLIC SAFE)
- Only videos visible to users
- Pulls from your backend API
================================================
*/

async function loadVideos() {
  try {
    const res = await fetch('/api/youtube/trending');
    const data = await res.json();

    const container = document.getElementById('videos');

    container.innerHTML = data.items.map(v => `
      <div class="card" onclick="play('${v.id}')">
        <img class="thumb" src="${v.thumbnail}">
        <div class="title">${v.title}</div>
      </div>
    `).join('');

  } catch (err) {
    document.getElementById('videos').innerHTML =
      "<p>Videos temporarily unavailable</p>";
  }
}

function play(id) {
  document.getElementById('modal').style.display = 'flex';
  document.getElementById('player').src =
    "https://www.youtube.com/embed/" + id + "?autoplay=1";
}

function closeModal() {
  document.getElementById('modal').style.display = 'none';
  document.getElementById('player').src = "";
}

loadVideos();
</script>

</body>
</html>
