<!--
================ SIGNALBOOST AI PROJECT BRAIN ================

PROJECT IDENTITY
- Name: SignalBoost AI
- Goal: AI-driven HMI interface
- Core Idea: AI cockpit + adaptive UI

DESIGN PRINCIPLES
- AI is the main interface (not a feature)
- One clear next action
- Visible feedback for every interaction
- Adaptive layout based on user intent

CURRENT FEATURES
- Prompt input (AI interaction entry point)
- Mode switching (travel, finance, social)
- AI response simulation
- Card-based recommendation system
- Adaptive section content by mode
- Adaptive hero styling by mode

NEXT STEPS
- Full adaptive layout (move from adaptive content to adaptive page structure)
- Real AI integration (API / LLM)
- State memory (session awareness)
- Workspaces (task-based UI environments)

NOTES
- This file acts as BOTH UI and documentation
- Always update this section when evolving the system
- This allows full recovery in a new chat

==============================================================
-->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SignalBoost AI</title>
<style>
:root {
  --bg:#eef4ff;
  --surface:rgba(255,255,255,0.85);
  --border:rgba(148,163,184,.25);
  --text:#0f172a;
  --muted:#64748b;
  --primary:#2563eb;
  --accent:#06b6d4;
  --shadow:0 20px 60px rgba(15,23,42,.08);
}

body.dark {
  --bg:#0b1220;
  --surface:rgba(20,30,50,.85);
  --text:#e2e8f0;
  --muted:#94a3b8;
  --border:rgba(255,255,255,.1);
}

body{
  margin:0;
  font-family:Inter, Arial;
  background:var(--bg);
  color:var(--text);
  transition:.3s;
}

.app{max-width:1200px;margin:auto;padding:16px}

.topbar{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px;border-radius:16px;
  background:var(--surface);border:1px solid var(--border);
  box-shadow:var(--shadow)
}

.logo{font-weight:900}

.btn{padding:10px 14px;border-radius:999px;border:none;cursor:pointer;font-weight:700}
.primary{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff}
.ghost{background:transparent;border:1px solid var(--border)}

.hero{
  margin-top:20px;
  background:var(--surface);
  padding:30px;
  border-radius:24px;
  border:1px solid var(--border);
  display:grid;
  grid-template-columns:1.3fr .9fr;
  gap:18px;
  align-items:start;
}

h1{font-size:42px;margin:0}

.prompt{
  margin-top:20px;
  padding:12px;
  border-radius:20px;
  background:#fff;
  border:1px solid var(--border);
  display:flex;
  gap:10px;
  transition:.2s;
}

.prompt:focus-within{
  border-color:var(--primary);
  box-shadow:0 0 0 2px rgba(37,99,235,.15);
}

body.dark .prompt{background:#111827}

input{
  flex:1;
  border:none;
  outline:none;
  font-size:18px;
  background:transparent;
  color:inherit
}

.thinking{
  font-size:13px;
  color:var(--muted);
  margin-top:6px;
  opacity:0;
  transition:.3s
}

.response{
  margin-top:12px;
  padding:12px;
  border-radius:14px;
  background:rgba(37,99,235,.08);
  border:1px solid rgba(37,99,235,.2);
  font-size:14px;
  line-height:1.6;
}

.suggestions{
  margin-top:10px;
  display:flex;
  gap:8px;
  flex-wrap:wrap
}

.chip{
  padding:8px 12px;
  border-radius:999px;
  border:1px solid var(--border);
  cursor:pointer;
  font-size:12px;
}

.mode-switch{
  margin-top:20px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.hero-side-panel{
  padding:16px;
  border-radius:18px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.55);
}

body.dark .hero-side-panel{background:rgba(30,40,60,.55)}

.hero-side-panel h3{
  margin:0 0 10px 0;
  font-size:18px;
}

.hero-list{
  display:grid;
  gap:10px;
}

.hero-list-item{
  padding:10px 12px;
  border-radius:14px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.45);
  font-size:13px;
  line-height:1.5;
}

body.dark .hero-list-item{background:rgba(17,24,39,.55)}

.layout-shell{
  display:grid;
  grid-template-columns:1.4fr .8fr;
  gap:20px;
}

.side-rail{
  display:grid;
  gap:20px;
}

.rail-card{
  margin-top:20px;
  padding:20px;
  border-radius:20px;
  background:var(--surface);
  border:1px solid var(--border);
}

.rail-card h2{
  margin:0 0 10px 0;
}

.rail-list{
  display:grid;
  gap:10px;
}

.rail-list-item{
  padding:12px;
  border-radius:14px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.45);
  font-size:13px;
  line-height:1.5;
}

body.dark .rail-list-item{background:rgba(17,24,39,.55)}

.module{
  margin-top:20px;
  padding:20px;
  border-radius:20px;
  background:var(--surface);
  border:1px solid var(--border)
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-top:14px
}

.card{
  padding:14px;
  border-radius:16px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.6);
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
  box-shadow:0 8px 20px rgba(0,0,0,.05);
}

body.dark .card{background:rgba(30,40,60,.6)}

.label{font-size:11px;color:var(--muted)}
.strong{font-weight:800}

@media(max-width:1000px){
  .hero,.layout-shell{grid-template-columns:1fr}
}

@media(max-width:800px){
  .grid{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr}
}
</style>
</head>
<body>

  </div>

</div>

<aside class="side-rail">
  <section class="rail-card">
    <h2>Session state</h2>
    <div id="sessionList" class="rail-list"></div>
  </section>

  <section class="rail-card">
    <h2>Why this mode</h2>
    <div id="whyMode" class="rail-list"></div>
  </section>
</aside>
</div>

  document.getElementById('input').value=text;
  runAI();

    render(currentMode);

}

  render(mode);
}

</body>
</html>
