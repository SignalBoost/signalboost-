    :root {

      --text: #0f172a;

      --primary: #2563eb;

      --card-bg: rgba(255,255,255,0.75);

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button, input {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .app {
      width: min(1320px, calc(100vw - 24px));
      margin: 0 auto;
      padding: 12px 0 28px;
    }

    .topbar,
    .hero,
    .module {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: var(--shadow);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 12px 16px;
      border-radius: 18px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 900;
      font-size: 20px;
      letter-spacing: -0.02em;
    }

    .logo-mark {
      width: 60px;
      height: 60px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
      flex-shrink: 0;
    }

    .chip,
    .tiny-btn,
    .btn {
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      cursor: pointer;
      color: inherit;
      transition: 0.15s ease;
    }

    .chip:hover,
    .tiny-btn:hover,
    .btn:hover {
      transform: translateY(-1px);
    }

    .btn.primary,
    .tiny-btn.primary {
      border: none;
      color: white;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary), var(--accent));
    }

    .tiny-btn.warn {
      border: none;
      color: white;
      font-weight: 700;
      background: linear-gradient(135deg, var(--warning), #fb923c);
    }

    .hero {
      margin-top: 18px;
      padding: 28px;
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(280px, 0.8fr);
      gap: 18px;
    }

      font-size: 44px;
      line-height: 1.04;
      letter-spacing: -0.03em;
    }

    h2 {
      margin: 0;
      font-size: 24px;
    }

    h3 {
      margin: 0 0 10px;
      font-size: 18px;
    }

    .sub {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
      font-size: 18px;
    }

    .prompt input {
      width: 100%;

      border: none;
      background: transparent;
      color: inherit;
    }

      font-size: 14px;
    }
