
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SignalBoost</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0d1117;
  color: #fff;
}

.app {
  display: grid;
  grid-template-columns: 300px 1fr 300px;
  height: 100vh;
}

/* ========================= */
/* COLUMN BASE */
/* ========================= */
.column {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ========================= */
/* COLUMN 1 */
/* ========================= */
.column-1 {
  background: #05070a;
}

.column-1-header {
  padding: 12px 16px;
  font-weight: 600;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

.column-1-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
}

.category summary {
  cursor: pointer;
  padding: 8px;
  background: rgba(255,255,255,0.05);
  border-radius: 6px;
  margin-bottom: 6px;
}

.category ul {
  list-style: none;
  padding-left: 12px;
}

.category a {
  color: #fff;
  text-decoration: none;
  font-size: 14px;
}

.category a:hover {
  text-decoration: underline;
}

/* ========================= */
/* COLUMN 2 */
/* ========================= */
.column-2 {
  overflow-y: auto;
  padding: 20px;
}

/* ========================= */
/* COLUMN 3 */
/* ========================= */
.column-3 {
  overflow-y: auto;
  padding: 20px;
}
</style>
</head>

<body>

<div class="app">

  <!-- COLUMN 1 -->
  <div class="column column-1">
    <div class="column-1-header">Partners</div>
    <div id="column1-partners" class="column-1-scroll"></div>
  </div>

  <!-- COLUMN 2 -->
  <div class="column column-2">
    <h2>Column 2 (Feed)</h2>
  </div>

  <!-- COLUMN 3 -->
  <div class="column column-3">
    <h2>Column 3 (Fruit Bowl)</h2>
  </div>

</div>

<script>
async function loadPartners() {
  try {
    const response = await fetch('/data/partners.json');
    const data = await response.json();
    return data.partners || [];
  } catch (err) {
    console.error("Error loading partners:", err);
    return [];
  }
}

async function renderColumn1() {
  const partners = await loadPartners();
  const container = document.getElementById("column1-partners");

  const categories = {};

  partners.forEach(p => {
    if (!categories[p.category]) {
      categories[p.category] = [];
    }
    categories[p.category].push(p);
  });

  container.innerHTML = "";

  Object.keys(categories).forEach(category => {
    const section = document.createElement("div");
    section.className = "category";

    section.innerHTML = `
      <details>
        <summary>${category}</summary>
        <ul>
          ${categories[category].map(p => `
            <li>
              <a href="${p.url}" target="_blank">
                ${p.name}
              </a>
            </li>
          `).join("")}
        </ul>
      </details>
    `;

    container.appendChild(section);
  });
}

renderColumn1();
</script>

</body>
</html>
