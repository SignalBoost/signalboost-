

<!DOCTYPE html>
<html lang="en" data-theme="dark" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="google" content="notranslate" />
  <title>SignalBoost</title>
  <meta name="description" content="Find travel, marketplace and service offers by region." />
  <style>
    *{box-sizing:border-box}
    :root{
      --bg:#0d1117;--panel:#0f141b;--card:#111822;--card2:#151d28;--line:rgba(255,255,255,.08);--line2:rgba(245,197,66,.24);--text:#fff;--muted:#9aa8b8;--soft:rgba(255,255,255,.72);--gold:#f5c542;--goldSoft:rgba(245,197,66,.14);--shadow:0 16px 42px rgba(0,0,0,.28)
    }
    html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
    body{overflow:hidden}
    a{color:inherit}
    .top{height:44px;background:#232f3e;display:grid;grid-template-columns:250px 1fr 250px;align-items:center;border-bottom:1px solid rgba(255,255,255,.1);position:fixed;inset:0 0 auto 0;z-index:1000}
    .logo{color:var(--gold);font-weight:900;padding-left:12px;font-size:17px;white-space:nowrap;letter-spacing:.01em;flex:0 0 145px}
    .nav-status{display:flex;justify-content:center;align-items:center;font-size:12px;color:#d6e0ee;font-weight:800;gap:8px}
    .nav-dot{width:6px;height:6px;border-radius:99px;background:var(--gold);display:inline-block}
    .lang-switcher{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding-right:12px}
    .select{background:#0f1724;color:#fff;border:1px solid rgba(255,255,255,.22);border-radius:10px;padding:7px 9px;font-weight:800;font-size:12px}
    .app{display:grid;grid-template-columns:280px minmax(540px,1fr)320px;height:100vh;padding-top:44px}
    .col{min-height:0;overflow:hidden}
    .left,.right{background:var(--panel)}
    .left{border-right:1px solid var(--line);overflow-y:auto;overflow-x:hidden;padding-bottom:80px;scrollbar-width:thin}
    .left::-webkit-scrollbar,.right::-webkit-scrollbar,.main::-webkit-scrollbar{width:8px}
    .left::-webkit-scrollbar-thumb,.right::-webkit-scrollbar-thumb,.main::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:999px}
    .right{border-left:1px solid var(--line);padding:16px;overflow-y:auto}
    .sidebar-top{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0f141b 80%,rgba(15,20,27,.92));padding:14px;border-bottom:1px solid var(--line)}
    .small-title{font-size:12px;color:#c9d7e8;text-transform:uppercase;font-weight:900;letter-spacing:.06em;margin-bottom:9px}
    #partnerSearch{width:100%;height:40px;background:#0d1117;color:#fff;border:1px solid rgba(255,255,255,.13);border-radius:13px;padding:9px 11px;outline:none}
    #partnerSearch:focus{border-color:rgba(245,197,66,.48);box-shadow:0 0 0 3px rgba(245,197,66,.08)}
    .region-pills,.filter-pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
    .region-pills::-webkit-scrollbar,.filter-pills::-webkit-scrollbar{display:none}
    .region-pills{margin-top:10px}
    .filter-pills{margin-top:8px}
    .pill{border:1px solid rgba(255,255,255,.08);background:#18202b;color:#fff;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:900;cursor:pointer;white-space:nowrap;transition:.16s ease}
    .pill:hover{border-color:rgba(245,197,66,.28);transform:translateY(-1px)}
    .pill.active{background:var(--gold);color:#10151d;border-color:var(--gold)}
    #column1{padding:10px 0 22px}
    .category-grid{display:grid;grid-template-columns:1fr;gap:9px;margin:10px 12px 12px}
    .category-tile{width:100%;border:1px solid rgba(255,255,255,.08);background:var(--card);color:#fff;border-radius:16px;padding:13px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;text-align:left;box-shadow:0 8px 24px rgba(0,0,0,.10);transition:.16s ease}
    .category-tile:hover{border-color:rgba(245,197,66,.32);transform:translateY(-1px);background:#151d28}
    .category-tile.active{border-color:rgba(245,197,66,.60);background:rgba(245,197,66,.11)}
    .category-tile-left{display:flex;align-items:center;gap:10px;min-width:0}
    .category-tile-icon{font-size:18px;width:22px;text-align:center}
    .category-tile-title{display:block;font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .category-tile-count{font-size:11px;color:#111;background:var(--gold);border-radius:999px;padding:4px 8px;font-weight:900;flex:0 0 auto}
    .selected-panel{margin:12px;border:1px solid rgba(245,197,66,.18);border-radius:18px;background:var(--card);overflow:hidden}
    .selected-panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 13px;border-bottom:1px solid rgba(255,255,255,.07)}
    .selected-panel-head strong{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:#c9d7e8}
    .selected-close{border:0;background:rgba(255,255,255,.07);color:#fff;border-radius:999px;width:28px;height:28px;font-weight:900;cursor:pointer}
    .selected-list{padding:8px}
    .sidebar-category{margin:10px 12px;border:1px solid rgba(255,255,255,.07);border-radius:17px;overflow:hidden;background:var(--card);box-shadow:0 10px 28px rgba(0,0,0,.12)}
    .sidebar-category-btn{width:100%;border:none;background:transparent;color:#fff;padding:14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;text-align:left}
    .sidebar-category-left,.sidebar-category-right{display:flex;align-items:center;gap:10px;min-width:0}
    .sidebar-icon{font-size:17px;width:20px;text-align:center}
    .cat-title{font-size:14px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .partner-count{color:var(--gold);font-weight:900;font-size:12px;background:rgba(245,197,66,.12);padding:3px 7px;border-radius:999px}
    .expand-icon{font-size:18px;color:var(--gold);line-height:1;min-width:14px;text-align:center}
    .sidebar-partners{display:none;padding:0 9px 10px}
    .sidebar-category[data-open="1"] .sidebar-partners{display:block}
    .partner-row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:13px;text-decoration:none;color:white;transition:.15s ease;min-width:0}
    .partner-row:hover{background:rgba(245,197,66,.08)}
    .partner-row img{width:34px;height:34px;object-fit:contain;border-radius:8px;background:rgba(255,255,255,.05);padding:4px;flex:0 0 auto}
    .partner-row-main{min-width:0;flex:1}
    .partner-row strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .partner-row span{display:block;font-size:11px;color:rgba(255,255,255,.64);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
    .tier-badge{font-size:10px;color:#111;background:var(--gold);font-weight:900;border-radius:999px;padding:3px 6px;flex:0 0 auto}
    .show-more-btn{width:100%;margin-top:6px;border:none;background:rgba(255,255,255,.05);color:var(--gold);border-radius:12px;padding:10px;font-weight:900;cursor:pointer}
    .show-more-btn:hover{background:rgba(245,197,66,.12)}
    .empty{margin:12px;padding:18px;border:1px solid rgba(255,255,255,.07);background:var(--card);border-radius:14px;color:var(--muted);font-size:13px;line-height:1.4}
    .main{position:relative;background:var(--bg);display:flex;align-items:flex-start;justify-content:center;padding:14px 14px 96px;overflow-y:auto;scroll-snap-type:y proximity;-webkit-overflow-scrolling:touch}
    .main-layout{width:100%;max-width:900px;margin:0 auto;display:grid;gap:14px}
    .trend-strip{width:100%;padding:10px 12px;border:1px solid rgba(245,197,66,.18);border-radius:999px;background:rgba(17,24,34,.92);display:flex;align-items:center;gap:10px;overflow-x:auto;scrollbar-width:none}
    .trend-strip::-webkit-scrollbar{display:none}
    .trend-kicker{color:var(--gold);font-size:12px;font-weight:900;white-space:nowrap;text-transform:uppercase}
    .trend-items{display:flex;align-items:center;gap:8px;min-width:0}
    .trend-pill{display:inline-flex;align-items:center;white-space:nowrap;text-decoration:none;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);border-radius:999px;padding:7px 10px;font-size:12px;font-weight:900;color:#fff;transition:.18s ease}
    .trend-pill:hover{background:rgba(245,197,66,.15);border-color:rgba(245,197,66,.35);transform:translateY(-1px)}
    .hero-feed-row{width:100%;display:grid;grid-template-columns:minmax(260px,320px) minmax(320px,360px);justify-content:center;align-items:start;gap:16px}
    .region-hero{min-height:470px;border:1px solid rgba(245,197,66,.24);border-radius:26px;background:radial-gradient(circle at 18% 14%,rgba(245,197,66,.24),transparent 34%),linear-gradient(135deg,#152032,#0c1118);box-shadow:var(--shadow);padding:24px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;position:sticky;top:58px}
    .region-hero::after{content:"";position:absolute;right:-120px;bottom:-120px;width:320px;height:320px;border-radius:50%;background:rgba(245,197,66,.13);filter:blur(5px)}
    .hero-copy,.hero-partners{position:relative;z-index:1}
    .region-badge{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border-radius:999px;background:rgba(245,197,66,.16);border:1px solid rgba(245,197,66,.25);color:var(--gold);font-size:12px;font-weight:900;text-transform:uppercase;margin-bottom:14px}
    .region-hero h1{margin:0 0 12px;font-size:34px;line-height:1.04;letter-spacing:-.04em}
    .region-hero p{margin:0;color:rgba(255,255,255,.82);font-size:15px;line-height:1.45}
    .hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
    .primary-cta,.secondary-cta{display:inline-flex;align-items:center;justify-content:center;border-radius:14px;padding:11px 15px;text-decoration:none;font-weight:900;font-size:13px;transition:.18s ease}
    .primary-cta{background:var(--gold);color:#10151d;box-shadow:0 12px 28px rgba(245,197,66,.18)}
    .secondary-cta{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff}
    .primary-cta:hover,.secondary-cta:hover{transform:translateY(-2px)}
    .hero-partners{display:grid;gap:10px;margin-top:18px}
    .hero-mini-card{display:block;text-decoration:none;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:12px;transition:.18s ease;color:#fff}
    .hero-mini-card:hover{transform:translateX(3px);border-color:rgba(245,197,66,.36);background:rgba(245,197,66,.10)}
    .hero-mini-card strong{display:block;font-size:14px;margin-bottom:4px}.hero-mini-card span{display:block;color:rgba(255,255,255,.72);font-size:12px;line-height:1.3}
    .feed-container{max-width:360px;display:flex;flex-direction:column;gap:22px}
    .feed-card{position:relative;display:block;text-decoration:none;border:1px solid rgba(245,197,66,.22);border-radius:24px;background:var(--card);padding:10px;transition:transform .18s ease,border-color .18s ease;cursor:pointer;scroll-snap-align:start;box-shadow:var(--shadow)}
    .feed-card:hover{transform:translateY(-2px);border-color:rgba(245,197,66,.42)}
    .media{position:relative;aspect-ratio:9/16;height:min(76vh,660px);border-radius:18px;overflow:hidden;background:#0b0f14}
    .media img{width:100%;height:100%;object-fit:cover;display:block;border:0;filter:brightness(.60)}
    .feed-content{position:absolute;left:20px;right:20px;bottom:22px;padding:16px 14px;border-radius:18px;background:linear-gradient(180deg,rgba(8,12,18,0),rgba(8,12,18,.78) 20%,rgba(8,12,18,.92));text-shadow:0 2px 14px rgba(0,0,0,.75);pointer-events:none}
    .feed-label{display:inline-block;margin-bottom:8px;padding:5px 9px;border:1px solid rgba(245,197,66,.22);border-radius:999px;background:rgba(245,197,66,.16);color:var(--gold);font-size:11px;font-weight:900;text-transform:uppercase}
    .feed-source{float:right;color:rgba(255,255,255,.82);font-size:11px;font-weight:900;text-transform:uppercase;margin-top:6px}
    .feed-content h3{clear:both;margin:0 0 8px;font-size:22px;line-height:1.15}
    .feed-content p{margin:0;color:rgba(255,255,255,.86);font-size:14px;line-height:1.4}
    #stickyBar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(720px,calc(100% - 24px));background:rgba(15,20,27,.96);border:1px solid rgba(245,197,66,.25);border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;gap:12px;z-index:999}
    .sticky-link{color:var(--gold);text-decoration:none;font-weight:900;white-space:nowrap}
    .right h2{text-align:center;margin:0 0 14px;font-size:20px}
    .right-sub{color:var(--muted);font-size:12px;text-align:center;margin:-6px 0 14px}
    .featured{display:block;text-decoration:none;border:1px solid rgba(245,197,66,.25);border-radius:16px;background:var(--card);overflow:hidden;margin-bottom:14px;box-shadow:0 14px 28px rgba(0,0,0,.22)}
    .featured img{width:100%;height:124px;object-fit:cover;display:block;background:#0b0f14;filter:brightness(.72)}
    .featured-body{padding:12px}
    .featured h4{margin:0 0 8px;color:var(--gold);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.04em}
    .featured p{margin:0 0 8px;font-weight:900;font-size:16px}
    .featured span{display:block;color:rgba(255,255,255,.78);font-size:13px;line-height:1.35}
    .chip-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    .chip{min-height:62px;display:flex;align-items:center;justify-content:center;text-align:center;border:1px solid rgba(255,255,255,.08);background:#1b2128;border-radius:12px;padding:10px;font-weight:900;font-size:12px;text-decoration:none}
    .chip:hover{border-color:rgba(245,197,66,.32);color:var(--gold)}


    .travel-header{height:100%;display:flex;align-items:center;justify-content:flex-start;gap:5px;min-width:0;overflow:visible;flex:1}
    .travel-menu{position:relative;height:100%;display:flex;align-items:center}
    .travel-menu-btn{height:100%;display:flex;align-items:center;gap:6px;border:0;border-bottom:2px solid transparent;background:transparent;color:#fff;padding:0 8px;font-size:12px;font-weight:900;cursor:pointer;white-space:nowrap}
    .travel-menu-btn:hover,.travel-menu:hover .travel-menu-btn{color:var(--gold);border-bottom-color:var(--gold)}
    .travel-count{font-size:10px;color:#111;background:var(--gold);border-radius:999px;padding:2px 6px;font-weight:900}
    .travel-dropdown{display:none;position:absolute;top:100%;left:50%;transform:translateX(-50%);width:310px;max-height:min(70vh,520px);overflow:auto;background:#111822;border:1px solid rgba(255,255,255,.12);border-radius:0 0 18px 18px;box-shadow:0 22px 46px rgba(0,0,0,.45);padding:10px;z-index:1200}
    .travel-menu:hover .travel-dropdown,.travel-menu:focus-within .travel-dropdown{display:block}
    .travel-header-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 8px 10px;border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:6px}
    .travel-header-title{font-size:12px;font-weight:900;color:#c9d7e8;text-transform:uppercase;letter-spacing:.04em}.travel-region{font-size:11px;color:var(--gold);font-weight:900}
    .travel-link{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:12px;text-decoration:none;color:#fff}.travel-link:hover{background:rgba(245,197,66,.10)}
    .travel-link img{width:30px;height:30px;object-fit:contain;border-radius:8px;background:rgba(255,255,255,.05);padding:4px;flex:0 0 auto}.travel-link strong{display:block;font-size:13px;line-height:1.1}.travel-link span{display:block;font-size:11px;color:rgba(255,255,255,.64);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}

    .language-prompt{position:fixed;top:58px;right:18px;width:min(360px,calc(100vw - 28px));background:#111822;border:1px solid rgba(245,197,66,.30);border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.46);padding:16px;z-index:2200;display:none;color:#fff}
    .language-prompt[data-open="1"]{display:block}
    .language-prompt strong{display:block;font-size:16px;margin-bottom:6px;color:#fff}
    .language-prompt p{margin:0 0 14px;color:rgba(255,255,255,.74);font-size:13px;line-height:1.42}
    .language-prompt-actions{display:flex;gap:10px;align-items:center;justify-content:flex-end}
    .language-prompt .prompt-primary,.language-prompt .prompt-secondary{border:0;border-radius:12px;padding:10px 12px;font-weight:900;cursor:pointer;font-size:13px}
    .language-prompt .prompt-primary{background:var(--gold);color:#111}
    .language-prompt .prompt-secondary{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.12)}
    .language-prompt-close{position:absolute;top:8px;right:8px;width:30px;height:30px;border:0;border-radius:50%;background:transparent;color:rgba(255,255,255,.70);font-size:20px;cursor:pointer}
    .language-prompt-close:hover{background:rgba(255,255,255,.08);color:#fff}

    @media(max-width:1050px){.app{grid-template-columns:280px minmax(520px,1fr)}.right{display:none}.top{grid-template-columns:230px 1fr 230px}}
    @media(max-width:760px){
      body{overflow:auto;padding-bottom:74px}.top{grid-template-columns:1fr auto;height:auto;min-height:50px;align-items:start}.logo{padding:13px 12px;font-size:16px}.lang-switcher{padding:8px}.select{max-width:116px;height:36px}.travel-header{grid-column:1 / -1;order:3;width:100%;height:48px;overflow-x:auto;overflow-y:hidden;background:#111;gap:6px;padding:0 8px;scrollbar-width:none}.travel-header::-webkit-scrollbar{display:none}.travel-menu{position:static;flex:0 0 auto}.travel-menu-btn{height:48px;border:1px solid rgba(255,255,255,.08);border-radius:999px;background:#18202b;padding:0 12px}.travel-menu:hover .travel-dropdown,.travel-menu:focus-within .travel-dropdown{display:none}.travel-menu.is-open .travel-dropdown{display:block}.travel-dropdown{position:fixed;left:10px;right:10px;top:98px;transform:none;width:auto;max-height:58vh;border-radius:18px;z-index:2500}.app{display:block;height:auto;padding-top:98px}.left{max-height:none;border-right:0;border-bottom:1px solid var(--line);padding-bottom:8px}.sidebar-top{position:relative;padding:12px}.region-pills,.filter-pills{padding-bottom:6px}.pill{padding:9px 12px}.category-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:8px 10px}.category-tile{min-height:54px}.selected-panel{margin:8px 10px 14px}.main{min-height:500px;padding:12px 10px 96px}.main-layout{max-width:100%}.trend-strip{border-radius:16px;align-items:flex-start;flex-direction:column}.hero-feed-row{display:block}.region-hero{position:relative;top:auto;min-height:auto;margin-bottom:14px;border-radius:20px;padding:18px}.region-hero h1{font-size:27px}.hero-actions{gap:8px}.primary-cta,.secondary-cta{flex:1;min-width:130px}.feed-container{max-width:100%;gap:16px}.feed-card{min-height:auto;border-radius:20px}.media{height:min(72vh,620px);min-height:420px;max-height:none;aspect-ratio:9/16}.feed-content{left:16px;right:16px;bottom:16px}.right{display:none}#stickyBar{left:10px;right:10px;bottom:10px;transform:none;width:auto;font-size:13px;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom));}.language-prompt{top:auto;left:10px;right:10px;bottom:84px;width:auto;border-radius:18px;padding:16px}.language-prompt-actions{justify-content:stretch}.language-prompt .prompt-primary,.language-prompt .prompt-secondary{flex:1}}
    @media(max-width:430px){.category-grid{grid-template-columns:1fr}.media{min-height:390px;height:68vh}.travel-dropdown{top:98px}.feed-content h3{font-size:20px}}
  </style>
</head>
<body>
  <header class="top">
    <div class="logo" data-i18n="brand_name">SignalBoost</div>
    <nav class="travel-header" id="travelHeaderNav" aria-label="Travel partners"></nav>
    <div class="lang-switcher">
      <select class="select" id="langSelect" aria-label="Language"><option value="en">English</option><option value="pt-BR">Português</option><option value="es">Español</option><option value="pl">Polski</option></select>
    </div>
  </header>

  <div class="app">
    <aside class="col left">
      <div class="sidebar-top">
        <div class="small-title" data-i18n="explore_offers">Explore offers</div>
        <input id="partnerSearch" data-i18n-placeholder="search_placeholder" placeholder="Search offers..." />
        <div class="region-pills" id="regionPills"></div>
        <div class="filter-pills" id="filterPills"></div>
      </div>
      <div id="column1"></div>
    </aside>

    <main class="col main" id="magnetoColumn">
      <div class="main-layout">
        <section id="trendingStrip" class="trend-strip" aria-label="Trending offers"></section>
        <div class="hero-feed-row">
          <section id="regionHero" class="region-hero" aria-label="Regional featured offers"></section>
          <div id="feedContainer" class="feed-container"></div>
        </div>
      </div>
    </main>

    <aside class="col right">
      <h2 data-i18n="partners">Partners</h2>
      <p class="right-sub" data-i18n="right_sub">Featured for your selected region</p>
      <div id="partnerChips"></div>
    </aside>
  </div>

  <div id="stickyBar">
    <div id="stickyCopy" data-i18n="featured_service">Explore a featured service picked for you.</div>
    <a id="stickyLink" class="sticky-link" href="#" target="_blank" rel="noopener" data-i18n="view_more">View More</a>
  </div>

      pl:{brand_name:'SignalBoost', nav_status:'Oferty według regionu', explore_offers:'Przeglądaj oferty', search_placeholder:'Szukaj ofert...', partners:'Partnerzy', right_sub:'Polecane dla wybranego regionu', featured_service:'Sprawdź wyróżnioną usługę wybraną dla Ciebie.', view_more:'Zobacz więcej', featured:'Polecane', all:'Wszystkie', travel:'Podróże', local:'Lokalne', more:'więcej partnerów', no_results:'Brak partnerów dla tych filtrów.', hero_title:'Oferty dla {region}', hero_copy:'Przeglądaj zaufanych partnerów dostępnych w tym regionie. Lokalne oferty są pierwsze, globalne jako rezerwa.', explore_region:'Przeglądaj region', show_all:'Pokaż wszystkie', trending:'Popularne', tier:'Poziom', language_prompt_title:'Wolisz angielski?', language_prompt_copy:'Możesz w każdej chwili przełączyć tę stronę na język angielski.', language_prompt_keep:'Zostań przy polskim', language_prompt_english:'Przełącz na angielski', search_results:'Wyniki'}
    };
    const REGION_LANGUAGE = {br:'pt-BR', pl:'pl', us:'en', uk:'en', ca:'en', au:'en', nz:'en', 'es-latam':'es', ot:'en'};
    const urlParams = new URLSearchParams(window.location.search);
    const urlRegion = urlParams.get('region');
    const isValidRegion = key => REGIONS.some(r=>r.key===key);
    const langKeyForRegion = region => 'sb_lang_' + region;
    const langManualKeyForRegion = region => 'sb_lang_manual_' + region;
    function browserRegion(){
      const lang = (navigator.language || navigator.userLanguage || '').toLowerCase();
      if(lang.startsWith('pt-br')) return 'br';
      if(lang.startsWith('pl')) return 'pl';
      if(lang.startsWith('es')) return 'es-latam';
      if(lang.startsWith('en-ca')) return 'ca';
      if(lang.startsWith('en-gb')) return 'uk';
      if(lang.startsWith('en-au')) return 'au';
      if(lang.startsWith('en-nz')) return 'nz';
      if(lang.startsWith('en-us')) return 'us';
      return 'es-latam';
    }
    const savedRegion = localStorage.getItem('sb_region');
    const savedRegionManual = localStorage.getItem('sb_region_manual') === '1';
    // Ignore legacy auto-saved region values from older builds; they caused mobile users to inherit Brazil/Portuguese.
    const initialRegion = (urlRegion && isValidRegion(urlRegion)) ? urlRegion : ((savedRegionManual && isValidRegion(savedRegion)) ? savedRegion : browserRegion());
    function getSavedLang(region){
      const regionalSaved = localStorage.getItem(langKeyForRegion(region));
      if(regionalSaved && I18N[regionalSaved]) return regionalSaved;
      const oldGlobal = localStorage.getItem('sb_lang');
      // Legacy migration guard: never reuse Portuguese outside Brazil.
      if(oldGlobal && I18N[oldGlobal]){
        if(oldGlobal === 'pt-BR' && region !== 'br') return REGION_LANGUAGE[region] || 'en';
        return oldGlobal;
      }
      return REGION_LANGUAGE[region] || 'en';
    }
    function saveLang(region, lang, manual=true){
      localStorage.setItem(langKeyForRegion(region), lang);
      if(manual) localStorage.setItem(langManualKeyForRegion(region), '1');
      // Keep old key as a harmless compatibility fallback, but regional key is source of truth.
      localStorage.setItem('sb_lang', lang);
    }
    const initialLang = getSavedLang(initialRegion);
    const state = {region: initialRegion, lang: initialLang, filter: 'featured', search: '', expanded: new Set(), showAll: new Set(), activeSidebarCategory: ''};
    const $ = sel => document.querySelector(sel);
    const el = (tag, cls, text) => { const n=document.createElement(tag); if(cls) n.className=cls; if(text!==undefined) n.textContent=text; return n; };
    const t = (key, vars={}) => (I18N[state.lang]?.[key] || I18N.en[key] || key).replace(/{(\w+)}/g, (_,k)=>vars[k]??'');
    const categoryName = key => CATEGORY_META[key]?.[state.lang] || CATEGORY_META[key]?.en || key.replace(/_/g,' ');
    // One strict source of truth for regional availability.
    // A partner is visible ONLY when it is explicitly tagged for the selected region
    // AND, when regional_urls exists, it has a URL for that exact region.
    // No `ot` fallback is used for BR, PL, US, UK, etc.; `ot` appears only on the Global region.
    const hasExactRegion = (p, region = state.region) => Array.isArray(p.regions) && p.regions.includes(region);
    const hasExactRegionUrl = (p, region = state.region) => !p.regional_urls || !!p.regional_urls[region];
    const partnerMatchesRegion = p => hasExactRegion(p) && hasExactRegionUrl(p);
    const isLocal = partnerMatchesRegion;
    const partnerUrl = p => (p.regional_urls && p.regional_urls[state.region]) || p.url || '#';
    const partnerUrlExact = partnerUrl;
    const TRAVEL_KEYS = new Set(['flights','hotels','car_rentals','esim','insurance','tours','transfers','travel_services']);
    const isTravelPartner = p => p.travel_related || TRAVEL_KEYS.has(p.category_key);
    const cleanLogo = p => p.logo ? 'logos/' + p.logo : 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="100%" height="100%" fill="#18202b"/><text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" fill="#f5c542" font-family="Arial" font-size="28" font-weight="900">'+(p.name||'?').slice(0,1)+'</text></svg>');
    function dedupePartners(list){
      const map = new Map();
      list.forEach(p=>{
        const id = p.id || (p.name||'').toLowerCase().replace(/[^a-z0-9]+/g,'-');
        const existing = map.get(id);
        if(!existing || Number(p.tier||9) < Number(existing.tier||9) || (p.featured && !existing.featured)) map.set(id,p);
      });
      return [...map.values()];
    }
    const ALL_PARTNERS = dedupePartners(PARTNERS).map(p=>({...p, category_key: p.category_key || p.category || 'specialty_other'}));
    function baseFilteredPartners(){
      let list = ALL_PARTNERS.filter(partnerMatchesRegion);
      if(state.filter === 'featured') list = list.filter(p=>p.featured || Number(p.tier) === 1);
      if(state.filter === 'travel') list = list.filter(p=>p.travel_related || ['flights','hotels','car_rentals','esim','insurance','tours','transfers','travel_services'].includes(p.category_key));
      if(state.filter === 'local') list = list.filter(isLocal);
      if(state.search.trim()){
        const q = state.search.trim().toLowerCase();
        list = list.filter(p => [p.name,p.description,p.network,p.category_key,categoryName(p.category_key)].join(' ').toLowerCase().includes(q));
      }
      list.sort((a,b)=> (isLocal(b)-isLocal(a)) || Number(a.tier||9)-Number(b.tier||9) || String(a.name).localeCompare(String(b.name)));
      return list;
    }
    function groupedPartners(list=baseFilteredPartners()){
      const grouped = {};
      for(const p of list){
        if(!grouped[p.category_key]) grouped[p.category_key]=[];
        grouped[p.category_key].push(p);
      }
      return Object.entries(grouped)
        .filter(([_, items]) => items.length > 0)
        .sort((a,b)=> categorySort(a[0])-categorySort(b[0]) || categoryName(a[0]).localeCompare(categoryName(b[0])));
    }
    function promotedToHeader(p){
      if(!partnerMatchesRegion(p)) return false;
      if(state.region === 'us'){
        return isTravelPartner(p) || p.featured || Number(p.tier || 9) <= 2;
      }
      return isTravelPartner(p);
    }
    function sidebarPartners(){
      let list = ALL_PARTNERS.filter(p => partnerMatchesRegion(p) && !isTravelPartner(p));
      // For the US market, promote strong non-travel partners into the header so Column 1 stays light.
      if(state.region === 'us') list = list.filter(p => !promotedToHeader(p));
      if(state.search.trim()){
        const q = state.search.trim().toLowerCase();
        // Search should still find every exact-region non-travel partner, even if it is promoted in the header.
        list = ALL_PARTNERS.filter(p => partnerMatchesRegion(p) && !isTravelPartner(p));
        list = list.filter(p => [p.name,p.description,p.network,p.category_key,categoryName(p.category_key)].join(' ').toLowerCase().includes(q));
      }
      list.sort((a,b)=> Number(a.tier||9)-Number(b.tier||9) || String(a.name).localeCompare(String(b.name)));
      return list;
    }
    function sidebarGroups(){ return groupedPartners(sidebarPartners()); }
    function partnerHasExactRegion(p){
      return partnerMatchesRegion(p);
    }
    function headerPartners(){
      let list = ALL_PARTNERS.filter(promotedToHeader);
      // The header is a discovery area, not a filtered sidebar. For US it can include selected
      // marketplace/tool/service partners; for other regions it remains travel-focused.
      if(state.search.trim()){
        const q = state.search.trim().toLowerCase();
        list = list.filter(p => [p.name,p.description,p.category_key,p.category_label,p.network].join(' ').toLowerCase().includes(q));
      }
      return list.sort((a,b)=>
        (Number(b.featured||0)-Number(a.featured||0)) ||
        (Number(a.tier||9)-Number(b.tier||9)) ||
        (a.name||'').localeCompare(b.name||'')
      );
    }
    function travelGroups(){ return groupedPartners(headerPartners()); }
    function categorySort(k){ return ['flights','hotels','esim','tours','transfers','car_rentals','insurance','marketplace','products_tools','finance','travel_services','specialty_other'].indexOf(k) < 0 ? 99 : ['flights','hotels','esim','tours','transfers','car_rentals','insurance','marketplace','products_tools','finance','travel_services','specialty_other'].indexOf(k); }
    function renderI18n(){
      document.documentElement.lang = state.lang;
      document.querySelectorAll('[data-i18n]').forEach(n=> n.textContent = t(n.dataset.i18n));
      document.querySelectorAll('[data-i18n-placeholder]').forEach(n=> n.placeholder = t(n.dataset.i18nPlaceholder));
      $('#langSelect').value = state.lang;
    }
    function renderPills(){
      const rp=$('#regionPills'); rp.innerHTML='';
      REGIONS.forEach(r=>{ const b=el('button','pill'+(state.region===r.key?' active':''),r.label); b.onclick=()=>{state.region=r.key; localStorage.setItem('sb_region',r.key); localStorage.setItem('sb_region_manual','1'); state.lang = getSavedLang(r.key); if(!localStorage.getItem(langManualKeyForRegion(r.key))){ state.lang = REGION_LANGUAGE[r.key] || 'en'; } state.expanded.clear(); state.showAll.clear(); state.activeSidebarCategory=''; render(); showLanguagePrompt();}; rp.appendChild(b); });
      const fp=$('#filterPills'); fp.innerHTML='';
      [['featured',t('featured')],['all',t('all')],['local',t('local')]].forEach(([k,label])=>{ const b=el('button','pill'+(state.filter===k?' active':''),label); b.onclick=()=>{state.filter=k; state.showAll.clear(); state.activeSidebarCategory=''; render();}; fp.appendChild(b); });
    }
    function renderSidebar(){
      const root=$('#column1'); root.innerHTML='';
      const groups = sidebarGroups();
      if(!groups.length){ root.appendChild(el('div','empty',t('no_results'))); return; }

      if(state.search.trim()){
        const results = sidebarPartners();
        const panel = el('section','selected-panel');
        const head = el('div','selected-panel-head');
        head.innerHTML = `<strong>${t('search_results') || 'Results'} (${results.length})</strong><button class="selected-close" type="button" aria-label="Clear search">×</button>`;
        head.querySelector('button').onclick = ()=>{ state.search=''; $('#partnerSearch').value=''; render(); };
        const list = el('div','selected-list');
        results.forEach(p=>list.appendChild(partnerRow(p)));
        panel.append(head,list); root.appendChild(panel);
        return;
      }

      const grid = el('div','category-grid');
      groups.forEach(([key,items])=>{
        const tile = el('button','category-tile'+(state.activeSidebarCategory===key?' active':''));
        tile.type = 'button';
        tile.innerHTML = `<span class="category-tile-left"><span class="category-tile-icon">${CATEGORY_META[key]?.icon || '•'}</span><span class="category-tile-title">${categoryName(key)}</span></span><span class="category-tile-count">${items.length}</span>`;
        tile.onclick = ()=>{ state.activeSidebarCategory = state.activeSidebarCategory===key ? '' : key; renderSidebar(); };
        grid.appendChild(tile);
      });
      root.appendChild(grid);

      if(state.activeSidebarCategory){
        const found = groups.find(([key])=>key===state.activeSidebarCategory);
        if(found){
          const [key,items] = found;
          const panel = el('section','selected-panel');
          const head = el('div','selected-panel-head');
          head.innerHTML = `<strong>${CATEGORY_META[key]?.icon || '•'} ${categoryName(key)} (${items.length})</strong><button class="selected-close" type="button" aria-label="Close">×</button>`;
          head.querySelector('button').onclick = ()=>{ state.activeSidebarCategory=''; renderSidebar(); };
          const list = el('div','selected-list');
          items.forEach(p=>list.appendChild(partnerRow(p)));
          panel.append(head,list); root.appendChild(panel);
        }
      }
    }

    function renderHeaderNav(){
      const root = $('#travelHeaderNav'); if(!root) return; root.innerHTML='';
      const groups = travelGroups();
      const region = REGIONS.find(r=>r.key===state.region)?.label || state.region;
      groups.forEach(([key,items])=>{
        const menu = el('div','travel-menu');
        const shown = items.slice(0,8);
        menu.innerHTML = `<button class="travel-menu-btn" type="button"><span>${CATEGORY_META[key]?.icon || '•'}</span><span>${categoryName(key)}</span><span class="travel-count">${items.length}</span></button><div class="travel-dropdown"><div class="travel-header-row"><span class="travel-header-title">${categoryName(key)}</span><span class="travel-region">${region}</span></div>${shown.map(p=>`<a class="travel-link" href="${partnerUrlExact(p)}" target="_blank" rel="noopener"><img src="${cleanLogo(p)}" alt="" onerror="this.style.display='none'"><div><strong>${p.name}</strong><span>${p.description || p.network || ''}</span></div></a>`).join('')}</div>`;
        root.appendChild(menu);
        const btn = menu.querySelector('.travel-menu-btn');
        btn?.addEventListener('click', (ev)=>{
          if(!window.matchMedia('(max-width:760px)').matches) return;
          ev.preventDefault();
          document.querySelectorAll('.travel-menu.is-open').forEach(m=>{ if(m!==menu) m.classList.remove('is-open'); });
          menu.classList.toggle('is-open');
        });
      });
    }
    function partnerRow(p){
      const a=el('a','partner-row'); a.href=partnerUrl(p); a.target='_blank'; a.rel='noopener';
      const localTxt = isLocal(p) ? ' • '+t('local') : '';
      a.innerHTML = `<img src="${cleanLogo(p)}" alt="" onerror="this.style.display='none'"/><div class="partner-row-main"><strong>${p.name || 'Partner'}</strong><span>${p.description || p.network || categoryName(p.category_key)}${localTxt}</span></div><span class="tier-badge">${t('tier')} ${p.tier || 1}</span>`;
      return a;
    }
    function topPartners(n=6){
      let list = ALL_PARTNERS.filter(partnerMatchesRegion);
      if(state.search.trim()){
        const q = state.search.trim().toLowerCase();
        list = list.filter(p => [p.name,p.description,p.network,p.category_key,categoryName(p.category_key)].join(' ').toLowerCase().includes(q));
      }
      return list.sort((a,b)=>(Number(b.featured||0)-Number(a.featured||0)) || Number(a.tier||9)-Number(b.tier||9) || String(a.name).localeCompare(String(b.name))).slice(0,n);
    }
    function renderHero(){
      const region = REGIONS.find(r=>r.key===state.region)?.label || state.region;
      const picks = topPartners(3);
      $('#regionHero').innerHTML = `<div class="hero-copy"><div class="region-badge">${region}</div><h1>${t('hero_title',{region})}</h1><p>${t('hero_copy')}</p><div class="hero-actions"><a class="primary-cta" href="#column1">${t('explore_region')}</a><button class="secondary-cta" onclick="state.filter='all'; render();">${t('show_all')}</button></div></div><div class="hero-partners">${picks.map(p=>`<a class="hero-mini-card" href="${partnerUrl(p)}" target="_blank" rel="noopener"><strong>${p.name}</strong><span>${categoryName(p.category_key)} • ${p.network || ''}</span></a>`).join('')}</div>`;
    }
    function renderTrending(){
      const picks = topPartners(8);
      $('#trendingStrip').innerHTML = `<span class="trend-kicker">${t('trending')}</span><div class="trend-items">${picks.map(p=>`<a class="trend-pill" href="${partnerUrl(p)}" target="_blank" rel="noopener">${p.name}</a>`).join('')}</div>`;
    }
    function renderFeed(){
      const picks = topPartners(5);
      const imgs = ['https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=80','https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80','https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&w=900&q=80','https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?auto=format&fit=crop&w=900&q=80','https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?auto=format&fit=crop&w=900&q=80'];
      $('#feedContainer').innerHTML = picks.map((p,i)=>`<a class="feed-card" href="${partnerUrl(p)}" target="_blank" rel="noopener"><div class="media"><img src="${imgs[i%imgs.length]}" alt=""></div><div class="feed-content"><span class="feed-label">${categoryName(p.category_key)}</span><span class="feed-source">${p.network || ''}</span><h3>${p.name}</h3><p>${p.description || 'Explore this offer for your selected region.'}</p></div></a>`).join('');
    }
    function renderRight(){
      const root=$('#partnerChips'); if(!root) return; const picks=topPartners(8);
      const main=picks[0];
      root.innerHTML = main ? `<a class="featured" href="${partnerUrl(main)}" target="_blank" rel="noopener"><img src="https://images.unsplash.com/photo-1502920917128-1aa500764cbd?auto=format&fit=crop&w=900&q=80" alt=""><div class="featured-body"><h4>${categoryName(main.category_key)}</h4><p>${main.name}</p><span>${main.description || main.network || ''}</span></div></a><div class="chip-grid">${picks.slice(1).map(p=>`<a class="chip" href="${partnerUrl(p)}" target="_blank" rel="noopener">${p.name}</a>`).join('')}</div>` : `<div class="empty">${t('no_results')}</div>`;
    }
    function renderSticky(){ const p=topPartners(1)[0]; if(!p) return; $('#stickyCopy').textContent = `${p.name} — ${categoryName(p.category_key)}`; $('#stickyLink').href=partnerUrl(p); $('#stickyLink').textContent=t('view_more'); }
    function render(){ renderI18n(); renderPills(); renderHeaderNav(); renderSidebar(); renderHero(); renderTrending(); renderFeed(); renderRight(); renderSticky(); showLanguagePrompt(); }

    function languagePromptDismissKey(){
      return 'sb_lang_prompt_dismissed_' + state.region;
    }
    function regionHasLocalLanguage(region = state.region){
      return !!REGION_LANGUAGE[region] && REGION_LANGUAGE[region] !== 'en';
    }
    function hideLanguagePrompt(remember=false){
      const box = $('#languagePrompt');
      if(box) box.dataset.open = '0';
      if(remember) localStorage.setItem(languagePromptDismissKey(),'1');
    }
    function showLanguagePrompt(){
      const box = $('#languagePrompt');
      if(!box) return;
      const dismissedForRegion = localStorage.getItem(languagePromptDismissKey()) === '1';
      const shouldPrompt = regionHasLocalLanguage() && state.lang !== 'en' && !dismissedForRegion;
      box.dataset.open = shouldPrompt ? '1' : '0';
    }
    $('#languagePromptEnglish')?.addEventListener('click', ()=>{ state.lang='en'; saveLang(state.region,'en',true); hideLanguagePrompt(true); render(); });
    $('#languagePromptKeep')?.addEventListener('click', ()=>hideLanguagePrompt(true));
    $('#languagePromptClose')?.addEventListener('click', ()=>hideLanguagePrompt(true));

    document.addEventListener('click', (ev)=>{
      if(!window.matchMedia('(max-width:760px)').matches) return;
      if(!ev.target.closest('.travel-menu')) document.querySelectorAll('.travel-menu.is-open').forEach(m=>m.classList.remove('is-open'));
    });
    $('#partnerSearch').addEventListener('input', e=>{ state.search=e.target.value; renderSidebar(); renderHero(); renderTrending(); renderFeed(); renderRight(); renderSticky(); });
    $('#langSelect').addEventListener('change', e=>{ state.lang=e.target.value; saveLang(state.region,state.lang,true); hideLanguagePrompt(true); render(); });
    render();
  </script>
</body>
