      background: #0f141b;
      position: sticky;
      top: 0;
      z-index: 5;

    .column-1-search-wrap {

      display: flex;
      justify-content: center;
    }

    .column-1-search {

      background: #0d1117;
      color: #fff;
      font-size: 13px;
      outline: none;
    }

    .column-1-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      scrollbar-width: none;
    }

    .category {
      margin-bottom: 10px;
      width: 100%;
      max-width: 244px;
    }

    .category details {
      border-radius: 10px;
      overflow: hidden;
      background: rgba(255,255,255,0.02);
    }

    .category summary {
      cursor: pointer;
      padding: 11px 12px;
      user-select: none;
      font-weight: 700;
      list-style: none;
      color: #fff;
    }

    .category summary::-webkit-details-marker { display: none; }
    .category summary::before {
      content: '▶';
      display: inline-block;
      width: 14px;
      margin-right: 6px;
      font-size: 10px;
      transform: translateY(-1px);
      color: rgba(255,255,255,0.9);
    }
    .category details[open] summary::before { content: '▼'; }
    .category ul { list-style: none; margin: 0; padding: 10px 10px 4px; }
    .category li { margin: 7px 0; }
    .category a { color: rgba(255,255,255,0.92); text-decoration: none; font-size: 14px; }
    .category a:hover { text-decoration: underline; }

    .column-2 {
      background: #0d1117;
      min-width: 0;
    }

    #magnetoColumn {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      height: 100%;
      overflow-y: auto;
      padding: 24px 16px 40px;
      align-items: center;
      scrollbar-width: none;
    }

    .feed-container {
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }

    .feed-card {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      background: #161b22;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 14px;
    }

    .media-box {
      width: 100%;
      aspect-ratio: 9 / 16;
      min-height: 500px;
      max-height: 720px;
      border-radius: 14px;
      overflow: hidden;
      background: #0b0f14;
    }

    .media-box iframe, .media-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border: 0;
      display: block;
    }

    .promo-media {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .promo-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 18px;
      background: linear-gradient(to top, rgba(0,0,0,0.72), rgba(0,0,0,0.18) 45%, rgba(0,0,0,0.05));

      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background: rgba(255,255,255,0.12);
      color: #fff;

      width: 100%;
      height: 100%;

    .video-play-badge {

      bottom: 18px;

      font-weight: 700;

      height: 0;

    // =====================================================
    // COLUMN 2 FEED SOURCES
    // IMPORTANT:
    // These must be SOCIAL / CONTENT URLs only.
    // Do NOT put affiliate partner URLs here.
    // Examples:
    //   YouTube channel URL
    //   Reddit subreddit URL
    //   Facebook page feed URL or backend proxy target
    //   Instagram profile/reel source URL (backend best-effort only)
    // =====================================================
    const socialFeedInputs = {
      youtubeLatest: 'https://www.youtube.com/@RickAstleyYT/videos',
      youtubePopular: 'https://www.youtube.com/@RickAstleyYT/videos',
      redditHot: '',
      facebookPage: '',
      instagramProfile: '',
      tiktokProfile: ''
    };

    const promoFallbackItems = [
      {
        platform: 'youtube',
        title: 'Rick Astley - Never Gonna Give You Up',
        description: 'Reliable YouTube fallback while the dynamic feed is being wired.',
        author: 'SignalBoost',
        publishedAt: new Date().toISOString(),
        url: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ',
        embedUrl: 'https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ?rel=0&modestbranding=1&playsinline=1',
        thumbnail: 'https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg'
      },
      {
        platform: 'youtube',
        title: 'Mark Ronson ft. Bruno Mars - Uptown Funk',
        description: 'Second reliable YouTube fallback card.',
        author: 'SignalBoost',
        publishedAt: new Date().toISOString(),
        url: 'https://www.youtube.com/watch?v=OPf0YbXqDm0',
        embedUrl: 'https://www.youtube-nocookie.com/embed/OPf0YbXqDm0?rel=0&modestbranding=1&playsinline=1',
        thumbnail: 'https://img.youtube.com/vi/OPf0YbXqDm0/hqdefault.jpg'
      },
      {
        platform: 'youtube',
        title: 'Luis Fonsi - Despacito ft. Daddy Yankee',
        description: 'Third reliable YouTube fallback card.',
        author: 'SignalBoost',
        publishedAt: new Date().toISOString(),
        url: 'https://www.youtube.com/watch?v=kJQP7kiw5Fk',
        embedUrl: 'https://www.youtube-nocookie.com/embed/kJQP7kiw5Fk?rel=0&modestbranding=1&playsinline=1',
        thumbnail: 'https://img.youtube.com/vi/kJQP7kiw5Fk/hqdefault.jpg'
      }
    ];

    const feedSourceConfigs = [
      {
        key: 'reddit',
        buildUrl: function() {
          return '/api/feed/reddit?subreddit=travel&limit=20';
        }
      }
    ];

    const partnersRail = document.getElementById('partnersRail');
    const brandGrid = document.getElementById('brandGrid');
    const feedContainer = document.getElementById('feedContainer');

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatDate(dateString) {
      const d = new Date(dateString);
      if (Number.isNaN(d.getTime())) return '';
      return d.toLocaleString();
    }

    function normalizePlatform(value) {
      return String(value || '').trim().toLowerCase();
    }

    function isValidHttpUrl(value) {
      try {
        const url = new URL(value, window.location.origin);
        return url.protocol === 'http:' || url.protocol === 'https:';
      } catch {
        return false;
      }
    }

    function monetizeUrl(url, meta) {
      if (!isValidHttpUrl(url)) return '#';

      const host = window.location.hostname || '';
      const protocol = window.location.protocol || '';
      const isPreview =
        protocol === 'file:' ||
        host === 'localhost' ||
        host === '127.0.0.1' ||
        host.endsWith('.oausercontent.com') ||
        host.includes('sandbox');

      if (isPreview) return url;

      const params = new URLSearchParams();
      params.set('url', url);
      if (meta?.partner) params.set('partner', meta.partner);
      if (meta?.source) params.set('source', meta.source);
      return '/api/out?' + params.toString();
    }

    function hexToRgb(hex) {
      const clean = String(hex || '').replace('#', '');
      if (clean.length !== 6) return '143,159,179';
      const bigint = parseInt(clean, 16);
      const r = (bigint >> 16) & 255;
      const g = (bigint >> 8) & 255;
      const b = bigint & 255;
      return r + ',' + g + ',' + b;
    }

    function groupPartners(items) {
      const grouped = {};
      items.forEach(function(partner) {
        if (!grouped[partner.category]) grouped[partner.category] = [];
        grouped[partner.category].push(partner);
      });
      return grouped;
    }

    function renderPartners(items) {
      const grouped = groupPartners(items);
      const order = ['Transfers & Transport', 'Car Rentals', 'SIM & Connectivity', 'Tours & Activities', 'Insurance & Claims', 'Flights & Meta Search', 'Storage & Services', 'Specialty & Other'];
      partnersRail.innerHTML = order.filter(function(name) { return grouped[name]?.length; }).map(function(categoryName, index) {
        const color = grouped[categoryName][0].color;
        return '<div class="category">' +
          '<details' + (index === 0 ? ' open' : '') + '>' +
          '<summary style="background:rgba(' + hexToRgb(color) + ',0.12); border-left:4px solid ' + color + ';">' + escapeHtml(categoryName) + '</summary>' +
          '<ul>' + grouped[categoryName].map(function(partner) {
            return '<li><a href="' + escapeHtml(monetizeUrl(partner.url, { partner: partner.name, source: 'column1' })) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(partner.name) + '</a></li>';
          }).join('') + '</ul>' +
          '</details>' +
          '</div>';
      }).join('');
    }

    function renderBrandGrid(items) {
      const colorMap = {
        'Flights & Meta Search': 'rgba(77,210,192,0.15)',
        'Transfers & Transport': 'rgba(77,166,255,0.15)',
        'Tours & Activities': 'rgba(108,217,139,0.15)',
        'SIM & Connectivity': 'rgba(193,125,255,0.15)',
        'Car Rentals': 'rgba(255,184,77,0.15)',
        'Insurance & Claims': 'rgba(255,107,107,0.15)',
        'Storage & Services': 'rgba(255,217,102,0.15)'
      };

      const priority = [
        'Trivago USA','Trivago AR','Trivago BR','Trivago CO','Trivago DE','Trivago MX','Trivago NZ','Trivago PE',
        'Kiwi.com','Kiwi CA','Kiwi MX','Kiwi US','Kiwitaxi','Airalo','Klook','Aviasales',
        'GoCity','Welcome Pickups','Busbud','Localrent.com','Drimsim','Yesim','Tiqets US','Tiqets UK'
      ];

      const selected = [];
      priority.forEach(function(name) {
        const match = items.find(function(p) { return p.name === name; });
        if (match && !selected.some(function(s) { return s.name === match.name; })) selected.push(match);
      });

      items.forEach(function(p) {
        if (selected.length < 24 && p.logo && !selected.some(function(s) { return s.name === p.name; })) {
          selected.push(p);
        }
      });

      brandGrid.innerHTML = selected.map(function(p) {
        const bgColor = colorMap[p.category] || 'rgba(255,255,255,0.04)';
        const borderColor = bgColor.replace('0.15', '0.35');
        return '<a class="brand-tile" style="background:' + bgColor + ';border:1px solid ' + borderColor + ';" href="' + escapeHtml(monetizeUrl(p.url, { partner: p.name, source: 'column3' })) + '" target="_blank" rel="noopener noreferrer">' +
          (p.logo ? '<img src="' + escapeHtml(p.logo) + '" alt="' + escapeHtml(p.name) + '" loading="lazy" onerror="this.style.display=\'none\';">' : '') +
          '<span>' + escapeHtml(p.name) + '</span>' +
          '</a>';
      }).join('');
    }

    function getYouTubeThumb(url) {
      try {
        const parsed = new URL(url);
        const videoId = parsed.searchParams.get('v');
        if (videoId) return 'https://img.youtube.com/vi/' + videoId + '/hqdefault.jpg';
      } catch (e) {}
      return 'https://via.placeholder.com/720x1280/1a1a1a/ffffff?text=YouTube';
    }

    function getYouTubeEmbed(url) {
      try {
        const parsed = new URL(url);
        const videoId = parsed.searchParams.get('v');
        if (videoId) {
          return 'https://www.youtube-nocookie.com/embed/' + videoId + '?rel=0&modestbranding=1&playsinline=1';
        }
      } catch (e) {}
      return '';
    }

    function normalizeFeedItem(item, fallbackPlatform) {
      const platform = normalizePlatform(item.platform || fallbackPlatform || 'deals');
      return {
        platform,
        title: item.title || item.name || 'Untitled',
        description: item.description || item.summary || item.caption || '',
        author: item.author || item.source || 'SignalBoost',
        publishedAt: item.publishedAt || item.date || item.pubDate || new Date().toISOString(),
        url: item.url || item.link || '#',
        embedUrl: item.embedUrl || item.embed || '',
        thumbnail: item.thumbnail || item.image || item.poster || ''
      };
    }

    async function fetchDynamicFeed() {
      const results = await Promise.allSettled(feedSourceConfigs.map(function(source) {
        const requestUrl = source.buildUrl();
        return fetch(requestUrl, { headers: { Accept: 'application/json' } })
          .then(function(res) {
            if (!res.ok) throw new Error(requestUrl + ' -> ' + res.status);
            return res.json();
          })
          .then(function(data) {
            const items = Array.isArray(data) ? data : (data.items || data.results || data.entries || []);
            return items.map(function(item) { return normalizeFeedItem(item, source.key); });
          });
      }));

      const live = [];
      results.forEach(function(result, index) {
        if (result.status === 'fulfilled') {
          live.push.apply(live, result.value);
        } else {
          console.warn('Feed source failed:', feedSourceConfigs[index].key, result.reason);
        }
      });

      return live;
    }

    function buildDynamicFeed(liveItems) {
      if (!liveItems.length) return promoFallbackItems.slice();
      return liveItems;
    }

    function createMediaMarkup(item) {
      const platform = normalizePlatform(item.platform);
      const title = escapeHtml(item.title || 'Untitled');
      const monetized = monetizeUrl(item.url, { partner: item.title, source: 'feed_card' });

      // REDDIT VIDEO PLAYER (MP4)
      if (platform === 'reddit' && item.url && item.url.includes('.mp4')) {
        return '<div class="media-box">' +
          '<video src="' + escapeHtml(item.url) + '" controls playsinline style="width:100%;height:100%;object-fit:cover;"></video>' +
          '</div>';
      }

      // YOUTUBE (fallback or when present)
      if (platform === 'youtube') {
        const embed = item.embedUrl || getYouTubeEmbed(item.url || '');
        if (embed) {
          return '<div class="media-box">' +
            '<iframe src="' + escapeHtml(embed) + '" title="' + title + '" loading="lazy" allowfullscreen></iframe>' +
            '</div>';
        }
      }

      // FALLBACK CARD
      return '<div class="media-box"><a class="promo-media" href="' + escapeHtml(monetized) + '" target="_blank" rel="noopener noreferrer">' +
        '<img src="' + escapeHtml(item.thumbnail || 'https://via.placeholder.com/720x1280?text=SignalBoost') + '" alt="' + title + '" loading="lazy">' +
        '<div class="promo-overlay">' +
        '<div class="promo-kicker">' + escapeHtml(item.platform || 'promo') + '</div>' +
        '<div class="promo-title">' + title + '</div>' +
        '<div class="promo-subtitle">' + escapeHtml(item.description || '') + '</div>' +
        '</div>' +
        '</a></div>';
    }

    function renderFeed(items) {
      feedContainer.innerHTML = items.map(function(item) {
        const monetized = monetizeUrl(item.url, { partner: item.title, source: 'feed_card' });
        return '<article class="feed-card">' +
          createMediaMarkup(item) +
          '<div class="feed-content">' +
          '<h3>' + escapeHtml(item.title) + '</h3>' +
          '<div class="feed-meta"><span class="feed-platform ' + escapeHtml(normalizePlatform(item.platform)) + '">' + escapeHtml(item.platform) + '</span>' + escapeHtml(item.author || '') + ' • ' + escapeHtml(formatDate(item.publishedAt)) + '</div>' +
          '<p>' + escapeHtml(item.description || '') + '</p>' +
          '<a class="feed-link" href="' + escapeHtml(monetized) + '" target="_blank" rel="noopener noreferrer">Open post</a>' +
          '</div>' +
          '</article>';
      }).join('');
    }

    renderPartners(fallbackPartners);
    renderBrandGrid(fallbackPartners);

    fetchDynamicFeed()
      .then(function(liveItems) {
        const finalFeed = buildDynamicFeed(liveItems);
        if (!finalFeed.length) {
          renderFeed(promoFallbackItems);
          return;
        }
        renderFeed(finalFeed);
      })
      .catch(function(err) {
        console.error('Dynamic feed failed.', err);
        renderFeed(promoFallbackItems);
      });

    const search = document.getElementById('partnerSearch');
    search.addEventListener('input', function() {
      const q = search.value.toLowerCase();
      renderPartners(fallbackPartners.filter(function(p) {
        return p.name.toLowerCase().includes(q);
      }));
    });
  </script>
