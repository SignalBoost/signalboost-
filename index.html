<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    SIGNALBOOST V7 - AI-HMI + DARK MODE

    NEW IN THIS VERSION:
    - Dark mode toggle (user-controlled)
    - Theme persistence via localStorage
    - Smooth visual transitions

    DESIGN PRINCIPLE:
    - AI stays invisible
    - UX feels adaptive and intelligent
  -->

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SignalBoost</title>

  <style>
    :root {
      --bg: #eef4ff;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
    }

    body.dark {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --primary: #3b82f6;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: all 0.3s ease;
    }

    .app {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .toggle {
      cursor: pointer;
      font-size: 14px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid #ccc;
      background: var(--card);
    }

    h1 {
      font-size: 36px;
      margin-bottom: 8px;
    }

    .sub {
      color: var(--muted);
      margin-bottom: 20px;
    }

    .search-box {
      display: flex;
      gap: 10px;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 10px;
      background: var(--card);
    }

    input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 16px;
      background: transparent;
      color: var(--text);
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
    }

    .suggestions {
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
    }

    .results {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      background: var(--card);
      display: none;
    }

    .card {
      border-radius: 10px;
      padding: 12px;
      margin-top: 10px;
      background: var(--bg);
    }

    .label {
      font-size: 12px;
      color: var(--primary);
      font-weight: bold;
    }

    .footer {
      margin-top: 40px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="app">

  <!-- TOPBAR -->
  <div class="topbar">
    <div><strong>SignalBoost</strong></div>
    <div class="toggle" onclick="toggleTheme()">🌙 Toggle</div>
  </div>

  <!-- HERO -->
  <h1>Find better options faster</h1>
  <div class="sub">
    Search travel, tech, or business tools. SignalBoost helps you choose the best path.
  </div>

  <!-- SEARCH -->
  <div class="search-box">
    <input id="query" placeholder="Try: hotel in miami, esim for europe, website builder"/>
    <button onclick="runSearch()">Search</button>
  </div>

  <div class="suggestions">
    Try: hotel in miami · esim for europe · start a business · laptop for work
  </div>

  <!-- RESULTS -->
  <div id="results" class="results">
    <div id="explanation"></div>
    <div id="cards"></div>
  </div>

  <div class="footer">
    SignalBoost • Smart discovery layer
  </div>

</div>

<script>
/*
  ==========================================
  DARK MODE SYSTEM
  ==========================================
*/

function toggleTheme() {
  document.body.classList.toggle('dark');

  const isDark = document.body.classList.contains('dark');
  localStorage.setItem('signalboost_theme', isDark ? 'dark' : 'light');
}

/*
  Load saved theme on page load
*/
(function initTheme() {
  const saved = localStorage.getItem('signalboost_theme');
  if (saved === 'dark') {
    document.body.classList.add('dark');
  }
})();

/*
  ==========================================
  AI-HMI SEARCH
  ==========================================
*/

async function runSearch() {
  const query = document.getElementById('query').value.trim();
  if (!query) return alert("Enter something");

  const resultsBox = document.getElementById('results');
  const explanation = document.getElementById('explanation');
  const cards = document.getElementById('cards');

  resultsBox.style.display = "block";
  explanation.innerHTML = "Analyzing your request...";
  cards.innerHTML = "";

  try {
    const res = await fetch('/api/intent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query })
    });

    const data = await res.json();

    explanation.innerHTML = `
      <strong>Best match:</strong> ${data.department} → ${data.subdepartment}<br/>
      <span style="color:var(--muted)">${data.reasoning}</span>
    `;

    const links = getLinks(data);

    cards.innerHTML = links.map(l => `
      <div class="card">
        <div class="label">${l.label}</div>
        <div><strong>${l.title}</strong></div>
        <div style="color:var(--muted)">${l.desc}</div>
        <button onclick="go('${l.url}')">Open</button>
      </div>
    `).join("");

  } catch (e) {
    explanation.innerHTML = "Something went wrong.";
  }
}

/*
  ==========================================
  PROVIDERS
  ==========================================
*/

function getLinks(data) {
  if (data.department === "travel") {
    return [
      {
        label: "Best match",
        title: "Expedia Hotels",
        desc: "Good for hotel bookings",
        url: "https://expedia.com"
      },
      {
        label: "Alternative",
        title: "Hotels.com",
        desc: "Useful for deals",
        url: "https://hotels.com"
      }
    ];
  }

  if (data.department === "tech") {
    return [
      {
        label: "Best match",
        title: "eSIM Plans",
        desc: "Stay connected abroad",
        url: "#"
      }
    ];
  }

  if (data.department === "business") {
    return [
      {
        label: "Best match",
        title: "Website Builder",
        desc: "Start your business online",
        url: "#"
      }
    ];
  }

  return [];
}

/*
  ==========================================
  NAVIGATION
  ==========================================
*/

function go(url) {
  window.location.href = url;
}
</script>

</body>
</html>
