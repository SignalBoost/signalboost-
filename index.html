<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SignalBoostAi Feed</title>
  <style>
    .card { margin: 20px; padding: 10px; border: 1px solid #ccc; }
    .media-shell, .reddit-wrap { max-width: 600px; margin: auto; }
    iframe, blockquote { width: 100%; }

    /* Subscription box styling */
    .subscribe-box {
      max-width: 500px;
      margin: 40px auto;
      padding: 30px;
      background: #111;
      color: #fff;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(255, 165, 0, 0.3);
      text-align: center;
    }
    .subscribe-box h2 {
      margin-bottom: 10px;
      font-size: 1.8em;
    }
    .subscribe-box p {
      margin-bottom: 20px;
      font-size: 1.1em;
      color: #ccc;
    }
    .subscribe-box input {
      width: 65%;
      padding: 12px;
      border: none;
      border-radius: 5px;
      margin-right: 10px;
    }
    .subscribe-box button {
      padding: 12px 24px;
      background: orange;
      border: none;
      border-radius: 5px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .subscribe-box button:hover {
      background: #ff7f00;
    }
  </style>
</head>
<body>
  <div id="video-feed"></div>

  <script>
    // 🔹 Example dynamic dataset
    const videos = [
      { type: "youtube", id: "dQw4w9WgXcQ", title: "SignalBoost YouTube Feature" },
      { type: "reddit", url: "https://www.reddit.com/r/videos/comments/abc123/my_video_title/", title: "SignalBoost Reddit Feature" },
      { type: "youtube", id: "3JZ_D3ELwOQ", title: "Another YouTube Feature" },
      { type: "reddit", url: "https://www.reddit.com/r/webdev/comments/xyz456/example_post/", title: "Another Reddit Feature" },
      { type: "youtube", id: "kxopViU98Xo", title: "Third YouTube Feature" }
    ];

    const feed = document.getElementById("video-feed");

    // 🔹 Create cards and inject subscription box every 5th item
    videos.forEach((video, index) => {
      const card = document.createElement("div");
      card.className = "card";

      if (video.type === "youtube") {
        card.innerHTML = `
          <div class="media-shell">
            <iframe
              class="lazy-youtube"
              title="${video.title}"
              data-src="https://www.youtube.com/embed/${video.id}?autoplay=1&mute=1&playsinline=1"
              allow="autoplay; encrypted-media; picture-in-picture"
              allowfullscreen
            ></iframe>
          </div>
        `;
      }

      if (video.type === "reddit") {
        card.innerHTML = `
          <div class="reddit-wrap">
            <blockquote
              class="reddit-embed-bq lazy-reddit"
              data-embed-theme="dark"
              data-embed-height="400"
              data-embed-width="600"
              data-embed-showmedia="true"
              data-embed-src="${video.url}"
            >
              <a href="${video.url}">View on Reddit</a>
            </blockquote>
          </div>
        `;
      }

      feed.appendChild(card);

      // Insert subscription box every 5th card
      if ((index + 1) % 5 === 0) {
        const subBox = document.createElement("div");
        subBox.className = "subscribe-box";
        subBox.innerHTML = `
          <h2>Stay in the Loop</h2>
          <p>Get weekly drops of trending TikTok & YouTube reviews plus exclusive deals from SignalBoostAi.</p>
          <form>
            <input type="email" placeholder="Enter your email" required>
            <button type="submit">Subscribe</button>
          </form>
        `;
        feed.appendChild(subBox);
      }
    });

    // 🔹 Lazy‑loading with IntersectionObserver
    const lazyLoad = (selector, attribute) => {
      const elements = document.querySelectorAll(selector);
      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const el = entry.target;
            const src = el.getAttribute(attribute);
            if (src) {
              if (el.tagName === "IFRAME") {
                el.src = src;
              } else if (el.tagName === "BLOCKQUOTE") {
                el.setAttribute("data-embed-src", src);
                // Trigger Reddit embed script
                window.__redditEmbed && window.__redditEmbed.init();
              }
              observer.unobserve(el);
            }
          }
        });
      });
      elements.forEach(el => observer.observe(el));
    };

    lazyLoad(".lazy-youtube", "data-src");
    lazyLoad(".lazy-reddit", "data-embed-src");

    // 🔹 Load Reddit embed script once
    const redditScript = document.createElement("script");
    redditScript.src = "https://embed.redditmedia.com/widgets/platform.js";
    redditScript.async = true;
    redditScript.onload = () => {
      window.__redditEmbed = window.__redditEmbed || {};
      window.__redditEmbed.init = window.__redditEmbed.init || function(){};
    };
    document.body.appendChild(redditScript);
  </script>
</body>
</html>
