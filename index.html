<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SignalBoost AI</title>
  <style>
    :root {
      --bg: #eef4ff;
      --surface: rgba(255,255,255,0.85);
      --border: rgba(148,163,184,.25);
      --text: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
      --accent: #06b6d4;
      --shadow: 0 20px 60px rgba(15,23,42,.08);
    }

    body.dark {
      --bg:#0b1220;
      --surface: rgba(20,30,50,.8);
      --text:#e2e8f0;
      --muted:#94a3b8;
      --border: rgba(255,255,255,.1);
    }

    body{
      margin:0;
      font-family: Inter, Arial;
      background:var(--bg);
      color:var(--text);
      transition:.3s;
    }

    .app{max-width:1200px;margin:auto;padding:16px}

    .topbar{
      display:flex;justify-content:space-between;align-items:center;
      padding:12px;border-radius:16px;
      background:var(--surface);border:1px solid var(--border);
      box-shadow:var(--shadow)
    }

    .logo{font-weight:900}

    .btn{padding:10px 14px;border-radius:999px;border:none;cursor:pointer;font-weight:700}
    .primary{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff}
    .ghost{background:transparent;border:1px solid var(--border)}

    .hero{margin-top:20px;background:var(--surface);padding:30px;border-radius:24px;border:1px solid var(--border)}

    h1{font-size:42px;margin:0}

    .prompt{
      margin-top:20px;padding:12px;border-radius:20px;
      background:#fff;border:1px solid var(--border);
      display:flex;gap:10px
    }

    body.dark .prompt{background:#111827}

    input{flex:1;border:none;outline:none;font-size:18px;background:transparent;color:inherit}

    .thinking{font-size:13px;color:var(--muted);margin-top:6px;opacity:0}

    .suggestions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}

    .chip{padding:8px 12px;border-radius:999px;border:1px solid var(--border);cursor:pointer;font-size:12px}

    .mode-switch{margin-top:20px;display:flex;gap:10px}

    .module{margin-top:20px;padding:20px;border-radius:20px;background:var(--surface);border:1px solid var(--border)}

    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}

    .card{padding:14px;border-radius:16px;border:1px solid var(--border);background:rgba(255,255,255,.6)}

    body.dark .card{background:rgba(30,40,60,.6)}

    .label{font-size:11px;color:var(--muted)}

    .strong{font-weight:800}

    @media(max-width:800px){
      .grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
<div class="app">

<div class="topbar">
  <div class="logo">SignalBoost AI</div>
  <div>
    <button class="ghost" onclick="toggleDark()">Dark</button>
    <button class="btn primary">Assistant</button>
  </div>
</div>

<section class="hero">
  <h1>What do you want to do?</h1>

  <div class="prompt">
    <input id="input" placeholder="Ask anything..." />
    <button class="btn primary" onclick="runAI()">Go</button>
  </div>
  <div id="thinking" class="thinking">AI thinking...</div>

  <div class="suggestions">
    <div class="chip" onclick="quick('Plan travel')">Plan travel</div>
    <div class="chip" onclick="quick('Find trends')">Find trends</div>
    <div class="chip" onclick="quick('Compare platforms')">Compare</div>
  </div>

  <div class="mode-switch">
    <button class="ghost" onclick="setMode('travel')">Travel</button>
    <button class="ghost" onclick="setMode('finance')">Finance</button>
    <button class="ghost" onclick="setMode('social')">Social</button>
  </div>
</section>

<section class="module">
  <h2>Next actions</h2>
  <div class="grid" id="actions"></div>
</section>

<section class="module">
  <h2>Recommended</h2>
  <div class="grid" id="recommend"></div>
</section>

<section class="module">
  <h2>Optional</h2>
  <div class="grid" id="optional"></div>
</section>

</div>

<script>
function toggleDark(){document.body.classList.toggle('dark')}

function quick(text){document.getElementById('input').value=text;runAI()}

function runAI(){
  const t=document.getElementById('thinking')
  t.style.opacity=1

  setTimeout(()=>{
    t.style.opacity=0
    render('general')
  },1200)
}

function setMode(mode){render(mode)}

function card(title,desc){
  return `<div class='card'><div class='label'>Suggested</div><div class='strong'>${title}</div><div>${desc}</div></div>`
}

function render(mode){
  const actions=document.getElementById('actions')
  const rec=document.getElementById('recommend')
  const opt=document.getElementById('optional')

  if(mode==='travel'){
    actions.innerHTML=card('Book flight','Start with timing')
    rec.innerHTML=card('Choose hotel','Compare locations')
    opt.innerHTML=card('Explore food','Optional planning')
  }
  else if(mode==='finance'){
    actions.innerHTML=card('Setup account','Primary step')
    rec.innerHTML=card('Compare cards','Best options')
    opt.innerHTML=card('Track spending','Optional tool')
  }
  else{
    actions.innerHTML=card('Review signals','Top trends now')
    rec.innerHTML=card('Compare options','Best picks')
    opt.innerHTML=card('Explore more','Optional discovery')
  }
}

render('general')
</script>

</body>
</html>
