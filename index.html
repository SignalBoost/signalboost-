<!DOCTYPE html>
<html lang="en" data-i18n-ready="1">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SignalBoost</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: #fff;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: #161b22;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 18px;
      font-weight: 900;
      color: #f5c542;
    }

    .layout {
      display: grid;
      grid-template-columns: 280px 1fr 240px;
      min-height: calc(100vh - 58px);
    }

    .sidebar,
    .rightbar {
      background: #11161d;
      border-right: 1px solid rgba(255,255,255,0.06);
      padding: 16px;
      overflow-y: auto;
    }

    .rightbar {
      border-right: 0;
      border-left: 1px solid rgba(255,255,255,0.06);
    }

    .main {
      padding: 18px;
      overflow-y: auto;
    }

    .section-title {
      font-size: 13px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.6);
      margin-bottom: 10px;
      font-weight: 800;
    }

    .partner-card,
    .feed-card,
    .chip {
      background: #161b22;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
    }
</html>
