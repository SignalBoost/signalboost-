<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SignalBoost AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
font-family: Arial, sans-serif;
margin: 0;
background: #f7f9fc;
color: #222;
}

.container {
max-width: 900px;
margin: 80px auto;
padding: 20px;
text-align: center;
}

h1 {
font-size: 32px;
margin-bottom: 10px;
}

p {
color: #555;
margin-bottom: 30px;
}

.search-box {
display: flex;
gap: 10px;
justify-content: center;
flex-wrap: wrap;
}

input {
padding: 12px;
width: 300px;
border-radius: 8px;
border: 1px solid #ccc;
font-size: 16px;
}

button {
padding: 12px 18px;
border: none;
border-radius: 8px;
cursor: pointer;
font-size: 16px;
}

.btn-primary {
background: #007bff;
color: white;
}

.btn-secondary {
background: #ddd;
}

button:hover {
opacity: 0.9;
}
</style>
</head>

<body>

<div class="container">

<h1>Find hotels and stays faster</h1>
<p>Search real hotel deals and go directly to trusted booking partners.</p>

<div class="search-box">
<input
id="searchInput"
type="text"
placeholder="Try: Paris, New York, Tokyo"
onkeydown="handleSearchKey(event)"
/>

<button class="btn-primary" onclick="runSmartRouting()">Search</button>
<button class="btn-secondary" onclick="clearSearchRouting()">Clear</button>
</div>

</div>

<script>

function runSmartRouting() {
const input = document.getElementById("searchInput");
const query = input.value.trim();

if (!query) {
alert("Please enter a destination.");
return;
}

const encoded = encodeURIComponent(query);

// Working affiliate-safe routing (Expedia example)
const url = `https://www.expedia.com/Hotel-Search?destination=${encoded}`;

window.open(url, "_blank");
}

function handleSearchKey(event) {
if (event.key === "Enter") {
runSmartRouting();
}
}

function clearSearchRouting() {
document.getElementById("searchInput").value = "";
}

</script>

</body>
</html>
