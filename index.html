<!--
================ SIGNALBOOST AI PROJECT BRAIN ================

PROJECT IDENTITY
- Name: SignalBoost AI
- Goal: AI-driven HMI interface
- Core Idea: AI cockpit + adaptive UI

DESIGN PRINCIPLES
- AI is the main interface (not a feature)
- One clear next action
- Visible feedback for every interaction
- Adaptive layout based on user intent

CURRENT FEATURES
- Prompt input (AI interaction entry point)
- Mode switching (travel, finance, social)
- AI response simulation
- Card-based recommendation system
- Adaptive section content by mode
- Adaptive hero styling by mode
- Adaptive side panel and session rail by mode
- Split-layout homepage with workspace context
- Mode-based module reordering
- Additional insight and planning modules

NEXT STEPS
- Make modules appear and disappear more aggressively by mode
- Real AI integration (API / LLM)
- State memory (session awareness)
- Workspaces (task-based UI environments)
- Add saved session handoff patterns for new chats
- Connect prompt meaning to automatic mode selection

NOTES
- This file acts as BOTH UI and documentation
- Always update this section when evolving the system
- This allows full recovery in a new chat

==============================================================
-->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SignalBoost AI</title>
<style>
:root {
  --bg:#eef4ff;
  --surface:rgba(255,255,255,0.85);
  --border:rgba(148,163,184,.25);
  --text:#0f172a;
  --muted:#64748b;
  --primary:#2563eb;
  --accent:#06b6d4;
  --shadow:0 20px 60px rgba(15,23,42,.08);
}

body.dark {
  --bg:#0b1220;
  --surface:rgba(20,30,50,.85);
  --text:#e2e8f0;
  --muted:#94a3b8;
  --border:rgba(255,255,255,.1);
}

body{
  margin:0;
  font-family:Inter, Arial;
  background:var(--bg);
  color:var(--text);
  transition:.3s;
}

.app{max-width:1200px;margin:auto;padding:16px}

.topbar{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px;border-radius:16px;
  background:var(--surface);border:1px solid var(--border);
  box-shadow:var(--shadow)
}

.logo{font-weight:900}

.btn{padding:10px 14px;border-radius:999px;border:none;cursor:pointer;font-weight:700}
.primary{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff}
.ghost{background:transparent;border:1px solid var(--border)}

.hero{
  margin-top:20px;
  background:var(--surface);
  padding:30px;
  border-radius:24px;
  border:1px solid var(--border);
  display:grid;
  grid-template-columns:1.3fr .9fr;
  gap:18px;
  align-items:start;
}

h1{font-size:42px;margin:0}

.prompt{
  margin-top:20px;
  padding:12px;
  border-radius:20px;
  background:#fff;
  border:1px solid var(--border);
  display:flex;
  gap:10px;
  transition:.2s;
}

.prompt:focus-within{
  border-color:var(--primary);
  box-shadow:0 0 0 2px rgba(37,99,235,.15);
}

body.dark .prompt{background:#111827}

input{
  flex:1;
  border:none;
  outline:none;
  font-size:18px;
  background:transparent;
  color:inherit
}

.thinking{
  font-size:13px;
  color:var(--muted);
  margin-top:6px;
  opacity:0;
  transition:.3s
}

.response{
  margin-top:12px;
  padding:12px;
  border-radius:14px;
  background:rgba(37,99,235,.08);
  border:1px solid rgba(37,99,235,.2);
  font-size:14px;
  line-height:1.6;
}

.suggestions{
  margin-top:10px;
  display:flex;
  gap:8px;
  flex-wrap:wrap
}

.chip{
  padding:8px 12px;
  border-radius:999px;
  border:1px solid var(--border);
  cursor:pointer;
  font-size:12px;
}

.mode-switch{
  margin-top:20px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.hero-side-panel{
  padding:16px;
  border-radius:18px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.55);
}

body.dark .hero-side-panel{background:rgba(30,40,60,.55)}

.hero-side-panel h3{
  margin:0 0 10px 0;
  font-size:18px;
}

.hero-list{
  display:grid;
  gap:10px;
}

.hero-list-item{
  padding:10px 12px;
  border-radius:14px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.45);
  font-size:13px;
  line-height:1.5;
}

body.dark .hero-list-item{background:rgba(17,24,39,.55)}

.layout-shell{
  display:grid;
  grid-template-columns:1.4fr .8fr;
  gap:20px;
}

.side-rail{
  display:grid;
  gap:20px;
}

.rail-card{
  margin-top:20px;
  padding:20px;
  border-radius:20px;
  background:var(--surface);
  border:1px solid var(--border);
}

.rail-card h2{
  margin:0 0 10px 0;
}

.rail-list{
  display:grid;
  gap:10px;
}

.rail-list-item{
  padding:12px;
  border-radius:14px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.45);
  font-size:13px;
  line-height:1.5;
}

body.dark .rail-list-item{background:rgba(17,24,39,.55)}

.module{
  margin-top:20px;
  padding:20px;
  border-radius:20px;
  background:var(--surface);
  border:1px solid var(--border)
}

.module.hidden{display:none}

.module-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}

.mode-badge{
  padding:7px 10px;
  border-radius:999px;
  border:1px solid var(--border);
  font-size:11px;
  color:var(--muted);
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-top:14px
}

.card{
  padding:14px;
  border-radius:16px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.6);
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
  box-shadow:0 8px 20px rgba(0,0,0,.05);
}

body.dark .card{background:rgba(30,40,60,.6)}

.label{font-size:11px;color:var(--muted)}
.strong{font-weight:800}

@media(max-width:1000px){
  .hero,.layout-shell{grid-template-columns:1fr}
}

@media(max-width:800px){
  .grid{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">

<div class="topbar">
  <div class="logo">SignalBoost AI</div>
  <div>
    <button class="ghost" onclick="toggleDark()">Dark</button>
    <button class="btn primary">Assistant</button>
  </div>
</div>

<div class="layout-shell">
<div>
<section class="hero">
  <div>
    <h1>What do you want to do?</h1>

    <div class="prompt">
      <input id="input" placeholder="Ask anything..." />
      <button class="btn primary" onclick="runAI()">Go</button>
    </div>

    <div id="thinking" class="thinking">AI thinking...</div>
    <div id="response" class="response" style="display:none"></div>

    <div class="suggestions">
      <div class="chip" onclick="quick('Plan travel')">Plan travel</div>
      <div class="chip" onclick="quick('Find trends')">Find trends</div>
      <div class="chip" onclick="quick('Compare platforms')">Compare</div>
    </div>

    <div class="mode-switch">
      <button class="ghost" onclick="setMode('travel')">Travel</button>
      <button class="ghost" onclick="setMode('finance')">Finance</button>
      <button class="ghost" onclick="setMode('social')">Social</button>
    </div>
  </div>

  <div id="heroPanel" class="hero-side-panel">
    <h3 id="heroPanelTitle">AI overview</h3>
    <div id="heroPanelList" class="hero-list"></div>
  </div>
</section>

<section class="module" id="actionsModule" data-base-order="1">
  <div class="module-header">
    <h2 id="actionsTitle">Next actions</h2>
    <span class="mode-badge" id="actionsBadge">Core</span>
  </div>
  <div class="grid" id="actions"></div>
</section>

<section class="module" id="recommendModule" data-base-order="2">
  <div class="module-header">
    <h2 id="recommendTitle">Recommended</h2>
    <span class="mode-badge" id="recommendBadge">Suggested</span>
  </div>
  <div class="grid" id="recommend"></div>
</section>

<section class="module" id="optionalModule" data-base-order="3">
  <div class="module-header">
    <h2 id="optionalTitle">Optional</h2>
    <span class="mode-badge" id="optionalBadge">Flexible</span>
  </div>
  <div class="grid" id="optional"></div>
</section>

<section class="module" id="insightModule" data-base-order="4">
  <div class="module-header">
    <h2 id="insightTitle">AI insights</h2>
    <span class="mode-badge" id="insightBadge">Live</span>
  </div>
  <div class="grid" id="insightGrid"></div>
</section>

<section class="module" id="planningModule" data-base-order="5">
  <div class="module-header">
    <h2 id="planningTitle">Planning board</h2>
    <span class="mode-badge" id="planningBadge">Workflow</span>
  </div>
  <div class="grid" id="planningGrid"></div>
</section>
</div>

<aside class="side-rail">
  <section class="rail-card">
    <h2>Session state</h2>
    <div id="sessionList" class="rail-list"></div>
  </section>

  <section class="rail-card">
    <h2>Why this mode</h2>
    <div id="whyMode" class="rail-list"></div>
  </section>
</aside>
</div>

<script>
function toggleDark(){document.body.classList.toggle('dark')}

function quick(text){
  document.getElementById('input').value=text;
  runAI();
}

let currentMode = 'general';

function runAI(){
  const t=document.getElementById('thinking');
  const r=document.getElementById('response');

  t.style.opacity=1;
  r.style.display='none';

  setTimeout(()=>{
    t.style.opacity=0;
    r.style.display='block';

    const val=document.getElementById('input').value;

    r.innerText=`AI suggests starting with the most important step for: "${val}". The interface now highlights the best next actions and reduces unnecessary choices.`;

    render(currentMode);
  },1000);
}

function setMode(mode){
  currentMode = mode;
  render(mode);
}

function card(title,desc){
  return `<div class='card'>
    <div class='label'>Suggested</div>
    <div class='strong'>${title}</div>
    <div>${desc}</div>
  </div>`;
}

function render(mode){
  const actions=document.getElementById('actions');
  const rec=document.getElementById('recommend');
  const opt=document.getElementById('optional');
  const hero=document.querySelector('.hero');
  const response=document.getElementById('response');
  const buttons=document.querySelectorAll('.mode-switch .ghost');
  const heroPanelTitle=document.getElementById('heroPanelTitle');
  const heroPanelList=document.getElementById('heroPanelList');
  const sessionList=document.getElementById('sessionList');
  const whyMode=document.getElementById('whyMode');
  const insightGrid=document.getElementById('insightGrid');
  const planningGrid=document.getElementById('planningGrid');

  const actionsModule=document.getElementById('actionsModule');
  const recommendModule=document.getElementById('recommendModule');
  const optionalModule=document.getElementById('optionalModule');
  const insightModule=document.getElementById('insightModule');
  const planningModule=document.getElementById('planningModule');

  const actionsTitle=document.getElementById('actionsTitle');
  const recommendTitle=document.getElementById('recommendTitle');
  const optionalTitle=document.getElementById('optionalTitle');
  const insightTitle=document.getElementById('insightTitle');
  const planningTitle=document.getElementById('planningTitle');

  const actionsBadge=document.getElementById('actionsBadge');
  const recommendBadge=document.getElementById('recommendBadge');
  const optionalBadge=document.getElementById('optionalBadge');
  const insightBadge=document.getElementById('insightBadge');
  const planningBadge=document.getElementById('planningBadge');

  const mainColumn = document.querySelector('.layout-shell > div');

  const list = items => items.map(item => `<div class='hero-list-item'>${item}</div>`).join('');
  const rail = items => items.map(item => `<div class='rail-list-item'>${item}</div>`).join('');
  const cardSet = items => items.map(item => card(item[0], item[1])).join('');

  function show(module, shouldShow=true){
    module.classList.toggle('hidden', !shouldShow);
  }

  function reorder(ids){
    ids.forEach(id => {
      const el = document.getElementById(id);
      if(el) mainColumn.appendChild(el);
    });
  }

  buttons.forEach(btn => btn.style.background='transparent');
  if(mode==='travel' && buttons[0]) buttons[0].style.background='rgba(37,99,235,.08)';
  if(mode==='finance' && buttons[1]) buttons[1].style.background='rgba(37,99,235,.08)';
  if(mode==='social' && buttons[2]) buttons[2].style.background='rgba(37,99,235,.08)';

  hero.style.transition = '.3s';

  if(mode==='travel'){
    reorder(['actionsModule','planningModule','recommendModule','insightModule','optionalModule']);
    show(actionsModule,true); show(planningModule,true); show(recommendModule,true); show(insightModule,true); show(optionalModule,true);

    hero.style.background='linear-gradient(135deg, rgba(59,130,246,.12), rgba(6,182,212,.10))';
    actionsTitle.textContent='Immediate travel actions';
    recommendTitle.textContent='Travel recommendations';
    optionalTitle.textContent='Arrival extras';
    insightTitle.textContent='Travel insight stack';
    planningTitle.textContent='Journey planner';
    actionsBadge.textContent='First steps';
    recommendBadge.textContent='Compare';
    optionalBadge.textContent='Optional';
    insightBadge.textContent='AI ranked';
    planningBadge.textContent='Trip flow';

    actions.innerHTML = cardSet([
      ['Book flight','Start with timing, route, and travel window.'],
      ['Check entry rules','Confirm passport, visa, and arrival requirements.'],
      ['Set arrival plan','Prepare transport and first-day essentials.']
    ]);
    planningGrid.innerHTML = cardSet([
      ['Travel timeline','Lock departure, arrival, and check-in sequence.'],
      ['Stay decision map','Compare access, safety, and neighborhood fit.'],
      ['Arrival checklist','Transport, payments, internet, and food backup.']
    ]);
    rec.innerHTML = cardSet([
      ['Choose hotel','Compare location, safety, and access.'],
      ['Compare local transport','Rank airport transfer and city mobility options.'],
      ['Build itinerary','Turn ideas into a practical sequence.']
    ]);
    insightGrid.innerHTML = cardSet([
      ['Most important dependency','Flight timing affects everything else.'],
      ['Highest-friction risk','Entry requirements can block the whole plan.'],
      ['Best HMI behavior','Guide by trip stage, not by tool type.']
    ]);
    opt.innerHTML = cardSet([
      ['Explore food','Save a few strong nearby options.'],
      ['Find activities','Keep flexible discovery ideas ready.'],
      ['Pack checklist','Reduce last-minute mistakes.']
    ]);
    heroPanelTitle.textContent='Travel workspace';
    heroPanelList.innerHTML=list([
      'Priority stack: route, entry, stay, arrival.',
      'The UI should reduce trip uncertainty step by step.',
      'Strong HMI goal: make the next decision obvious.'
    ]);
    sessionList.innerHTML=rail([
      '<strong>Current mode:</strong> Travel planning',
      '<strong>Primary intent:</strong> Reduce friction before departure',
      '<strong>Next likely action:</strong> Compare flights and stays'
    ]);
    whyMode.innerHTML=rail([
      'Travel mode groups decisions by journey stage instead of by website category.',
      'This makes the interface feel like a guided trip assistant rather than a menu of tools.',
      'Modules reorder around movement, arrival, and readiness.'
    ]);
    response.style.display='block';
    response.innerText='Travel mode now changes both content and module order, so the page behaves like a trip-planning workspace.';
  }
  else if(mode==='finance'){
    reorder(['actionsModule','insightModule','recommendModule','planningModule','optionalModule']);
    show(actionsModule,true); show(insightModule,true); show(recommendModule,true); show(planningModule,true); show(optionalModule,true);

    hero.style.background='linear-gradient(135deg, rgba(16,185,129,.10), rgba(37,99,235,.08))';
    actionsTitle.textContent='Critical money actions';
    recommendTitle.textContent='Finance recommendations';
    optionalTitle.textContent='Optional controls';
    insightTitle.textContent='Risk and clarity';
    planningTitle.textContent='Money workflow';
    actionsBadge.textContent='Priority';
    recommendBadge.textContent='Best fit';
    optionalBadge.textContent='Secondary';
    insightBadge.textContent='Risk';
    planningBadge.textContent='Control';

    actions.innerHTML = cardSet([
      ['Setup account','Start with the main financial tool you need first.'],
      ['Check payment access','Make sure cards and transfers will work where needed.'],
      ['Set budget guardrails','Define a safe range before spending decisions.']
    ]);
    insightGrid.innerHTML = cardSet([
      ['Main decision lens','Safety and access come before optimization.'],
      ['Biggest risk','Using the wrong payment path too late.'],
      ['Best HMI behavior','Reduce money anxiety with clear sequencing.']
    ]);
    rec.innerHTML = cardSet([
      ['Compare cards','Surface the best options for rewards or low fees.'],
      ['Track spending','Create a simple overview of current outflow.'],
      ['Review transfer options','Choose the most practical path for moving money.']
    ]);
    planningGrid.innerHTML = cardSet([
      ['Account setup flow','Primary account, transfers, and fallback path.'],
      ['Spending map','Where money will move first and most often.'],
      ['Decision guardrails','Budget limits and fee awareness.']
    ]);
    opt.innerHTML = cardSet([
      ['Watch exchange rates','Useful if you are moving across currencies.'],
      ['Create savings target','Optional planning for a larger goal.'],
      ['Review subscriptions','Trim low-value recurring costs.']
    ]);
    heroPanelTitle.textContent='Finance workspace';
    heroPanelList.innerHTML=list([
      'Priority stack: setup, access, compare, control.',
      'The UI should protect attention and reduce unnecessary money decisions.',
      'Strong HMI goal: show safety and clarity before optional tools.'
    ]);
    sessionList.innerHTML=rail([
      '<strong>Current mode:</strong> Finance guidance',
      '<strong>Primary intent:</strong> Improve control and confidence',
      '<strong>Next likely action:</strong> Compare accounts or cards'
    ]);
    whyMode.innerHTML=rail([
      'Finance mode moves the user from financial setup to better decisions in a controlled sequence.',
      'This structure reduces overwhelm by separating essential actions from optional analysis.',
      'Modules reorder around risk, access, and control.'
    ]);
    response.style.display='block';
    response.innerText='Finance mode now places risk and clarity ahead of optional planning, making the page feel safer and more focused.';
  }
  else if(mode==='social'){
    reorder(['insightModule','actionsModule','recommendModule','optionalModule','planningModule']);
    show(insightModule,true); show(actionsModule,true); show(recommendModule,true); show(optionalModule,true); show(planningModule,true);

    hero.style.background='linear-gradient(135deg, rgba(168,85,247,.10), rgba(236,72,153,.08))';
    actionsTitle.textContent='Social actions';
    recommendTitle.textContent='Channel recommendations';
    optionalTitle.textContent='Creative extras';
    insightTitle.textContent='Signal board';
    planningTitle.textContent='Publishing sequence';
    actionsBadge.textContent='Action';
    recommendBadge.textContent='Channel';
    optionalBadge.textContent='Creative';
    insightBadge.textContent='Signals';
    planningBadge.textContent='Rollout';

    insightGrid.innerHTML = cardSet([
      ['Attention spike','The strongest conversations should be seen first.'],
      ['Message fit','Not every platform deserves the same content.'],
      ['Best HMI behavior','Translate noise into a clear publishing path.']
    ]);
    actions.innerHTML = cardSet([
      ['Review signals','Start with the strongest live conversations.'],
      ['Compare platforms','Match the message to the right channel.'],
      ['Choose audience path','Decide where attention matters most first.']
    ]);
    rec.innerHTML = cardSet([
      ['Draft content angle','Shape the main idea before publishing.'],
      ['Rank best channels','Identify where the content will perform best.'],
      ['Plan release order','Sequence the rollout instead of posting randomly.']
    ]);
    opt.innerHTML = cardSet([
      ['Explore creators','Find possible collaborators.'],
      ['Save trend references','Keep examples for later use.'],
      ['Review engagement later','Optional follow-up analysis.']
    ]);
    planningGrid.innerHTML = cardSet([
      ['Channel stack','Choose primary, secondary, and support channels.'],
      ['Release flow','Decide what posts first and what follows.'],
      ['Feedback loop','Watch engagement and refine direction.']
    ]);
    heroPanelTitle.textContent='Social workspace';
    heroPanelList.innerHTML=list([
      'Priority stack: signals, channel fit, content direction.',
      'The UI should convert noise into publishing choices.',
      'Strong HMI goal: make audience and timing easier to read.'
    ]);
    sessionList.innerHTML=rail([
      '<strong>Current mode:</strong> Social intelligence',
      '<strong>Primary intent:</strong> Turn signals into action',
      '<strong>Next likely action:</strong> Choose a channel strategy'
    ]);
    whyMode.innerHTML=rail([
      'Social mode is organized around attention, message fit, and release sequence.',
      'This creates a more AI-native interface for content planning instead of a simple social dashboard.',
      'Modules reorder around signal reading, publishing, and channel choice.'
    ]);
    response.style.display='block';
    response.innerText='Social mode now leads with signals and channel fit, so the page behaves more like an AI publishing cockpit.';
  }
  else {
    reorder(['actionsModule','recommendModule','insightModule','planningModule','optionalModule']);
    show(actionsModule,true); show(recommendModule,true); show(insightModule,true); show(planningModule,true); show(optionalModule,true);

    hero.style.background='var(--surface)';
    actionsTitle.textContent='Next actions';
    recommendTitle.textContent='Recommended';
    optionalTitle.textContent='Optional';
    insightTitle.textContent='AI insights';
    planningTitle.textContent='Planning board';
    actionsBadge.textContent='Core';
    recommendBadge.textContent='Suggested';
    optionalBadge.textContent='Flexible';
    insightBadge.textContent='Live';
    planningBadge.textContent='Workflow';

    actions.innerHTML = cardSet([
      ['Review signals','Top trends ranked and simplified.'],
      ['Choose a mode','Travel, finance, or social.'],
      ['Start a prompt','Tell the system your goal.']
    ]);
    rec.innerHTML = cardSet([
      ['Compare options','Best choices surfaced first.'],
      ['Reduce noise','Hide low-value paths quickly.'],
      ['Focus next step','Keep the user moving with clarity.']
    ]);
    insightGrid.innerHTML = cardSet([
      ['Homepage role','Act like an AI control center.'],
      ['Primary behavior','Guide the user toward clearer action.'],
      ['Design direction','Move from fixed layout to adaptive system.']
    ]);
    planningGrid.innerHTML = cardSet([
      ['Mode map','Travel, finance, and social workspaces.'],
      ['Prompt flow','Ask, interpret, guide, refine.'],
      ['Session continuity','Keep the project brain inside the file.']
    ]);
    opt.innerHTML = cardSet([
      ['Explore more','Additional discovery.'],
      ['Save directions','Keep useful paths for later.'],
      ['Refine intent','Improve the system response.']
    ]);
    heroPanelTitle.textContent='AI overview';
    heroPanelList.innerHTML=list([
      'The homepage acts like an AI control center.',
      'The user should move from prompt to guided action quickly.',
      'Modes will progressively reshape more of the interface.'
    ]);
    sessionList.innerHTML=rail([
      '<strong>Current mode:</strong> General overview',
      '<strong>Primary intent:</strong> Understand available paths',
      '<strong>Next likely action:</strong> Pick a specialized mode'
    ]);
    whyMode.innerHTML=rail([
      'General mode introduces the system before the user enters a focused workspace.',
      'This keeps the first screen broad, then allows progressive specialization.',
      'Modules now preview how the product can reorganize around intent.'
    ]);
    response.style.display='block';
    response.innerText='General mode introduces the AI control center and previews an intent-based product structure.';
  }
}

render('general');
</script>

</body>
</html>
