




<!DOCTYPE html>
<html lang="en" data-i18n-ready="0">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SignalBoost</title>
  <meta name="description" content="Find travel, marketplace and service offers by region." />
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#0d1117;color:#fff}
    body{overflow:hidden}
    a{color:inherit}

    .top{
      height:40px;
      background:#232f3e;
      display:grid;
      grid-template-columns:240px 1fr 0;
      align-items:center;
      border-bottom:1px solid rgba(255,255,255,.1);
      position:fixed;
      inset:0 0 auto 0;
      z-index:1000;
    }
    .logo{color:#f5c542;font-weight:900;padding-left:2px;font-size:16px;white-space:nowrap}

    .navbar{
      display:flex;
      justify-content:center;
      align-items:center;
      background:#111;
      height:100%;
      width:100%;
      overflow:visible;
    }
    .nav-list{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:20px;
      list-style:none;
      margin:0;
      padding:0;
      height:100%;
    }
    .dropdown{position:relative;display:flex;align-items:center;height:100%}
    .dropbtn{
      height:100%;
      background:none;
      border:none;
      border-bottom:2px solid transparent;
      color:#fff;
      cursor:pointer;
      padding:0 10px;
      font-size:14px;
      font-weight:900;
      white-space:nowrap;
    }
    .dropbtn::after{content:'⌄';font-size:11px;margin-left:5px;color:#fff}
    .dropbtn:hover,.dropdown:hover .dropbtn{color:#f5c542;border-bottom-color:#f5c542}
    .dropdown-content{
      display:none;
      position:absolute;
      top:100%;
      left:50%;
      transform:translateX(-50%);
      background:#222;
      min-width:190px;
      max-height:420px;
      overflow:auto;
      z-index:1001;
      border:1px solid rgba(255,255,255,.12);
      border-radius:0 0 10px 10px;
      box-shadow:0 14px 28px rgba(0,0,0,.45);
      list-style:none;
      margin:0;
      padding:6px 0;
    }
    .dropdown:hover .dropdown-content{display:block}
    .dropdown-content li{list-style:none;margin:0;padding:0}
    .dropdown-content a,.dropdown-empty{
      display:block;
      color:#fff;
      padding:9px 14px;
      text-decoration:none;
      font-size:13px;
      font-weight:800;
      white-space:nowrap;
    }
    .dropdown-content a:hover{background:#232f3e;color:#f5c542}
    .dropdown-empty{color:#9aa8b8}

    .lang-switcher{display:none;justify-content:flex-end;padding-right:8px}
    #lang-select{background:#0f1724;color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:6px;padding:6px 10px;font-weight:700}

    .app{display:grid;grid-template-columns:260px minmax(560px,1fr)260px;height:100vh;padding-top:40px}
    .col{min-height:0;overflow:hidden}
    .left,.right{background:#0f141b}
    .left{border-right:1px solid rgba(255,255,255,.08)}
    .right{border-left:1px solid rgba(255,255,255,.08);padding:20px;overflow-y:auto}

    .controls{padding:10px 8px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
    .small-title{font-size:13px;color:#c9d7e8;text-transform:uppercase;font-weight:900;letter-spacing:.05em;margin-bottom:8px}
    #partnerSearch{width:100%;height:32px;background:#0d1117;color:#fff;border:1px solid rgba(255,255,255,.13);border-radius:10px;padding:8px 10px}

    #column1{
      height:auto;
      overflow:visible;
      padding:10px 8px 24px;
      display:flex;
      align-items:flex-start;
      gap:12px;
      white-space:nowrap;
      scrollbar-width:none;
    }
    #column1::-webkit-scrollbar{display:none}
    .left{overflow:visible}
    .column-category{
      position:relative;
      flex:0 0 auto;
      margin:0;
      border:none;
      border-radius:0;
      overflow:visible;
      background:transparent;
    }
    .column-category button{
      background:none;
      color:#fff;
      border:none;
      border-bottom:2px solid transparent;
      padding:8px 10px;
      cursor:pointer;
      width:auto;
      text-align:left;
      font-size:14px;
      font-weight:900;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:6px;
      white-space:nowrap;
    }
    .column-category button::after{content:'⌄';font-size:11px;margin-left:2px;color:#fff}
    .column-category button:hover,.column-category:hover button{color:#f5c542;border-bottom-color:#f5c542}
    .column-category ul{
      display:none;
      position:absolute;
      top:100%;
      left:0;
      min-width:220px;
      max-height:420px;
      overflow:auto;
      margin:0;
      padding:8px 0;
      list-style:none;
      background:#222;
      border:1px solid rgba(255,255,255,.12);
      border-radius:0 0 10px 10px;
      z-index:1002;
      box-shadow:0 14px 28px rgba(0,0,0,.45);
    }
    .column-category:hover ul{display:block}
    .column-category ul li{list-style:none;margin:0;padding:0}
    .column-category a,.column-category .dropdown-empty{
      display:block;
      color:#fff;
      padding:9px 14px;
      text-decoration:none;
      font-size:13px;
      font-weight:800;
      white-space:nowrap;
    }
    .column-category a:hover{background:#232f3e;color:#f5c542}
    .column-category .dropdown-empty{color:#9aa8b8}
    .column-arrow{display:none}

    .main{
      position:relative;
      background:#0d1117;
      display:flex;
      align-items:flex-start;
      justify-content:center;
      padding:18px 18px 96px;
      overflow-y:auto;
      scroll-snap-type:y proximity;
      -webkit-overflow-scrolling:touch;
    }
    .feed-container{width:100%;max-width:520px;display:flex;flex-direction:column;gap:22px}
    .feed-card{
      position:relative;
      display:block;
      text-decoration:none;
      border:1px solid rgba(245,197,66,.22);
      border-radius:22px;
      background:#111822;
      padding:10px;
      min-height:calc(100vh - 168px);
      transition:transform .18s ease,border-color .18s ease;
      cursor:pointer;
      scroll-snap-align:start;
      box-shadow:0 16px 42px rgba(0,0,0,.28);
    }
    .feed-card:hover{transform:translateY(-2px);border-color:rgba(245,197,66,.42)}
    .media{position:relative;aspect-ratio:9/16;height:min(76vh,760px);border-radius:18px;overflow:hidden;background:#0b0f14}
    .media img,.media video,.feed-video,.platform-frame{width:100%;height:100%;object-fit:cover;display:block;border:0}
    .media img{filter:brightness(.60)}
    .media.has-video img{filter:none}
    .media.has-embed{background:#000}
    .platform-frame{background:#000}
    .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
    .play span{width:74px;height:74px;border-radius:50%;background:#fff;color:#06101b;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900}

    .feed-content{
      position:absolute;
      left:20px;
      right:20px;
      bottom:22px;
      padding:16px 14px;
      border-radius:18px;
      background:linear-gradient(180deg,rgba(8,12,18,0),rgba(8,12,18,.78) 20%,rgba(8,12,18,.92));
      text-shadow:0 2px 14px rgba(0,0,0,.75);
      pointer-events:none;
    }
    .feed-label{display:inline-block;margin-bottom:8px;padding:5px 9px;border:1px solid rgba(245,197,66,.22);border-radius:999px;background:rgba(245,197,66,.16);color:#f5c542;font-size:11px;font-weight:900;text-transform:uppercase}
    .feed-source{float:right;color:rgba(255,255,255,.82);font-size:11px;font-weight:900;text-transform:uppercase;margin-top:6px}
    .feed-content h3{clear:both;margin:0 0 8px;font-size:22px;line-height:1.15}
    .feed-content p{margin:0;color:rgba(255,255,255,.86);font-size:14px;line-height:1.4}
    .feed-loader{width:100%;padding:18px;text-align:center;color:#9aa8b8;font-size:12px}
    .feed-empty{width:100%;padding:30px;text-align:center;color:#9aa8b8;border:1px solid rgba(255,255,255,.08);border-radius:14px;background:#111822}

    #stickyBar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(720px,calc(100% - 24px));background:rgba(15,20,27,.96);border:1px solid rgba(245,197,66,.25);border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;gap:12px;z-index:999}
    .sticky-link{color:#f5c542;text-decoration:none;font-weight:900}
    .right h2{text-align:center;margin:0 0 16px}
    #partnerChips{display:block}
    .column3{display:block}
    .featured-card{display:block;text-decoration:none;border:1px solid rgba(245,197,66,.25);border-radius:16px;background:#111822;overflow:hidden;margin-bottom:16px;box-shadow:0 14px 28px rgba(0,0,0,.22)}
    .chip{min-height:72px;display:flex;align-items:center;justify-content:center;text-align:center;border:1px solid rgba(255,255,255,.08);background:#1b2128;border-radius:10px;padding:10px;font-weight:800;font-size:13px;text-decoration:none}
    .see-more-btn{width:100%;margin:8px 0 12px;padding:10px 12px;border:1px solid rgba(245,197,66,.35);border-radius:10px;background:#111;color:#f5c542;font-weight:900;cursor:pointer}
    .see-more-btn:hover{background:#192532}
    .featured{display:block;text-decoration:none;border:1px solid rgba(245,197,66,.25);border-radius:16px;background:#111822;overflow:hidden;margin-bottom:16px;box-shadow:0 14px 28px rgba(0,0,0,.22)}
    .featured img{width:100%;height:138px;object-fit:cover;display:block;background:#0b0f14}
    .featured-body{padding:12px}
    .featured h4{margin:0 0 8px;color:#f5c542;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.04em}
    .featured p{margin:0 0 8px;font-weight:900;font-size:16px}
    .featured span{display:block;color:rgba(255,255,255,.78);font-size:13px;line-height:1.35}
    .chips-title{margin:6px 0 12px;color:#c9d7e8;text-transform:uppercase;font-weight:900;letter-spacing:.05em;font-size:12px}
    .empty{color:#9aa8b8;padding:16px;font-size:13px}

    #debug-overlay{position:fixed;right:10px;bottom:10px;background:rgba(0,0,0,.84);color:#fff;padding:10px 14px;border-radius:8px;font:13px monospace;z-index:9999;box-shadow:0 4px 14px rgba(0,0,0,.35);display:none}
    html[data-i18n-ready="0"] body{opacity:0}
    html[data-i18n-ready="1"] body{opacity:1;transition:opacity .12s}

    @media(max-width:900px){
      body{overflow:auto}
      .top{grid-template-columns:140px 1fr;height:40px;min-height:40px}
      .navbar{justify-content:flex-start;overflow-x:auto}
      .nav-list{justify-content:flex-start;gap:12px;padding-left:8px}
      .dropdown-content{left:0;transform:none}
      .app{display:block;height:auto;padding-top:40px}
      .left,.right{border:0}
      #column1{height:auto;max-height:none;overflow-x:auto;overflow-y:visible}
      .main{min-height:500px;padding:14px 10px 96px}
      .right{padding-bottom:40px}
      .feed-container{max-width:100%}
      .feed-card{min-height:calc(100vh - 128px)}
      .media{height:calc(100vh - 150px);aspect-ratio:9/16}
    }
  </style>
</head>

      const native=detectLanguage(ACTIVE_REGION);
      const labels={es:"Español",pt:"Português",pl:"Polski",ru:"Русский",en:"English"};
      s.innerHTML=`<option value="${native}">${labels[native]||native}</option><option value="en">English</option>`;
      s.value=ACTIVE_LANGUAGE;
    }

    function normalizePartnerRegions(p){return Array.isArray(p.regions) ? [...new Set(p.regions.map(normalizeRegion))] : [normalizeRegion(p.region||"ot")];}
    function normalizePartnerName(name){return String(name||"").toLowerCase().replace(/\([^)]*\)/g,"").replace(/\.com/g,"").replace(/\b(global|ot|us|usa|uk|gb|mx|br|pl|eu|latam|es-latam|ru|ca|de|fr|it|es|ar|co|pe|cl|nz)\b/g,"").replace(/\s+/g," ").trim();}
    function categoryKey(p){return displayCategoryKey(p.category_key || p.category || "marketplace");}

    function mergePartners(arr){
      const map=new Map();
      (Array.isArray(arr)?arr:[]).forEach(p=>{
        if(!p||!p.name||!p.url||p.status==="hold"||p.status==="disabled") return;
        const c=categoryKey(p);
        const key=normalizePartnerName(p.name)+"|"+c;
        const regs=normalizePartnerRegions(p);
        let e=map.get(key);
        if(!e){e={...p,category_key:c,regions:[],regional_urls:{...(p.regional_urls||{})}};map.set(key,e);}
        regs.forEach(r=>{if(!e.regions.includes(r))e.regions.push(r); if(!e.regional_urls[r]) e.regional_urls[r]=p.url;});
        if((p.tier||99)<(e.tier||99)){["name","url","network","description","tier","category_label"].forEach(f=>{if(p[f])e[f]=p[f];});}
      });
      return [...map.values()];
    }

    function partnerMatchesRegion(p, region){return normalizePartnerRegions(p).includes(normalizeRegion(region));}

    function partnerForRegion(p, region){
      region=normalizeRegion(region);
      const regs=normalizePartnerRegions(p);
      const urls=p.regional_urls || {};
      const key=categoryKey(p);
      return {
        ...p,
        regions:regs,
        matched_region:region,
        region,
        url:urls[region] || p.url || "#",
        category_key:key,
        category_label:ACTIVE_TRANSLATIONS[key] || ACTIVE_TRANSLATIONS[canonicalCategoryKey(key)] || p.category_label || key,
        description:p.description || ""
      };
    }

    async function loadPartners(){
      for(const endpoint of ["partners.json","/partners.json"]){
        try{
          const r=await fetch(endpoint,{cache:"no-store"});
          if(r.ok){const d=await r.json(); return Array.isArray(d)?d:(d.partners||[]);}
        }catch(e){}
      }
      return EMBEDDED_PARTNERS.partners || [];
    }

    function visiblePartners(){
      const seen=new Set();
      return mergePartners(ACTIVE_PARTNERS)
        .filter(p=>partnerMatchesRegion(p,ACTIVE_REGION))
        .map(p=>partnerForRegion(p,ACTIVE_REGION))
        .filter(p=>{const k=normalizePartnerName(p.name)+"|"+displayCategoryKey(p.category_key); if(seen.has(k)) return false; seen.add(k); return true;})
        .sort((a,b)=>(a.tier||99)-(b.tier||99)||String(a.name).localeCompare(String(b.name)));
    }

    function buildCategoryIndex(partners){
      const index=Object.fromEntries(MAIN_INDEX_CATEGORIES.map(c=>[c,[]]));
      (Array.isArray(partners)?partners:[]).forEach(p=>{
        const c=displayCategoryKey(p.category_key || p.category || "marketplace");
        if(!index[c]) index[c]=[];
        index[c].push({...p,category_key:c});
      });
      return index;
    }

    function partnersForHeaderCategory(partners, cat){
      const displayKey=displayCategoryKey(cat);
      return partners.filter(p=>displayCategoryKey(p.category_key)===displayKey);
    }

    function HeaderCategory(cat, partners){
      const items=partnersForHeaderCategory(partners, cat);
      const label=translatedCategory(cat);
      return `
        <li class="dropdown">
          <button class="dropbtn" type="button">${esc(label)} (${items.length})</button>
          <ul class="dropdown-content">
            ${items.length ? items.map(p=>`
              <li><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.name)}</a></li>
            `).join("") : `<li><span class="dropdown-empty">No partners</span></li>`}
          </ul>
        </li>`;
    }

    function renderHeader(partners){
      const nav=document.getElementById("travelDirectory");
      if(!nav) return;
      nav.innerHTML=`<ul class="nav-list">${NORMALIZED_HEADER_CATEGORIES.map(cat=>HeaderCategory(cat, partners)).join("")}</ul>`;
    }

    function ColumnCategory(cat, partners, index, query){
      const displayKey=displayCategoryKey(cat);
      const labelKey=canonicalCategoryKey(cat);
      const items=partners.filter(p=>
        displayCategoryKey(p.category_key)===displayKey &&
        (!query || (p.name+" "+(p.network||"")+" "+(p.description||"")).toLowerCase().includes(query))
      );
      return `
        <div class="column-category">
          <button type="button">${esc(translatedCategory(labelKey))} (${items.length})</button>
          <ul>
            ${items.length ? items.map(p=>`
              <li><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.name)} — ${esc(translatedCategory(canonicalCategoryKey(p.category_key)))}</a></li>
            `).join("") : `<li><span class="dropdown-empty">No partners</span></li>`}
          </ul>
        </div>`;
    }

    function toggleColumnCategory(button){
      const box=button.closest(".column-category");
      const list=box.querySelector("ul");
      const arrow=box.querySelector(".column-arrow");
      const isOpen=box.dataset.open==="1";
      box.dataset.open=isOpen ? "0" : "1";
      list.style.display=isOpen ? "none" : "block";
      if(arrow) arrow.textContent=isOpen ? "▶" : "▼";
    }
    window.toggleColumnCategory=toggleColumnCategory;

    function renderColumnPartners(currentRegion,currentLanguage,partners){
      const regionPartners=partners.filter(p=>normalizePartnerRegions(p).includes(normalizeRegion(currentRegion)));
      return `<div class="column">${regionPartners.map(p=>`<div>${esc(p.name)} — ${esc((BUILT_IN_TRANSLATIONS[currentLanguage]||ACTIVE_TRANSLATIONS)[canonicalCategoryKey(p.category_key)]||p.category_key)}</div>`).join("")}</div>`;
    }

    function renderColumn1(partners){
      const q=(document.getElementById("partnerSearch")?.value || "").toLowerCase();
      const wrap=document.getElementById("column1");
      if(!wrap) return;

      // Column 1 is the merged React category set, adapted for this standalone index.html.
      // Aliases map insurance_claims -> insurance and storage_services -> travel_services.
      const html=column1Categories.map((cat,index)=>ColumnCategory(cat,partners,index,q)).join("");
      wrap.innerHTML=html || '<div class="empty">No partners for this region.</div>';
    }

    function toggleColumn1Expanded(){
      // Kept for backward compatibility with older builds that may call it.
      renderColumn1(visiblePartners());
    }
    window.toggleColumn1Expanded=toggleColumn1Expanded;

    const FEED_IMAGES = [
      "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=70",
      "https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=900&q=70",
      "https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?auto=format&fit=crop&w=900&q=70",
      "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=70",
      "https://images.unsplash.com/photo-1491557345352-5929e343eb89?auto=format&fit=crop&w=900&q=70",
      "https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&w=900&q=70"
    ];

    const HYBRID_VIDEO_POOL = [
      {type:"video",source:"mp4",src:"https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"},
      {type:"video",source:"webm",src:"https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.webm"},
      {type:"embed",source:"youtube",src:"https://www.youtube.com/embed/dQw4w9WgXcQ"}
    ];

    function buildFeedItems(partners){
      const preferred=["flights","hotels","tours","transfers","sim","esim","car_rentals","travel_services","insurance","marketplace","products_tools"];
      const sorted=[...partners].sort((a,b)=>{
        const ai=preferred.indexOf(a.category_key), bi=preferred.indexOf(b.category_key);
        return (ai<0?99:ai)-(bi<0?99:bi)||(a.tier||99)-(b.tier||99);
      });
      return sorted.map((p,i)=>{
        const media=HYBRID_VIDEO_POOL[i%HYBRID_VIDEO_POOL.length];
        return {
          ...p,
          feed_title:p.name,
          feed_description:p.description || `Explore ${p.name} offers.`,
          feed_image:FEED_IMAGES[i%FEED_IMAGES.length],
          feed_media_type:media.type,
          feed_source:media.source,
          feed_video:media.src
        };
      });
    }

    function mediaHTML(item){
      if(item.feed_media_type==="video"){
        return `<div class="media has-video"><video class="feed-video" controls muted loop playsinline preload="metadata" poster="${esc(item.feed_image)}"><source src="${esc(item.feed_video)}"></video></div>`;
      }
      if(item.feed_media_type==="embed"){
        return `<div class="media has-embed"><iframe class="platform-frame" src="${esc(item.feed_video)}" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>`;
      }
      return `<div class="media"><img src="${esc(item.feed_image)}" alt="${esc(item.feed_title)}" loading="lazy"><div class="play"><span>▶</span></div></div>`;
    }

    function renderNextFeedBatch(){
      if(FEED_LOADING) return;
      FEED_LOADING=true;
      const container=document.getElementById("feedContainer");
      if(!FEED_ITEMS.length){
        container.innerHTML='<div class="feed-empty">No feed items for this region.</div>';
        FEED_LOADING=false;
        return;
      }
      const start=FEED_PAGE*FEED_PAGE_SIZE;
      const batch=FEED_ITEMS.slice(start,start+FEED_PAGE_SIZE);
      if(!batch.length){
        FEED_PAGE=0;
        FEED_LOADING=false;
        renderNextFeedBatch();
        return;
      }
      const frag=document.createDocumentFragment();
      batch.forEach(item=>{
        const card=document.createElement("article");
        card.className="feed-card";
        card.innerHTML=`
          ${mediaHTML(item)}
          <div class="feed-content">
            <span class="feed-label">${esc(item.category_label || translatedCategory(item.category_key))}</span>
            <span class="feed-source">${esc(item.feed_source || "feed")}</span>
            <h3>${esc(item.feed_title)}</h3>
            <p>${esc(item.feed_description)}</p>
          </div>`;
        card.addEventListener("click",e=>{
          const tag=(e.target.tagName||"").toLowerCase();
          if(["video","iframe","source","a","button"].includes(tag)) return;
          window.open(item.url,"_blank","noopener");
        });
        frag.appendChild(card);
      });
      container.appendChild(frag);
      FEED_PAGE++;
      FEED_LOADING=false;
    }

    function resetFeed(partners){
      FEED_ITEMS=buildFeedItems(partners);
      FEED_PAGE=0;
      const container=document.getElementById("feedContainer");
      container.innerHTML="";
      renderNextFeedBatch();
      renderNextFeedBatch();
    }

    function renderColumn3(){
      const column=document.getElementById("partnerChips");
      if(!column) return;

      const featured=ACTIVE_PARTNERS.find(p=>
        p.featured && Array.isArray(p.regions) && p.regions.includes(ACTIVE_REGION)
      );

      column.className="column column3";

      if(!featured){
        column.innerHTML=`<div class="empty">${esc(ACTIVE_TRANSLATIONS.featured_service || "No featured partner available.")}</div>`;
        return;
      }

      const categoryLabel=ACTIVE_TRANSLATIONS[featured.category_key] || featured.category_label || featured.category_key;
      const imageSrc=featured.thumbnail || featured.image || featured.logo || "";
      const cardTag=featured.url ? "a" : "div";
      const hrefAttrs=featured.url ? ` href="${esc(featured.url)}" target="_blank" rel="noopener"` : "";

      column.innerHTML=`
        <${cardTag} class="featured-card featured"${hrefAttrs}>
          ${imageSrc ? `<img src="${esc(imageSrc)}" alt="${esc(featured.name)}" loading="lazy" onerror="this.style.display='none'">` : ""}
          <div class="featured-body">
            <h4>${esc(categoryLabel)}</h4>
            <p>${esc(featured.name)}</p>
            <span>${esc(featured.description || "")}</span>
          </div>
        </${cardTag}>`;
    }

    function renderSticky(partners){
      const p=partners[0];
      if(!p) return;
      document.getElementById("stickyCopy").textContent=p.description || `Explore ${p.name}.`;
      const link=document.getElementById("stickyLink");
      link.href=p.url;
      link.textContent=ACTIVE_TRANSLATIONS.view_more || "View More";
    }

    function renderAll(){
      const partners=visiblePartners();
      renderHeader(partners);
      renderColumn1(partners);
      renderColumn3();
      renderSticky(partners);
      resetFeed(partners);
    }

    document.getElementById("partnerSearch").addEventListener("input",()=>renderColumn1(visiblePartners()));
    document.getElementById("magnetoColumn").addEventListener("scroll",e=>{
      const el=e.currentTarget;
      if(el.scrollTop+el.clientHeight>=el.scrollHeight-700) renderNextFeedBatch();
    });

    async function init(){
      ACTIVE_REGION=detectRegion();
      ACTIVE_LANGUAGE=getPreferredLanguage(ACTIVE_REGION);
      ACTIVE_TRANSLATIONS=await loadTranslations(ACTIVE_LANGUAGE);
      ACTIVE_PARTNERS=await loadPartners();
      applyTranslations(ACTIVE_TRANSLATIONS);
      setupLanguageSwitcher();
      renderAll();
    }

    init();
  </script>
</body>
</html>
