function desc(p){return p.description||[catName(catKey(p)),p.network].filter(Boolean).join(' • ');}
function normalize(raw){let arr=Array.isArray(raw)?raw:(raw&&raw.partners)||[]; const map=new Map(); arr.forEach(x=>{if(!x||!x.name)return; const p={...x}; p.category_key=catKey(p); p.regions=normalizeRegions(p); p.tier=Number(p.tier); if(!Number.isFinite(p.tier)||p.tier<1)p.tier=3; const id=p.id||p.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); const old=map.get(id); if(!old||p.tier<old.tier||(p.featured&&!old.featured))map.set(id,{...p,id}); }); return [...map.values()];}
function filtered(){let list=PARTNERS.filter(matchRegion); /* IMPORTANT: region pages must show every partner assigned to that region. Featured/tier are ranking only, never visibility filters. */ const q=state.search.trim().toLowerCase(); if(q)list=list.filter(p=>[p.name,p.description,p.network,catName(catKey(p)),catKey(p)].join(' ').toLowerCase().includes(q)); return list.sort((a,b)=>(isLocal(b)-isLocal(a))||(Number(b.featured)-Number(a.featured))||a.tier-b.tier||a.name.localeCompare(b.name));}
function topPartners(n=8){return filtered().slice(0,n);}
function groups(list){const g={}; list.forEach(p=>(g[catKey(p)] ||= []).push(p)); return Object.entries(g).filter(([,v])=>v.length).sort(([a],[b])=>(ORDER.indexOf(a)<0?99:ORDER.indexOf(a))-(ORDER.indexOf(b)<0?99:ORDER.indexOf(b)));}
function partnerAnchor(p,cls='partner-row'){return `<a class="${cls}" href="${esc(partnerUrl(p))}" target="${target()}" rel="noopener"><img src="${esc(logo(p))}" alt="" onerror="this.style.display='none'"><div><strong>${esc(p.name)}</strong><span>${esc(desc(p))}</span></div></a>`;}
function renderLanguageControl(){const btn=$('#langButton'); if(!btn)return; const langs=allowedLangs(); btn.textContent=LANG_LABELS[state.lang]||'English'; btn.style.visibility=langs.length>1?'visible':'hidden'; btn.disabled=langs.length<2; const pop=$('#langPrompt'); if(pop&&langs.length<2)pop.classList.add('hidden');}
function renderI18n(){document.documentElement.lang=state.lang; document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n)); document.querySelectorAll('[data-i18n-placeholder]').forEach(e=>e.placeholder=t(e.dataset.i18nPlaceholder)); renderLanguageControl(); $('#mobileCats').textContent=state.mobileCats?t('hide_categories'):t('browse_categories');}
function renderPills(){const rp=$('#regionPills'); rp.innerHTML=''; ['ot','br','es-latam','us','uk','pl'].forEach(k=>{const b=document.createElement('button'); b.className='pill'+(state.region===k?' active':''); b.textContent=regionLabel(k); b.onclick=()=>{state.region=k; state.lang=normalizeLangForRegion(localStorage.getItem('sb_lang_'+k)||REGIONS[k].lang||'en',k); localStorage.setItem('sb_region',k); state.open.add('marketplace'); state.showAll.add('marketplace'); render();}; rp.appendChild(b);}); const fp=$('#filterPills'); fp.innerHTML=''; [['featured',t('featured')],['all',t('all')],['local',t('local')]].forEach(([k,l])=>{const b=document.createElement('button'); b.className='pill'+(state.filter===k?' active':''); b.textContent=l; b.onclick=()=>{state.filter=k; render();}; fp.appendChild(b);});}
function renderHeader(){const root=$('#headerNav'); root.innerHTML=''; const list=filtered().filter(p=>isTravel(p)); groups(list).forEach(([k,items])=>{const div=document.createElement('div'); div.className='nav-chip'; div.innerHTML=`<button class="nav-btn"><span>${CAT[k]?.icon||'•'}</span><span>${esc(catName(k))}</span><span class="nav-count">${items.length}</span></button><div class="nav-menu"><div class="nav-menu-title">${esc(catName(k))} · ${esc(regionLabel())}</div>${items.map(p=>partnerAnchor(p,'nav-link')).join('')}</div>`; root.appendChild(div);});}
function renderSidebar(){const root=$('#sidebar'); root.className='sidebar'+(state.mobileCats?' mobile-open':''); root.innerHTML=''; const gs=groups(filtered().filter(p=>!isTravel(p))); if(!gs.length){root.innerHTML=`<div class="empty">${esc(t('no_results'))}</div>`; return;} gs.forEach(([k,items])=>{const open=state.open.has(k); const shown=state.showAll.has(k)?items:items.slice(0,3); const card=document.createElement('section'); card.className='cat-card'; card.dataset.open=open?'1':'0'; card.innerHTML=`<button class="cat-btn"><span class="cat-left"><span>${CAT[k]?.icon||'•'}</span><span class="cat-name">${esc(catName(k))}</span></span><span class="cat-right"><span class="count">${items.length}</span><span>${open?'−':'+'}</span></span></button><div class="partner-list">${shown.map(p=>partnerAnchor(p)).join('')}${items.length>shown.length?`<button class="show-more">+ ${items.length-shown.length} ${esc(t('more'))}</button>`:''}</div>`; card.querySelector('.cat-btn').onclick=()=>{state.open.has(k)?state.open.delete(k):state.open.add(k); renderSidebar();}; const more=card.querySelector('.show-more'); if(more)more.onclick=()=>{state.showAll.add(k); renderSidebar();}; root.appendChild(card);});}
function renderHero(){const picks=topPartners(3); $('#regionHero').innerHTML=`<div><div class="region-badge">${esc(regionBadge())}</div><h1>${esc(t('hero_title',{region:regionHero()}))}</h1><p>${esc(t('hero_copy'))}</p><div class="hero-actions"><a class="primary" href="#feedContainer">${esc(t('explore_region'))}</a><button class="secondary" id="showAllBtn">${esc(t('show_all'))}</button></div></div><div>${picks.map(p=>`<a class="hero-mini" href="${esc(partnerUrl(p))}" target="${target()}" rel="noopener"><strong>${esc(p.name)}</strong><span>${esc(catName(catKey(p)))} • ${esc(p.network||'')}</span></a>`).join('')}</div>`; $('#showAllBtn').onclick=()=>{state.filter='all'; render();};}
function renderTrending(){const picks=topPartners(8); $('#trendingStrip').innerHTML=`<span class="trend-kicker">${esc(t('trending'))}</span>${picks.map(p=>`<a class="trend-pill" href="${esc(partnerUrl(p))}" target="${target()}" rel="noopener">${esc(p.name)}</a>`).join('')}`;}
function renderFeed(){const pics=['https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=80','https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80','https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&w=900&q=80','https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?auto=format&fit=crop&w=900&q=80']; const picks=topPartners(6); $('#feedContainer').innerHTML=picks.length?picks.map((p,i)=>`<a class="feed-card" href="${esc(partnerUrl(p))}" target="${target()}" rel="noopener"><div class="media"><img src="${pics[i%pics.length]}" alt=""></div><div class="feed-content"><span class="feed-label">${esc(catName(catKey(p)))}</span><span class="feed-source">${esc(p.network||'')}</span><h3>${esc(p.name)}</h3><p>${esc(desc(p))}</p></div></a>`).join(''):`<div class="empty">${esc(t('no_results'))}</div>`;}
function renderRight(){const root=$('#partnerChips'); const picks=topPartners(8); if(!picks.length){root.innerHTML=`<div class="empty">${esc(t('no_results'))}</div>`; return;} const main=picks[0]; root.innerHTML=`<a class="featured" href="${esc(partnerUrl(main))}" target="${target()}" rel="noopener"><img src="https://images.unsplash.com/photo-1502920917128-1aa500764cbd?auto=format&fit=crop&w=900&q=80" alt=""><div class="featured-body"><h4>${esc(catName(catKey(main)))}</h4><p>${esc(main.name)}</p><span>${esc(desc(main))}</span></div></a><div class="chip-grid">${picks.slice(1).map(p=>`<a class="chip" href="${esc(partnerUrl(p))}" target="${target()}" rel="noopener">${esc(p.name)}</a>`).join('')}</div>`;}
function renderSticky(){const p=topPartners(1)[0]; if(!p)return; $('#stickyCopy').textContent=`${p.name} — ${catName(catKey(p))}`; $('#stickyLink').href=partnerUrl(p); $('#stickyLink').target=target(); $('#stickyLink').textContent=t('view_more');}

function openLanguagePopup(){const pop=$('#langPrompt'); if(!pop)return; const langs=allowedLangs(); if(langs.length<2)return; const local=REGIONS[state.region]?.lang||'en'; const title=state.lang==='en'?'Choose language':'Escolha o idioma'; const copy=state.lang==='en'?'Use English or the local language for this region.':'Use português ou inglês para esta região.'; pop.innerHTML=`<h3>${esc(title)}</h3><p>${esc(copy)}</p><div class="lang-actions">${langs.map(l=>`<button class="${l===local?'primary-choice':''}" data-lang="${esc(l)}">${esc(LANG_LABELS[l]||l)}</button>`).join('')}</div>`; pop.classList.remove('hidden'); pop.querySelectorAll('button[data-lang]').forEach(b=>b.onclick=()=>{state.lang=b.dataset.lang; localStorage.setItem('sb_lang_'+state.region,state.lang); pop.classList.add('hidden'); render();});}
function closeLanguagePopupOnOutside(e){const pop=$('#langPrompt'); const btn=$('#langButton'); if(pop&&!pop.classList.contains('hidden')&&!pop.contains(e.target)&&e.target!==btn)pop.classList.add('hidden');}

function render(){try{renderI18n(); renderPills(); renderHeader(); renderSidebar(); renderHero(); renderTrending(); renderFeed(); renderRight(); renderSticky();}catch(e){console.error(e); const d=$('#debug'); if(d){d.style.display='block'; d.textContent='Render error: '+e.message;}}}
async function tryLoadJson(){const urls=['partners.json','/partners.json','/api/data/partners.json']; for(const u of urls){try{const r=await fetch(u,{cache:'no-store'}); if(r.ok){const j=await r.json(); const list=normalize(j); if(list.length)return list;}}catch(e){}} return [];}
async function boot(){PARTNERS=normalize(window.EMBEDDED_PARTNERS); render(); const fresh=await tryLoadJson(); if(fresh.length){PARTNERS=fresh; render();} }
document.addEventListener('DOMContentLoaded',()=>{$('#partnerSearch').addEventListener('input',e=>{state.search=e.target.value; render();}); $('#langButton').addEventListener('click',openLanguagePopup); document.addEventListener('click',closeLanguagePopupOnOutside); $('#mobileCats').addEventListener('click',()=>{state.mobileCats=!state.mobileCats; renderI18n(); renderSidebar();}); boot();});
})();
</script>
</body>
</html>
