<!--
================ SIGNALBOOST AI PROJECT BRAIN ================

PROJECT IDENTITY
- Name: SignalBoost AI
- Goal: AI-driven HMI interface
- Core Idea: AI cockpit + adaptive UI

DESIGN PRINCIPLES
- AI is the main interface (not a feature)
- One clear next action
- Visible feedback for every interaction
- Adaptive layout based on user intent

CURRENT FEATURES
- Prompt input (AI interaction entry point)
- Mode switching (travel, finance, social)
- AI response simulation
- Card-based recommendation system
- Adaptive section content by mode
- Adaptive hero styling by mode

NEXT STEPS
- Full adaptive layout (move from adaptive content to adaptive page structure)
- Real AI integration (API / LLM)
- State memory (session awareness)
- Workspaces (task-based UI environments)

NOTES
- This file acts as BOTH UI and documentation
- Always update this section when evolving the system
- This allows full recovery in a new chat

==============================================================
-->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SignalBoost AI</title>
<style>
:root {
  --bg:#eef4ff;
  --surface:rgba(255,255,255,0.85);
  --border:rgba(148,163,184,.25);
  --text:#0f172a;
  --muted:#64748b;
  --primary:#2563eb;
  --accent:#06b6d4;
  --shadow:0 20px 60px rgba(15,23,42,.08);
}

body.dark {
  --bg:#0b1220;
  --surface:rgba(20,30,50,.85);
  --text:#e2e8f0;
  --muted:#94a3b8;
  --border:rgba(255,255,255,.1);
}

body{
  margin:0;
  font-family:Inter, Arial;
  background:var(--bg);
  color:var(--text);
  transition:.3s;
}

.app{max-width:1200px;margin:auto;padding:16px}

.topbar{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px;border-radius:16px;
  background:var(--surface);border:1px solid var(--border);
  box-shadow:var(--shadow)
}

.logo{font-weight:900}

.btn{padding:10px 14px;border-radius:999px;border:none;cursor:pointer;font-weight:700}
.primary{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff}
.ghost{background:transparent;border:1px solid var(--border)}

.hero{
  margin-top:20px;
  background:var(--surface);
  padding:30px;
  border-radius:24px;
  border:1px solid var(--border)
}

h1{font-size:42px;margin:0}

.prompt{
  margin-top:20px;
  padding:12px;
  border-radius:20px;
  background:#fff;
  border:1px solid var(--border);
  display:flex;
  gap:10px;
  transition:.2s;
}

.prompt:focus-within{
  border-color:var(--primary);
  box-shadow:0 0 0 2px rgba(37,99,235,.15);
}

body.dark .prompt{background:#111827}

input{
  flex:1;
  border:none;
  outline:none;
  font-size:18px;
  background:transparent;
  color:inherit
}

.thinking{
  font-size:13px;
  color:var(--muted);
  margin-top:6px;
  opacity:0;
  transition:.3s
}

.response{
  margin-top:12px;
  padding:12px;
  border-radius:14px;
  background:rgba(37,99,235,.08);
  border:1px solid rgba(37,99,235,.2);
  font-size:14px;
  line-height:1.6;
}

.suggestions{
  margin-top:10px;
  display:flex;
  gap:8px;
  flex-wrap:wrap
}

.chip{
  padding:8px 12px;
  border-radius:999px;
  border:1px solid var(--border);
  cursor:pointer;
  font-size:12px;
}

.mode-switch{
  margin-top:20px;
  display:flex;
  gap:10px;
}

.module{
  margin-top:20px;
  padding:20px;
  border-radius:20px;
  background:var(--surface);
  border:1px solid var(--border)
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-top:14px
}

.card{
  padding:14px;
  border-radius:16px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.6);
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
  box-shadow:0 8px 20px rgba(0,0,0,.05);
}

body.dark .card{background:rgba(30,40,60,.6)}

.label{font-size:11px;color:var(--muted)}
.strong{font-weight:800}

@media(max-width:800px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">

<div class="topbar">
  <div class="logo">SignalBoost AI</div>
  <div>
    <button class="ghost" onclick="toggleDark()">Dark</button>
    <button class="btn primary">Assistant</button>
  </div>
</div>

<section class="hero">
  <h1>What do you want to do?</h1>

  <div class="prompt">
    <input id="input" placeholder="Ask anything..." />
    <button class="btn primary" onclick="runAI()">Go</button>
  </div>

  <div id="thinking" class="thinking">AI thinking...</div>
  <div id="response" class="response" style="display:none"></div>

  <div class="suggestions">
    <div class="chip" onclick="quick('Plan travel')">Plan travel</div>
    <div class="chip" onclick="quick('Find trends')">Find trends</div>
    <div class="chip" onclick="quick('Compare platforms')">Compare</div>
  </div>

  <div class="mode-switch">
    <button class="ghost" onclick="setMode('travel')">Travel</button>
    <button class="ghost" onclick="setMode('finance')">Finance</button>
    <button class="ghost" onclick="setMode('social')">Social</button>
  </div>
</section>

<section class="module">
  <h2>Next actions</h2>
  <div class="grid" id="actions"></div>
</section>

<section class="module">
  <h2>Recommended</h2>
  <div class="grid" id="recommend"></div>
</section>

<section class="module">
  <h2>Optional</h2>
  <div class="grid" id="optional"></div>
</section>

</div>

<script>
function toggleDark(){document.body.classList.toggle('dark')}

function quick(text){
  document.getElementById('input').value=text;
  runAI();
}

let currentMode = 'general';

function runAI(){
  const t=document.getElementById('thinking');
  const r=document.getElementById('response');

  t.style.opacity=1;
  r.style.display='none';

  setTimeout(()=>{
    t.style.opacity=0;
    r.style.display='block';

    const val=document.getElementById('input').value;

    r.innerText=`AI suggests starting with the most important step for: "${val}". The interface now highlights the best next actions and reduces unnecessary choices.`;

    render(currentMode);
  },1000);
}

function setMode(mode){
  currentMode = mode;
  render(mode);
}

function card(title,desc){
  return `<div class='card'>
    <div class='label'>Suggested</div>
    <div class='strong'>${title}</div>
    <div>${desc}</div>
  </div>`;
}

function render(mode){
  const actions=document.getElementById('actions');
  const rec=document.getElementById('recommend');
  const opt=document.getElementById('optional');
  const hero=document.querySelector('.hero');
  const response=document.getElementById('response');
  const buttons=document.querySelectorAll('.mode-switch .ghost');

  buttons.forEach(btn => btn.style.background='transparent');
  if(mode==='travel' && buttons[0]) buttons[0].style.background='rgba(37,99,235,.08)';
  if(mode==='finance' && buttons[1]) buttons[1].style.background='rgba(37,99,235,.08)';
  if(mode==='social' && buttons[2]) buttons[2].style.background='rgba(37,99,235,.08)';

  hero.style.transition = '.3s';

  if(mode==='travel'){
    hero.style.background='linear-gradient(135deg, rgba(59,130,246,.12), rgba(6,182,212,.10))';
    actions.innerHTML = [
      card('Book flight','Start with timing, route, and travel window.'),
      card('Check entry rules','Confirm passport, visa, and arrival requirements.'),
      card('Set arrival plan','Prepare transport and first-day essentials.')
    ].join('');
    rec.innerHTML = [
      card('Choose hotel','Compare location, safety, and access.'),
      card('Compare local transport','Rank airport transfer and city mobility options.'),
      card('Build itinerary','Turn ideas into a practical sequence.')
    ].join('');
    opt.innerHTML = [
      card('Explore food','Save a few strong nearby options.'),
      card('Find activities','Keep flexible discovery ideas ready.'),
      card('Pack checklist','Reduce last-minute mistakes.')
    ].join('');
    response.style.display='block';
    response.innerText='Travel mode restructures the interface around movement, timing, entry requirements, stay decisions, and arrival confidence.';
  }
  else if(mode==='finance'){
    hero.style.background='linear-gradient(135deg, rgba(16,185,129,.10), rgba(37,99,235,.08))';
    actions.innerHTML = [
      card('Setup account','Start with the main financial tool you need first.'),
      card('Check payment access','Make sure cards and transfers will work where needed.'),
      card('Set budget guardrails','Define a safe range before spending decisions.')
    ].join('');
    rec.innerHTML = [
      card('Compare cards','Surface the best options for rewards or low fees.'),
      card('Track spending','Create a simple overview of current outflow.'),
      card('Review transfer options','Choose the most practical path for moving money.')
    ].join('');
    opt.innerHTML = [
      card('Watch exchange rates','Useful if you are moving across currencies.'),
      card('Create savings target','Optional planning for a larger goal.'),
      card('Review subscriptions','Trim low-value recurring costs.')
    ].join('');
    response.style.display='block';
    response.innerText='Finance mode simplifies money decisions by prioritizing setup, access, comparison, and financial control before optional tools.';
  }
  else if(mode==='social'){
    hero.style.background='linear-gradient(135deg, rgba(168,85,247,.10), rgba(236,72,153,.08))';
    actions.innerHTML = [
      card('Review signals','Start with the strongest live conversations.'),
      card('Compare platforms','Match the message to the right channel.'),
      card('Choose audience path','Decide where attention matters most first.')
    ].join('');
    rec.innerHTML = [
      card('Draft content angle','Shape the main idea before publishing.'),
      card('Rank best channels','Identify where the content will perform best.'),
      card('Plan release order','Sequence the rollout instead of posting randomly.')
    ].join('');
    opt.innerHTML = [
      card('Explore creators','Find possible collaborators.'),
      card('Save trend references','Keep examples for later use.'),
      card('Review engagement later','Optional follow-up analysis.')
    ].join('');
    response.style.display='block';
    response.innerText='Social mode shifts the experience toward trends, audience fit, content direction, and platform-based decision making.';
  }
  else {
    hero.style.background='var(--surface)';
    actions.innerHTML = [
      card('Review signals','Top trends ranked and simplified.'),
      card('Choose a mode','Travel, finance, or social.'),
      card('Start a prompt','Tell the system your goal.')
    ].join('');
    rec.innerHTML = [
      card('Compare options','Best choices surfaced first.'),
      card('Reduce noise','Hide low-value paths quickly.'),
      card('Focus next step','Keep the user moving with clarity.')
    ].join('');
    opt.innerHTML = [
      card('Explore more','Additional discovery.'),
      card('Save directions','Keep useful paths for later.'),
      card('Refine intent','Improve the system response.')
    ].join('');
    response.style.display='block';
    response.innerText='General mode introduces the AI control center and prepares the user to shift into a more specialized workspace.';
  }
}

render('general');
</script>

</body>
</html>
