<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unified Social Video Renderer</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: #ffffff;
    }

    body { overflow: hidden; }

    .app {
      display: grid;
      grid-template-columns: 280px 1fr 280px;
      height: 100vh;
      min-height: 0;
    }

    .column {
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .column-1 {
      background: #05070a;
      border-right: 1px solid rgba(255,255,255,0.08);
    }

    .column-1-header {
      padding: 14px 16px;
      font-size: 16px;
      font-weight: 700;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .column-1-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .category {
      margin-bottom: 10px;
      background: rgba(255,255,255,0.04);
      border-radius: 10px;
      overflow: hidden;
    }

    .category-title {
      padding: 10px 12px;
      font-weight: 600;
      background: rgba(255,255,255,0.05);
    }

    .category ul {
      list-style: none;
      margin: 0;
      padding: 8px 12px 12px;
    }

    .category li { margin: 8px 0; }

    .category a {
      color: #ffffff;
      text-decoration: none;
      opacity: 0.9;
    }

    .category a:hover { text-decoration: underline; }

    .column-2 {
      background: #0d1117;
      border-right: 1px solid rgba(255,255,255,0.08);
    }

    .feed-wrapper {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 20px;
    }

    .feed-topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #0d1117;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }

    .feed-header {
      margin: 0 0 12px;
      font-size: 24px;
      font-weight: 700;
    }

    .feed-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .feed-filters button {
      background: #161b22;
      color: #ffffff;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 13px;
    }

    .feed-filters button.active {
      border-color: #58a6ff;
      color: #58a6ff;
    }

    .feed-filters button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .debug-box {
      margin-top: 10px;
      font-size: 12px;
      color: rgba(255,255,255,0.65);
      white-space: pre-wrap;
    }

    .feed-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .feed-card {
      display: grid;
      grid-template-columns: minmax(220px, 320px) 1fr;
      gap: 14px;
      background: #161b22;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 14px;
      align-items: start;
    }

    .feed-media iframe,
    .feed-media video,
    .feed-media img,
    .fallback {
      width: 100%;
      height: 220px;
      border: none;
      border-radius: 10px;
      background: #0b0f14;
      display: block;
      object-fit: cover;
    }

    .fallback {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
    }

    .fallback img {
      width: 140px;
      height: 100px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .fallback a,
    .feed-link {
      color: #58a6ff;
      text-decoration: none;
    }

    .fallback a:hover,
    .feed-link:hover {
      text-decoration: underline;
    }

    .feed-content h3 {
      margin: 0 0 8px;
      font-size: 18px;
      line-height: 1.3;
    }

    .feed-content p {
      margin: 0 0 10px;
      color: rgba(255,255,255,0.82);
      line-height: 1.5;
      font-size: 14px;
    }

    .feed-meta {
      font-size: 12px;
      color: rgba(255,255,255,0.6);
      margin-bottom: 10px;
      line-height: 1.4;
    }

    .feed-platform {
      display: inline-block;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 999px;
      margin-right: 6px;
      text-transform: capitalize;
      background: rgba(255,255,255,0.08);
      color: #dddddd;
      vertical-align: middle;
    }

    .feed-platform.youtube { background: rgba(255,0,0,0.15); color: #ff6b6b; }
    .feed-platform.reddit { background: rgba(255,69,0,0.15); color: #ff4500; }
    .feed-platform.instagram { background: rgba(255,0,150,0.15); color: #ff4fa3; }
    .feed-platform.facebook { background: rgba(24,119,242,0.15); color: #66a3ff; }

    .feed-message, .feed-loader {
      text-align: center;
      padding: 18px 0;
      color: rgba(255,255,255,0.65);
      font-size: 14px;
    }

    .feed-loader { display: none; }
    #feedSentinel { height: 1px; }

    .column-3 {
      background: #0f141b;
      overflow-y: auto;
      padding: 20px;
    }

    .column-3-card {
      background: #161b22;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 16px;
      color: rgba(255,255,255,0.88);
    }

    .column-3-card ul {
      margin: 0;
      padding-left: 18px;
    }

    .column-3-card li { margin: 8px 0; }

    @media (max-width: 1100px) {
      .app { grid-template-columns: 240px 1fr; }
      .column-3 { display: none; }
    }

    @media (max-width: 768px) {
      .app { grid-template-columns: 1fr; }
      .column-1 { display: none; }
      .feed-card { grid-template-columns: 1fr; }
      .feed-media iframe,
      .feed-media video,
      .feed-media img,
      .fallback { height: auto; min-height: 200px; }
      .fallback { flex-direction: column; align-items: flex-start; }
      .fallback img { width: 100%; height: 180px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="column column-1">
      <div class="column-1-header">Partners</div>
      <div id="partners" class="column-1-scroll"></div>
    </aside>

    <main class="column column-2">
      <div id="feedScroll" class="feed-wrapper">
        <div class="feed-topbar">
          <h1 class="feed-header">Unified Social Video Renderer</h1>
          <div id="filters" class="feed-filters">
            <button data-filter="all" class="active">All</button>
            <button data-filter="youtube">YouTube</button>
            <button data-filter="reddit">Reddit</button>
            <button data-filter="instagram">Instagram</button>
            <button data-filter="facebook">Facebook</button>
            <button data-filter="unknown">Fallback</button>
          </div>
          <div id="debugBox" class="debug-box">Ready.</div>
        </div>

        <div id="feed" class="feed-container"></div>
        <div id="loader" class="feed-loader">Loading...</div>
        <div id="feedSentinel"></div>
      </div>
    </main>

    <aside class="column column-3">
      <h2 style="margin-top:0;">Column 3</h2>
      <div class="column-3-card">
        <ul>
          <li>Saved posts</li>
          <li>Trending topics</li>
          <li>Summaries</li>
          <li>Insights</li>
        </ul>
      </div>
    </aside>
  </div>

  <script>
    const partners = [
      { name: 'OpenAI', url: 'https://openai.com', category: 'AI' },
      { name: 'YouTube', url: 'https://youtube.com', category: 'Social' },
      { name: 'Instagram', url: 'https://instagram.com', category: 'Social' },
      { name: 'Facebook', url: 'https://facebook.com', category: 'Social' },
      { name: 'Reddit', url: 'https://reddit.com', category: 'Social' }
    ];

    const items = [
      {
        platform: 'youtube',
        embedUrl: 'https://www.youtube.com/embed/dQw4w9WgXcQ',
        url: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ',
        title: 'YouTube Example',
        description: 'Embedded YouTube content rendered with iframe support.',
        author: 'Demo Source',
        publishedAt: '2026-04-14T09:00:00Z',
        thumbnail: 'https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg'
      },
      {
        platform: 'reddit',
        videoUrl: '',
        url: 'https://www.reddit.com/',
        title: 'Reddit Example',
        description: 'Reddit falls back to a thumbnail when no direct MP4 is available.',
        author: 'Demo Source',
        publishedAt: '2026-04-13T11:30:00Z',
        thumbnail: 'https://via.placeholder.com/640x360?text=Reddit'
      },
      {
        platform: 'instagram',
        embedUrl: '',
        url: 'https://www.instagram.com/',
        title: 'Instagram Example',
        description: 'Instagram falls back safely when no valid embed URL is present.',
        author: 'Demo Source',
        publishedAt: '2026-04-12T14:00:00Z',
        thumbnail: 'https://via.placeholder.com/640x360?text=Instagram'
      },
      {
        platform: 'facebook',
        embedUrl: '',
        url: 'https://www.facebook.com/',
        title: 'Facebook Example',
        description: 'Facebook falls back safely when no valid embed URL is present.',
        author: 'Demo Source',
        publishedAt: '2026-04-11T16:00:00Z',
        thumbnail: 'https://via.placeholder.com/640x360?text=Facebook'
      },
      {
        platform: 'unknown',
        url: 'https://example.com',
        title: 'Fallback Example',
        description: 'If no supported media is available, a simple preview and link are shown.',
        author: 'Demo Source',
        publishedAt: '2026-04-10T09:00:00Z',
        thumbnail: 'https://via.placeholder.com/640x360?text=Fallback'
      }
    ];

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function normalizePlatform(value) {
      return String(value || 'unknown').trim().toLowerCase();
    }

    function formatDate(value) {
      const d = new Date(value);
      return Number.isNaN(d.getTime()) ? '' : d.toLocaleString();
    }

    function isValidHttpUrl(value) {
      try {
        const u = new URL(value);
        return u.protocol === 'http:' || u.protocol === 'https:';
      } catch {
        return false;
      }
    }

    function getYouTubeVideoId(url) {
      try {
        const parsed = new URL(url);
        const hostname = parsed.hostname.toLowerCase();

        if (hostname.includes('youtube.com')) {
          if (parsed.pathname === '/watch') return parsed.searchParams.get('v');
          if (parsed.pathname.startsWith('/shorts/')) return parsed.pathname.split('/shorts/')[1].split('/')[0];
          if (parsed.pathname.startsWith('/embed/')) return parsed.pathname.split('/embed/')[1].split('/')[0];
        }

        if (hostname.includes('youtu.be')) {
          return parsed.pathname.replace(/^\//, '').split('/')[0] || null;
        }
      } catch {}
      return null;
    }

    function getYouTubeEmbedUrl(url) {
      const id = getYouTubeVideoId(url);
      return id ? 'https://www.youtube.com/embed/' + id : null;
    }

    function renderPartners() {
      const container = document.getElementById('partners');
      const grouped = {};

      partners.forEach(function(partner) {
        const category = partner.category || 'Other';
        if (!grouped[category]) grouped[category] = [];
        grouped[category].push(partner);
      });

      container.innerHTML = Object.keys(grouped).map(function(category) {
        return '<div class="category">' +
          '<div class="category-title">' + escapeHtml(category) + '</div>' +
          '<ul>' +
          grouped[category].map(function(partner) {
            return '<li><a href="' + escapeHtml(partner.url) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(partner.name) + '</a></li>';
          }).join('') +
          '</ul>' +
          '</div>';
      }).join('');
    }

    const feedEl = document.getElementById('feed');
    const loaderEl = document.getElementById('loader');
    const debugBox = document.getElementById('debugBox');
    const filtersEl = document.getElementById('filters');
    const sentinelEl = document.getElementById('feedSentinel');
    const feedScrollEl = document.getElementById('feedScroll');

    let activeFilter = 'all';
    let filteredItems = [];
    let currentIndex = 0;
    const pageSize = 4;
    let observer;

    function setDebug(text) {
      debugBox.textContent = text;
    }

    function createMedia(item) {
      const platform = normalizePlatform(item.platform);
      const title = escapeHtml(item.title || 'Untitled');
      const thumbnail = escapeHtml(item.thumbnail || 'https://via.placeholder.com/640x360?text=Preview');
      const url = isValidHttpUrl(item.url) ? item.url : '#';
      const embedUrl = isValidHttpUrl(item.embedUrl) ? item.embedUrl : '';
      const videoUrl = isValidHttpUrl(item.videoUrl) ? item.videoUrl : '';
      const youtubeEmbed = platform === 'youtube' ? (embedUrl || getYouTubeEmbedUrl(url)) : '';

      if (platform === 'youtube' && youtubeEmbed) {
        return '<div class="feed-media"><iframe src="' + escapeHtml(youtubeEmbed) + '" title="' + title + '" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>';
      }

      if ((platform === 'facebook' || platform === 'instagram') && embedUrl) {
        return '<div class="feed-media"><iframe src="' + escapeHtml(embedUrl) + '" title="' + title + '" loading="lazy" allowfullscreen></iframe></div>';
      }

      if (videoUrl) {
        return '<div class="feed-media"><video controls preload="metadata" playsinline><source src="' + escapeHtml(videoUrl) + '" type="video/mp4">Your browser does not support HTML5 video.</video></div>';
      }

      return '<div class="fallback">' +
        '<img src="' + thumbnail + '" alt="' + title + '" loading="lazy">' +
        '<div><div style="margin-bottom:8px;color:rgba(255,255,255,0.78);">Preview unavailable for this source.</div>' +
        '<a href="' + escapeHtml(url) + '" target="_blank" rel="noopener noreferrer">Open Link</a></div>' +
        '</div>';
    }

    function createCard(item) {
      const platform = normalizePlatform(item.platform);
      const publishedAt = formatDate(item.publishedAt);
      const url = isValidHttpUrl(item.url) ? item.url : '#';

      return '<article class="feed-card">' +
        createMedia(item) +
        '<div class="feed-content">' +
        '<h3>' + escapeHtml(item.title || 'Untitled') + '</h3>' +
        '<div class="feed-meta">' +
        '<span class="feed-platform ' + escapeHtml(platform) + '">' + escapeHtml(item.platform || 'unknown') + '</span>' +
        escapeHtml(item.author || '') +
        ((item.author && publishedAt) ? ' • ' : '') +
        escapeHtml(publishedAt) +
        '</div>' +
        '<p>' + escapeHtml(item.description || '') + '</p>' +
        '<a class="feed-link" href="' + escapeHtml(url) + '" target="_blank" rel="noopener noreferrer">Open post</a>' +
        '</div>' +
        '</article>';
    }

    function updateFilterButtons() {
      const available = new Set(items.map(function(item) { return normalizePlatform(item.platform); }));
      Array.from(filtersEl.querySelectorAll('button[data-filter]')).forEach(function(button) {
        const value = button.getAttribute('data-filter');
        if (value === 'all') {
          button.disabled = false;
          return;
        }
        button.disabled = !available.has(value);
      });
    }

    function applyFilter() {
      filteredItems = activeFilter === 'all'
        ? items.slice()
        : items.filter(function(item) { return normalizePlatform(item.platform) === activeFilter; });

      currentIndex = 0;
      feedEl.innerHTML = '';

      if (!filteredItems.length) {
        feedEl.innerHTML = '<div class="feed-message">No items found.</div>';
        setDebug('No feed items for filter: ' + activeFilter);
        return;
      }

      renderNextBatch();
      setDebug('Loaded ' + filteredItems.length + ' item(s) for filter: ' + activeFilter);

      if (observer) {
        observer.disconnect();
        if (currentIndex < filteredItems.length) observer.observe(sentinelEl);
      }
    }

    function renderNextBatch() {
      const nextItems = filteredItems.slice(currentIndex, currentIndex + pageSize);
      nextItems.forEach(function(item) {
        feedEl.insertAdjacentHTML('beforeend', createCard(item));
      });
      currentIndex += nextItems.length;
      loaderEl.style.display = currentIndex < filteredItems.length ? 'block' : 'none';
    }

    filtersEl.addEventListener('click', function(event) {
      const button = event.target.closest('button[data-filter]');
      if (!button || button.disabled) return;

      activeFilter = button.getAttribute('data-filter');
      Array.from(filtersEl.querySelectorAll('button')).forEach(function(btn) {
        btn.classList.remove('active');
      });
      button.classList.add('active');
      applyFilter();
    });

    observer = new IntersectionObserver(function(entries) {
      if (entries[0] && entries[0].isIntersecting && currentIndex < filteredItems.length) {
        renderNextBatch();
      }
    }, {
      root: feedScrollEl,
      threshold: 0.1
    });

    renderPartners();
    updateFilterButtons();
    applyFilter();
    observer.observe(sentinelEl);
  </script>
</body>
</html>
