<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!--
========================================================
SIGNALBOOST CORE FILE
--------------------------------------------------------
This file controls:
- UI (what users see)
- Intent routing (how decisions are made)
- Monetization (affiliate links)
- Conversion optimization (CTAs + urgency)

Philosophy:
User sees: simple, clean decisions
System does: intelligent routing + monetization
========================================================
-->

<title>SignalBoost</title>

<style>
/*
========================================================
UI SYSTEM
--------------------------------------------------------
Clean, premium, neutral (NOT "AI-looking")
========================================================
*/
body{
  font-family:Arial;
  margin:0;
  padding:20px;
  background:#f4f7fb;
}

.section{
  background:white;
  padding:20px;
  margin-bottom:15px;
  border-radius:12px;
}

/* Cards */
.card{
  border:1px solid #ddd;
  padding:15px;
  margin:10px;
  border-radius:10px;
}

/* Buttons */
button{
  padding:10px 14px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.primary{background:#2563eb;color:white;}
.warn{background:#ea580c;color:white;}
.dark{background:#111;color:white;}
.success{background:#16a34a;color:white;}
.purple{background:#7c3aed;color:white;}
</style>
</head>

<body>

<!-- ===================================================== -->
<!-- HERO / SEARCH -->
<!-- ===================================================== -->

<div class="section">
  <h1>Find better options faster</h1>

  <input id="query" placeholder="Search anything..." style="width:70%;padding:10px;">
  <button onclick="runSearch()">Search</button>

  <div id="results"></div>
</div>

<!-- ===================================================== -->
<!-- TRAVEL SECTION -->
<!-- ===================================================== -->

<div class="section">
  <h2>Travel Booking Options</h2>

  <!--
  USER VIEW:
  Clean options

  SYSTEM VIEW:
  These are monetized affiliate paths
  -->

  <div class="card">
    <h3>Find Hotels</h3>
    <button class="primary" onclick="go('expedia_hotels')">See prices</button>
  </div>

  <div class="card">
    <h3>Hotel Deals</h3>
    <button class="warn" onclick="go('hotels')">Check availability</button>
  </div>

  <div class="card">
    <h3>Vacation Rentals</h3>
    <button class="dark" onclick="go('vrbo')">Browse rentals</button>
  </div>

  <div class="card">
    <h3>Last-Minute Trips</h3>
    <button class="warn" onclick="go('lastminute')">View deals</button>
  </div>

  <div class="card">
    <h3>Car Rental</h3>
    <button class="dark" onclick="go('car')">Find cars</button>
  </div>
</div>

<!-- ===================================================== -->
<!-- BUSINESS SECTION -->
<!-- ===================================================== -->

<div class="section">
  <h2>Business Tools</h2>

  <!--
  FUTURE REVENUE:
  These will become recurring income streams
  -->

  <div class="card">
    <h3>Create Presentations</h3>
    <button class="purple">Get started</button>
  </div>

  <div class="card">
    <h3>Build a Website</h3>
    <button class="primary">Start building</button>
  </div>

  <div class="card">
    <h3>Grow Your Business</h3>
    <button class="warn">Explore tools</button>
  </div>
</div>

<!-- ===================================================== -->
<!-- FOOTER (IMPORTANT FOR TRUST + ADSENSE) -->
<!-- ===================================================== -->

<div class="section">
  <a href="/privacy.html">Privacy</a> |
  <a href="/terms.html">Terms</a> |
  <a href="/contact.html">Contact</a>
</div>

<script>

/*
========================================================
AFFILIATE LINKS (CORE REVENUE ENGINE)
--------------------------------------------------------
All monetization flows through here
========================================================
*/

const LINKS = {
  expedia_hotels: "https://expedia.com/affiliate/6N7hRHZ",
  hotels: "https://www.hotels.com/affiliate/5BoP8Nf",
  vrbo: "https://vrbo.com/affiliate/M2nsa7i",
  lastminute: "https://www.awin1.com/cread.php?awinmid=72767&awinaffid=2834806",
  car: "https://www.awin1.com/cread.php?awinmid=123066&awinaffid=2834806"
};

/*
========================================================
INTENT DETECTION ENGINE
--------------------------------------------------------
This decides:
WHAT user wants → WHICH provider to show

This is your "AI layer" (even without ML)
========================================================
*/

function detectIntent(query){

  const q = query.toLowerCase();

  /*
  CAR RENTAL = HIGH VALUE 💰💰💰
  */
  if(q.includes("car") || q.includes("rent")){
    return ["car","expedia_hotels"];
  }

  /*
  DEAL SEEKERS
  */
  if(q.includes("cheap") || q.includes("deal")){
    return ["lastminute","hotels","expedia_hotels"];
  }

  /*
  FAMILY / RENTALS
  */
  if(q.includes("family") || q.includes("villa")){
    return ["vrbo","expedia_hotels"];
  }

  /*
  DEFAULT HOTEL SEARCH
  */
  return ["expedia_hotels","hotels","vrbo"];
}

/*
========================================================
SEARCH HANDLER
--------------------------------------------------------
Transforms user query into monetized actions
========================================================
*/

function runSearch(){

  const query = document.getElementById("query").value;

  const results = detectIntent(query);

  let html = "<h3>Best options:</h3>";

  results.forEach((r,i)=>{

    html += `
      <div class="card">
        <b>${r}</b><br>
        ${getUrgency(r,i)}
        <br><br>
        <button onclick="go('${r}')">Continue</button>
      </div>
    `;
  });

  document.getElementById("results").innerHTML = html;
}

/*
========================================================
URGENCY ENGINE (CONVERSION BOOST)
--------------------------------------------------------
Increases click rate (VERY important)
========================================================
*/

function getUrgency(type,index){

  if(type==="lastminute") return "⚡ Deals change fast";
  if(type==="car") return "⚡ Cars sell out quickly";
  if(index===0) return "💡 Best match for your search";

  return "";
}

/*
========================================================
CLICK HANDLER (MONEY MOMENT)
--------------------------------------------------------
Every click = monetization event
========================================================
*/

function go(type){
  window.location.href = LINKS[type];
}

</script>

</body>
</html>
