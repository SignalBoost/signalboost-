<html lang="en" data-i18n-ready="0">
<head>

  <style>
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#0d1117;color:#fff}
    body{overflow:hidden}
    a{color:inherit}

    .top{
      height:40px;
      background:#232f3e;
      display:grid;
      grid-template-columns:240px 1fr 0;
      align-items:center;
      border-bottom:1px solid rgba(255,255,255,.1);
      position:fixed;
      inset:0 0 auto 0;
      z-index:1000;
    }
    .logo{color:#f5c542;font-weight:900;padding-left:2px;font-size:16px;white-space:nowrap}

    .navbar{
      display:flex;
      justify-content:center;
      align-items:center;
      background:#111;
      height:100%;
      width:100%;
      overflow:visible;
    }
    .nav-list{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:20px;
      list-style:none;
      margin:0;
      padding:0;
      height:100%;
    }
    .dropdown{position:relative;display:flex;align-items:center;height:100%}
    .dropbtn{
      height:100%;
      background:none;
      border:none;
      border-bottom:2px solid transparent;
      color:#fff;
      cursor:pointer;
      padding:0 10px;
      font-size:14px;
      font-weight:900;
      white-space:nowrap;
    }
    .dropbtn::after{content:'⌄';font-size:11px;margin-left:5px;color:#fff}
    .dropbtn:hover,.dropdown:hover .dropbtn{color:#f5c542;border-bottom-color:#f5c542}
    .dropdown-content{
      display:none;
      position:absolute;
      top:100%;
      left:50%;
      transform:translateX(-50%);
      background:#222;
      min-width:190px;
      max-height:420px;
      overflow:auto;
      z-index:1001;
      border:1px solid rgba(255,255,255,.12);
      border-radius:0 0 10px 10px;
      box-shadow:0 14px 28px rgba(0,0,0,.45);
      list-style:none;
      margin:0;
      padding:6px 0;
    }
    .dropdown:hover .dropdown-content{display:block}
    .dropdown-content li{list-style:none;margin:0;padding:0}
    .dropdown-content a,.dropdown-empty{
      display:block;
      color:#fff;
      padding:9px 14px;
      text-decoration:none;
      font-size:13px;
      font-weight:800;
      white-space:nowrap;
    }
    .dropdown-content a:hover{background:#232f3e;color:#f5c542}
    .dropdown-empty{color:#9aa8b8}

    .lang-switcher{display:none;justify-content:flex-end;padding-right:8px}
    #lang-select{background:#0f1724;color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:6px;padding:6px 10px;font-weight:700}

    .app{display:grid;grid-template-columns:260px minmax(560px,1fr)260px;height:100vh;padding-top:40px}
    .col{min-height:0;overflow:hidden}
    .left,.right{background:#0f141b}
    .left{border-right:1px solid rgba(255,255,255,.08)}
    .right{border-left:1px solid rgba(255,255,255,.08);padding:20px;overflow-y:auto}

    .controls{padding:10px 8px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
    .small-title{font-size:13px;color:#c9d7e8;text-transform:uppercase;font-weight:900;letter-spacing:.05em;margin-bottom:8px}
    #partnerSearch{width:100%;height:32px;background:#0d1117;color:#fff;border:1px solid rgba(255,255,255,.13);border-radius:10px;padding:8px 10px}

    #column1{
      height:auto;
      overflow:visible;
      padding:10px 8px 24px;
      display:flex;
      align-items:flex-start;
      gap:12px;
      white-space:nowrap;
      scrollbar-width:none;
    }
    #column1::-webkit-scrollbar{display:none}
    .left{overflow:visible}
    .column-category{
      position:relative;
      flex:0 0 auto;
      margin:0;
      border:none;
      border-radius:0;
      overflow:visible;
      background:transparent;
    }
    .column-category button{
      background:none;
      color:#fff;
      border:none;
      border-bottom:2px solid transparent;
      padding:8px 10px;
      cursor:pointer;
      width:auto;
      text-align:left;
      font-size:14px;
      font-weight:900;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:6px;
      white-space:nowrap;
    }
    .column-category button::after{content:'⌄';font-size:11px;margin-left:2px;color:#fff}
    .column-category button:hover,.column-category:hover button{color:#f5c542;border-bottom-color:#f5c542}
    .column-category ul{
      display:none;
      position:absolute;
      top:100%;
      left:0;
      min-width:220px;
      max-height:420px;
      overflow:auto;
      margin:0;
      padding:8px 0;
      list-style:none;
      background:#222;
      border:1px solid rgba(255,255,255,.12);
      border-radius:0 0 10px 10px;
      z-index:1002;
      box-shadow:0 14px 28px rgba(0,0,0,.45);
    }
    .column-category:hover ul{display:block}
    .column-category ul li{list-style:none;margin:0;padding:0}
    .column-category a,.column-category .dropdown-empty{
      display:block;
      color:#fff;
      padding:9px 14px;
      text-decoration:none;
      font-size:13px;
      font-weight:800;
      white-space:nowrap;
    }
    .column-category a:hover{background:#232f3e;color:#f5c542}
    .column-category .dropdown-empty{color:#9aa8b8}
    .column-arrow{display:none}

    .main{
      position:relative;
      background:#0d1117;
      display:flex;
      align-items:flex-start;
      justify-content:center;
      padding:18px 18px 96px;
      overflow-y:auto;
      scroll-snap-type:y proximity;
      -webkit-overflow-scrolling:touch;
    }
    .feed-container{width:100%;max-width:520px;display:flex;flex-direction:column;gap:22px}
    .feed-card{
      position:relative;
      display:block;
      text-decoration:none;
      border:1px solid rgba(245,197,66,.22);
      border-radius:22px;
      background:#111822;
      padding:10px;
      min-height:calc(100vh - 168px);
      transition:transform .18s ease,border-color .18s ease;
      cursor:pointer;
      scroll-snap-align:start;
      box-shadow:0 16px 42px rgba(0,0,0,.28);
    }
    .feed-card:hover{transform:translateY(-2px);border-color:rgba(245,197,66,.42)}
    .media{position:relative;aspect-ratio:9/16;height:min(76vh,760px);border-radius:18px;overflow:hidden;background:#0b0f14}
    .media img,.media video,.feed-video,.platform-frame{width:100%;height:100%;object-fit:cover;display:block;border:0}
    .media img{filter:brightness(.60)}
    .media.has-video img{filter:none}
    .media.has-embed{background:#000}
    .platform-frame{background:#000}
    .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
    .play span{width:74px;height:74px;border-radius:50%;background:#fff;color:#06101b;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900}
    .video-toggle{position:absolute;right:14px;top:14px;width:44px;height:44px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.48);color:#fff;font-size:17px;font-weight:900;cursor:pointer;z-index:5;backdrop-filter:blur(6px)}
    .video-toggle:hover{background:rgba(245,197,66,.92);color:#06101b}

    .feed-content{
      position:absolute;
      left:20px;
      right:20px;
      bottom:22px;
      padding:16px 14px;
      border-radius:18px;
      background:linear-gradient(180deg,rgba(8,12,18,0),rgba(8,12,18,.78) 20%,rgba(8,12,18,.92));
      text-shadow:0 2px 14px rgba(0,0,0,.75);
      pointer-events:auto;
    }
    .feed-label{display:inline-block;margin-bottom:8px;padding:5px 9px;border:1px solid rgba(245,197,66,.22);border-radius:999px;background:rgba(245,197,66,.16);color:#f5c542;font-size:11px;font-weight:900;text-transform:uppercase}
    .feed-source{float:right;color:rgba(255,255,255,.82);font-size:11px;font-weight:900;text-transform:uppercase;margin-top:6px}
    .feed-content h3{clear:both;margin:0 0 8px;font-size:22px;line-height:1.15}
    .feed-content p{margin:0;color:rgba(255,255,255,.86);font-size:14px;line-height:1.4}
    .feed-loader{width:100%;padding:18px;text-align:center;color:#9aa8b8;font-size:12px}
    .feed-empty{width:100%;padding:30px;text-align:center;color:#9aa8b8;border:1px solid rgba(255,255,255,.08);border-radius:14px;background:#111822}

    #stickyBar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(720px,calc(100% - 24px));background:rgba(15,20,27,.96);border:1px solid rgba(245,197,66,.25);border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;gap:12px;z-index:999}
    .sticky-link{color:#f5c542;text-decoration:none;font-weight:900}
    .right h2{text-align:center;margin:0 0 16px}
    #partnerChips{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    .chip{min-height:72px;display:flex;align-items:center;justify-content:center;text-align:center;border:1px solid rgba(255,255,255,.08);background:#1b2128;border-radius:10px;padding:10px;font-weight:800;font-size:13px;text-decoration:none}
    .see-more-btn{width:100%;margin:8px 0 12px;padding:10px 12px;border:1px solid rgba(245,197,66,.35);border-radius:10px;background:#111;color:#f5c542;font-weight:900;cursor:pointer}
    .see-more-btn:hover{background:#192532}
    .featured{display:block;text-decoration:none;border:1px solid rgba(245,197,66,.25);border-radius:16px;background:#111822;overflow:hidden;margin-bottom:16px;box-shadow:0 14px 28px rgba(0,0,0,.22)}

    .featured-body{padding:12px}
    .featured h4{margin:0 0 8px;color:#f5c542;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.04em}

    .featured span{display:block;color:rgba(255,255,255,.78);font-size:13px;line-height:1.35}
    .chips-title{margin:6px 0 12px;color:#c9d7e8;text-transform:uppercase;font-weight:900;letter-spacing:.05em;font-size:12px}
    .empty{color:#9aa8b8;padding:16px;font-size:13px}


    .sb-test-panel{position:fixed;left:10px;bottom:72px;z-index:9998;background:rgba(15,20,27,.96);border:1px solid rgba(245,197,66,.25);border-radius:14px;padding:10px;box-shadow:0 12px 28px rgba(0,0,0,.32);display:none;gap:6px;max-width:calc(100% - 20px)}
    .sb-test-panel.is-visible{display:flex;flex-wrap:wrap}
    .sb-test-panel a{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.1);background:#111822;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:900}
    .sb-test-panel a:hover{border-color:rgba(245,197,66,.45);color:#f5c542}
    .partner-card.is-priority,.rail-partner.is-priority,.chip.is-priority{border-color:rgba(245,197,66,.35)}

    #debug-overlay{position:fixed;right:10px;bottom:10px;background:rgba(0,0,0,.84);color:#fff;padding:10px 14px;border-radius:8px;font:13px monospace;z-index:9999;box-shadow:0 4px 14px rgba(0,0,0,.35);display:none}
    html[data-i18n-ready="0"] body{opacity:0}
    html[data-i18n-ready="1"] body{opacity:1;transition:opacity .12s}



    /* SignalBoost v2 conversion layer: vertical discovery + regional monetization */
    .app{grid-template-columns:300px minmax(680px,1fr)320px}
    .left{overflow-y:auto;overflow-x:hidden}
    #column1{display:flex;flex-direction:column;gap:12px;white-space:normal;overflow:visible;padding:12px 10px 90px;height:auto}
    .column-category{position:relative;width:100%;flex:0 0 auto;border:1px solid rgba(255,255,255,.08);border-radius:16px;background:#111822;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.16)}
    .column-category button{width:100%;background:linear-gradient(180deg,#151d28,#101822);border:0;color:#fff;padding:13px 14px;cursor:pointer;text-align:left;font-size:14px;font-weight:900;display:flex;justify-content:space-between;align-items:center;gap:10px;white-space:normal;border-bottom:1px solid rgba(255,255,255,.06)}
    .column-category button::after{content:'+';font-size:17px;color:#f5c542;margin-left:auto}.column-category[data-open="1"] button::after{content:'–'}
    .column-category button:hover{color:#f5c542;border-bottom-color:rgba(245,197,66,.18)}
    .column-category ul{display:none;position:static;min-width:0;max-height:none;overflow:visible;margin:0;padding:8px;list-style:none;background:transparent;border:0;border-radius:0;box-shadow:none}.column-category[data-open="1"] ul{display:grid;gap:8px}
    .column-category ul li{list-style:none;margin:0;padding:0}.column-category:hover ul{display:none}.column-category[data-open="1"]:hover ul{display:grid}
    .partner-card{display:grid!important;grid-template-columns:1fr auto;gap:8px;align-items:center;color:#fff;padding:10px 10px!important;text-decoration:none;font-size:13px;font-weight:800;white-space:normal;border:1px solid rgba(255,255,255,.07);background:#0d1117;border-radius:12px;transition:.18s ease}.partner-card:hover{background:#192532;color:#fff;border-color:rgba(245,197,66,.35);transform:translateY(-1px)}
    .partner-card strong{display:block;font-size:13px;line-height:1.2}.partner-card span{display:block;margin-top:3px;color:rgba(255,255,255,.62);font-size:11px;font-weight:700;line-height:1.25}.partner-card em{font-style:normal;color:#111;background:#f5c542;border-radius:999px;padding:6px 8px;font-size:11px;font-weight:900}
    .category-title{display:flex;align-items:center;gap:8px}.category-count{margin-left:auto;color:#9aa8b8;font-size:12px}
    .trend-strip{width:100%;max-width:820px;margin:0 auto 14px;padding:10px 12px;border:1px solid rgba(245,197,66,.18);border-radius:999px;background:rgba(17,24,34,.9);display:flex;align-items:center;gap:12px;overflow-x:auto;scrollbar-width:none}.trend-strip::-webkit-scrollbar{display:none}.trend-kicker{color:#f5c542;font-size:12px;font-weight:900;white-space:nowrap;text-transform:uppercase}.trend-items{display:flex;gap:8px}.trend-pill{display:inline-flex;white-space:nowrap;text-decoration:none;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:7px 10px;font-size:12px;font-weight:900;color:#fff;transition:.18s ease}.trend-pill:hover{background:rgba(245,197,66,.15);border-color:rgba(245,197,66,.35);transform:translateY(-1px)}
    .region-hero{width:100%;max-width:820px;margin:0 auto 20px;position:relative;overflow:hidden;border-radius:26px;border:1px solid rgba(245,197,66,.24);background:radial-gradient(circle at 10% 15%,rgba(245,197,66,.22),transparent 32%),linear-gradient(135deg,#152032,#0c1118);box-shadow:0 22px 52px rgba(0,0,0,.32);padding:24px;display:grid;grid-template-columns:1.25fr .75fr;gap:18px;align-items:end}.region-hero::after{content:"";position:absolute;inset:auto -80px -120px auto;width:330px;height:330px;border-radius:50%;background:rgba(245,197,66,.13);filter:blur(4px)}.hero-copy,.hero-partners{position:relative;z-index:1}.region-badge{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border-radius:999px;background:rgba(245,197,66,.16);border:1px solid rgba(245,197,66,.25);color:#f5c542;font-size:12px;font-weight:900;text-transform:uppercase;margin-bottom:14px}.region-hero h1{margin:0 0 10px;font-size:34px;line-height:1.05;letter-spacing:-.03em}.region-hero p{margin:0;color:rgba(255,255,255,.78);font-size:15px;line-height:1.45;max-width:620px}.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.primary-cta,.secondary-cta{display:inline-flex;align-items:center;justify-content:center;border-radius:14px;padding:11px 15px;text-decoration:none;font-weight:900;font-size:13px;transition:.18s ease}.primary-cta{background:#f5c542;color:#10151d;box-shadow:0 12px 28px rgba(245,197,66,.18)}.secondary-cta{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff}.primary-cta:hover,.secondary-cta:hover{transform:translateY(-2px)}.hero-partners{display:grid;gap:10px}.hero-mini-card{display:block;text-decoration:none;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:12px;backdrop-filter:blur(8px);transition:.18s ease}.hero-mini-card:hover{transform:translateX(-3px);border-color:rgba(245,197,66,.36);background:rgba(245,197,66,.10)}.hero-mini-card strong{display:block;font-size:14px;margin-bottom:4px}.hero-mini-card span{display:block;color:rgba(255,255,255,.7);font-size:12px;line-height:1.3}
    body.region-br .region-hero{background:radial-gradient(circle at 10% 15%,rgba(255,204,0,.26),transparent 32%),linear-gradient(135deg,#16351d,#0c1118)}body.region-pl .region-hero{background:radial-gradient(circle at 10% 15%,rgba(245,197,66,.20),transparent 32%),linear-gradient(135deg,#202737,#0c1118)}body.region-uk .region-hero,body.region-us .region-hero{background:radial-gradient(circle at 10% 15%,rgba(245,197,66,.18),transparent 32%),linear-gradient(135deg,#17243a,#0c1118)}

    /* Growth layer: SEO discovery, regional navigation, and lightweight insight cards */

    #growthSection[hidden], .admin-only[hidden]{display:none !important}

    function mergePartners(arr){
      const map=new Map();
      (Array.isArray(arr)?arr:[]).forEach(p=>{
        if(!p||!p.name||!p.url||p.status==="hold"||p.status==="disabled") return;
        const c=categoryKey(p);
        const key=normalizePartnerName(p.name)+"|"+c;
        const regs=normalizePartnerRegions(p);
        let e=map.get(key);
        if(!e){e={...p,category_key:c,regions:[],regional_urls:{...(p.regional_urls||{})}};map.set(key,e);}
        regs.forEach(r=>{if(!e.regions.includes(r))e.regions.push(r); if(!e.regional_urls[r]) e.regional_urls[r]=p.url;});
        if((p.tier||99)<(e.tier||99)){["name","url","network","description","tier","category_label"].forEach(f=>{if(p[f])e[f]=p[f];});}
      });
      return [...map.values()];
    }

    function partnerMatchesRegion(p, region){return normalizePartnerRegions(p).includes(normalizeRegion(region));}

    function partnerForRegion(p, region){
      region=normalizeRegion(region);
      const regs=normalizePartnerRegions(p);
      const urls=p.regional_urls || {};
      const key=categoryKey(p);
      return {
        ...p,
        regions:regs,
        matched_region:region,
        region,
        url:urls[region] || p.url || "#",
        category_key:key,
        category_label:ACTIVE_TRANSLATIONS[key] || ACTIVE_TRANSLATIONS[canonicalCategoryKey(key)] || p.category_label || key,
        description:p.description || ""
      };
    }

    async function loadPartners(){

          if(r.ok){const d=await r.json(); return Array.isArray(d)?d:(d.partners||[]);}
        }catch(e){}

        .filter(p=>{const k=normalizePartnerName(p.name)+"|"+displayCategoryKey(p.category_key); if(seen.has(k)) return false; seen.add(k); return true;});
      return smartSortPartners(list);

      counts[specific]=(counts[specific]||0)+1;

    function partnerPriorityScore(p){
      const cfg=regionConfig(ACTIVE_REGION);
      const heroNames=(cfg.heroPartners||[]).map(x=>String(x).toLowerCase());
      const primaryCategories=(cfg.primaryCategories||[]).map(displayCategoryKey);
      const counts=readClickCounts();
      let score=0;
      if(p.featured) score+=5000;
      const heroIndex=heroNames.indexOf(String(p.name).toLowerCase());
      if(heroIndex>=0) score+=4000-heroIndex*150;
      const catIndex=primaryCategories.indexOf(displayCategoryKey(p.category_key));
      if(catIndex>=0) score+=2500-catIndex*100;
      score+=Math.max(0,1000-(p.tier||99)*80);
      score+=(counts[[ACTIVE_REGION,p.name].join("|")]||0)*35;
      return score;
    }

    function smartSortPartners(partners){

    function setupFeedVideos(root=document){
      const videos=[...root.querySelectorAll('.feed-video')];

      function toggleVideo(video){
        if(!video) return;
        video.muted=true;
        video.playsInline=true;
        if(video.paused || video.ended){
          video.play().catch(err=>{
            const media=video.closest('.media');
            if(media) media.classList.add('video-needs-user-action');
            console.warn('Video play blocked or failed:', err);
          });
        }else{
          video.pause();
        }
      }

      videos.forEach(video=>{
        video.muted=true;
        video.playsInline=true;
        video.setAttribute('playsinline','');
        video.setAttribute('webkit-playsinline','');

        const media=video.closest('.media');
        const btn=media && media.querySelector('.video-toggle');
        const playOverlay=media && media.querySelector('.play');

        const sync=()=>{
          const paused=video.paused || video.ended;
          if(btn){
            btn.textContent = paused ? '▶' : '❚❚';
            btn.setAttribute('aria-label', paused ? 'Play video' : 'Pause video');
          }
          if(playOverlay) playOverlay.style.display = paused ? 'flex' : 'none';
          if(media) media.classList.toggle('is-playing', !paused);
        };

        // The video area is reserved for opening the partner offer.
        // Play/pause is controlled by the small video button only.
        if(media){ media.style.cursor='pointer'; }

        if(btn && !btn.dataset.videoBound){
          btn.dataset.videoBound='1';
          btn.addEventListener('click',e=>{
            e.preventDefault();
            e.stopPropagation();
            toggleVideo(video);
            setTimeout(sync,80);
          });
        }

        video.addEventListener('click',e=>{
          // Let the card/media handler open the partner offer.
        });
        video.addEventListener('play',sync);
        video.addEventListener('pause',sync);
        video.addEventListener('ended',sync);
        sync();
      });

      if('IntersectionObserver' in window){
        const io=new IntersectionObserver(entries=>{
          entries.forEach(entry=>{
            const video=entry.target;
            if(entry.isIntersecting){ video.play().catch(()=>{}); }
            else { video.pause(); }
          });
        },{threshold:.65});
        videos.forEach(v=>io.observe(v));
      }
    }

      const backdrop=document.getElementById('offerDrawerBackdrop');
      if(!drawer || !backdrop) return;
      const rows=(items||[]).map(x=>`<a href="${esc(x.url || partnerUrl(x))}" target="_blank" rel="noopener" onclick="trackAffiliateClick({name:'${esc(x.name)}',category_key:'${esc(x.category_key||'saved')}',url:'${esc(x.url || partnerUrl(x))}',regional_urls:{[ACTIVE_REGION]:'${esc(x.url || partnerUrl(x))}'}},'mobile_list_drawer')"><span>${esc(x.name)}<small>${esc(translatedCategory(canonicalCategoryKey(x.category_key||'')) || x.description || '')}</small></span><em>→</em></a>`).join('');
      drawer.innerHTML=`<div class="drawer-handle"></div><div class="drawer-head"><div><h3>${esc(title)}</h3><p>${esc(regionDisplayLabel(ACTIVE_REGION))}</p></div><button class="drawer-close" type="button" onclick="closeOfferDrawer()" aria-label="Close">×</button></div><div class="drawer-list">${rows || `<div class="right-rail-empty">${esc(emptyText || 'Nothing here yet.')}</div>`}</div>`;
      backdrop.classList.add('is-open'); drawer.classList.add('is-open'); drawer.setAttribute('aria-hidden','false');
    }

    function mobileNavHome(){
      const main=document.getElementById('magnetoColumn');
      if(main) main.scrollTo({top:0,behavior:'smooth'}); else window.scrollTo({top:0,behavior:'smooth'});
    }
    function mobileNavSearch(){
      const input=document.getElementById('partnerSearch');
      if(input){ input.focus(); input.scrollIntoView({behavior:'smooth',block:'center'}); }
    }
    function mobileNavCategories(){
      const left=document.querySelector('.left');
      if(left) left.scrollIntoView({behavior:'smooth',block:'start'});
    }
    function mobileNavSaved(){
      openListDrawer('Saved offers', getSavedOffers().filter(x=>!x.region || x.region===ACTIVE_REGION), 'Save offers from the feed to compare them later.');
    }
    function mobileNavRegion(){
      const regionLinks=[['United States','us','en'],['Brazil','br','pt'],['Poland','pl','pl'],['United Kingdom','uk','en'],['LATAM','es-latam','es'],['Other','ot','en']];
      const items=regionLinks.map(([name,region,lang])=>({name,category_key:'region',description:regionConfig(region).label || region,url:localizedRegionPath(region,lang)}));
      openListDrawer('Choose region', items, 'No regions available.');
    }

    window.openOfferDrawer=openOfferDrawer;
    window.closeOfferDrawer=closeOfferDrawer;
    window.mobileNavHome=mobileNavHome;
    window.mobileNavSearch=mobileNavSearch;
    window.mobileNavCategories=mobileNavCategories;
    window.mobileNavSaved=mobileNavSaved;
    window.mobileNavRegion=mobileNavRegion;

    function renderNextFeedBatch(){
      if(FEED_LOADING) return;
      FEED_LOADING=true;
      const container=document.getElementById("feedContainer");
      if(!FEED_ITEMS.length){
        container.innerHTML='<div class="feed-empty">No feed items for this region.</div>';
        FEED_LOADING=false;
        return;
      }
      const start=FEED_PAGE*FEED_PAGE_SIZE;
      const batch=FEED_ITEMS.slice(start,start+FEED_PAGE_SIZE);
      if(!batch.length){
        FEED_PAGE=0;
        FEED_LOADING=false;
        renderNextFeedBatch();
        return;
      }
      const frag=document.createDocumentFragment();
      batch.forEach(item=>{
        const card=document.createElement("article");
        card.className="feed-card";
        card.innerHTML=`
          ${mediaHTML(item)}
          <div class="feed-content">
            <span class="feed-label">${esc(item.category_label || translatedCategory(item.category_key))}</span>
            <span class="feed-source">${esc(item.feed_source || "feed")}</span>
            <h3>${esc(item.feed_title)}</h3>
            <p>${esc(item.feed_description)}</p>
            <a class="primary-cta" href="${esc(partnerUrl(item))}" target="_blank" rel="noopener"${clickAttrs(item,'feed_card')}>${esc(ACTIVE_TRANSLATIONS.view_more || "View More")} →</a>
            <button class="save-offer-btn ${isSavedOffer(item)?'is-saved':''}" type="button" data-save-id="${esc(partnerId(item))}" onclick="event.preventDefault();event.stopPropagation();toggleSavedOffer(FEED_ITEMS.find(x=>partnerId(x)==='${esc(partnerId(item))}')||${JSON.stringify({})})">${isSavedOffer(item)?'★ Saved':'☆ Save'}</button>
          </div>`;
        const mediaEl=card.querySelector('.media');
        if(mediaEl){
          mediaEl.addEventListener('click',e=>{
            if(e.target.closest('.video-toggle')) return;
            if(isMobileViewport()) openOfferDrawer(item,'feed_video_area');
            else { trackAffiliateClick(item,'feed_video_area'); window.open(partnerUrl(item),'_blank','noopener'); }
          });
        }
        card.addEventListener("click",e=>{
          const tag=(e.target.tagName||"").toLowerCase();
          if(["video","iframe","source","a","button"].includes(tag) || e.target.closest('.media')) return;
          if(isMobileViewport()) openOfferDrawer(item,'feed_card_body');
          else { trackAffiliateClick(item,'feed_card_body'); window.open(partnerUrl(item),"_blank","noopener"); }
        });
        frag.appendChild(card);
      });
      container.appendChild(frag);
      setupFeedVideos(container);
      FEED_PAGE++;
      FEED_LOADING=false;
    }

    function resetFeed(partners){
      FEED_ITEMS=buildFeedItems(partners);
      FEED_PAGE=0;
      const container=document.getElementById("feedContainer");
      container.innerHTML="";
      renderNextFeedBatch();
      renderNextFeedBatch();
    }

    function renderRight(partners){
      const chips=document.getElementById("partnerChips");
      if(!chips) return;
      const featured=partners.find(p=>p.featured) || partners.find(p=>(p.tier||99)===1) || partners[0];
      const featuredHTML=featured ? `
        <a class="featured" href="${esc(partnerUrl(featured))}" target="_blank" rel="noopener"${clickAttrs(featured,'right_featured')}>
          ${(featured.thumbnail || featured.image || featured.logo) ? `<img src="${esc(featured.thumbnail || featured.image || featured.logo)}" alt="${esc(featured.name)}" loading="lazy" decoding="async" onerror="this.style.display='none'">` : ""}
          <div class="featured-body">
            <h4>${esc(translatedCategory(canonicalCategoryKey(featured.category_key)))}</h4>
            <p>${esc(featured.name)}</p>
            <span>${esc(featured.description || `Explore ${featured.name} offers.`)}</span>
          </div>
        </a>` : "";
      const chipHTML=smartSortPartners(partners).slice(0,18).map(p=>`<a class="chip ${isPriorityPartner(p)?'is-priority':''}" href="${esc(partnerUrl(p))}" target="_blank" rel="noopener"${clickAttrs(p,'right_chip')}>${esc(p.name)}</a>`).join("");
      const saved=getSavedOffers().filter(x=>!x.region || x.region===ACTIVE_REGION).slice(0,4);
      const recent=readStoredList(RECENT_OFFERS_KEY).filter(x=>!x.region || x.region===ACTIVE_REGION).slice(0,4);
      const savedHTML=`<div class="right-rail-block"><div class="rail-section-title">★ Saved offers</div>${saved.length?`<div class="rail-list">${saved.map(x=>`<a class="rail-list-item" href="${esc(x.url)}" target="_blank" rel="noopener" onclick="trackAffiliateClick({name:'${esc(x.name)}',category_key:'${esc(x.category_key)}',url:'${esc(x.url)}',regional_urls:{[ACTIVE_REGION]:'${esc(x.url)}'}},'saved_rail')"><span><strong>${esc(x.name)}</strong><span>${esc(translatedCategory(canonicalCategoryKey(x.category_key)))}</span></span><em>→</em></a>`).join('')}</div>`:`<div class="right-rail-empty">Save offers from the feed to compare them later.</div>`}</div>`;
      const recentHTML=recent.length?`<div class="right-rail-block"><div class="rail-section-title">Recently viewed</div><div class="rail-list">${recent.map(x=>`<a class="rail-list-item" href="${esc(x.url)}" target="_blank" rel="noopener" onclick="trackAffiliateClick({name:'${esc(x.name)}',category_key:'${esc(x.category_key)}',url:'${esc(x.url)}',regional_urls:{[ACTIVE_REGION]:'${esc(x.url)}'}},'recent_rail')"><span><strong>${esc(x.name)}</strong><span>${esc(translatedCategory(canonicalCategoryKey(x.category_key)))}</span></span><em>→</em></a>`).join('')}</div></div>`:'';
      chips.innerHTML=`${featuredHTML}${savedHTML}${recentHTML}<div class="chips-title">${esc(ACTIVE_TRANSLATIONS.partners || "Partners")}</div>${chipHTML}`;
    }

    function renderSticky(partners){
      const p=partners[0];
      if(!p) return;
      document.getElementById("stickyCopy").textContent=p.description || `Explore ${p.name}.`;
      const link=document.getElementById("stickyLink");
      link.href=partnerUrl(p);
      link.textContent=ACTIVE_TRANSLATIONS.view_more || "View More";
      link.onclick=()=>trackAffiliateClick(p,"sticky_bar");
    }




    function regionDisplayLabel(region){
      const cfg=regionConfig(region);
      return cfg ? `${cfg.flag || ''} ${cfg.label || region}`.trim() : String(region).toUpperCase();
    }

    function isAdminView(){
      const params=new URLSearchParams(location.search);
      return params.get('admin')==='1' || params.get('sbadmin')==='1';
    }

    function updateDynamicSeo(partners){
      const cfg=regionConfig(ACTIVE_REGION);
      const copy=regionCopy();
      const topCats=[...new Set(partners.map(p=>canonicalCategoryKey(p.category_key)).filter(Boolean))].slice(0,4).map(translatedCategory);
      const title=`${copy.title || 'SignalBoost'} | ${regionDisplayLabel(ACTIVE_REGION)}`;
      const desc=(copy.desc || `Find regional travel, marketplace and service offers.`) + (topCats.length ? ` Explore ${topCats.join(', ')}.` : '');
      document.title=title;
      let meta=document.querySelector('meta[name="description"]');
      if(!meta){meta=document.createElement('meta');meta.setAttribute('name','description');document.head.appendChild(meta);}
      meta.setAttribute('content',desc.slice(0,155));
      document.documentElement.lang=ACTIVE_LANGUAGE || 'en';
      document.body.className=document.body.className.replace(/\bregion-[a-z0-9-]+\b/g,'').trim();
      document.body.classList.add(`region-${ACTIVE_REGION}`);
    }

    function localizedRegionPath(region, lang){
      const params=new URLSearchParams(location.search);
      params.set('region',region);
      params.set('lang',lang || detectLanguage(region));
      params.delete('sbtest');
      params.delete('debug');
      return `${location.pathname}?${params.toString()}`;
    }

    function renderGrowthSection(partners){
      const el=document.getElementById('growthSection');
      if(!el) return;
      if(!isAdminView()){
        el.innerHTML='';
        el.setAttribute('hidden','hidden');
        el.style.display='none';
        return;
      }
      el.style.display='grid';
      el.removeAttribute('hidden');
      const cfg=regionConfig(ACTIVE_REGION);
      const copy=regionCopy();
      const categories=[...new Set(smartSortPartners(partners).map(p=>canonicalCategoryKey(p.category_key)).filter(Boolean))].slice(0,9);
      const topPartners=smartSortPartners(partners).slice(0,6);
      const regionLinks=[['US','us','en'],['BR','br','pt'],['PL','pl','pl'],['UK','uk','en'],['LATAM','es-latam','es']];
      const counts=readClickCounts();
      const totalClicks=Object.values(counts).reduce((a,b)=>a+(Number(b)||0),0);
      const seoLinks=categories.map(cat=>{
        const label=translatedCategory(cat);
        const href=`?region=${encodeURIComponent(ACTIVE_REGION)}&lang=${encodeURIComponent(ACTIVE_LANGUAGE)}&category=${encodeURIComponent(cat)}`;
        return `<a class="seo-link" href="${href}" onclick="trackAffiliateClick({name:'category:${esc(cat)}',category_key:'${esc(cat)}'},'seo_category')"><strong>${esc(label)}</strong><span>→</span></a>`;
      }).join('');
      const partnerLinks=topPartners.map(p=>`<a class="seo-link" href="${esc(partnerUrl(p))}" target="_blank" rel="noopener"${clickAttrs(p,'growth_partner')}><strong>${esc(p.name)}</strong><span>→</span></a>`).join('');
      const regions=regionLinks.map(([label,region,lang])=>`<a class="region-link ${region===ACTIVE_REGION?'is-active':''}" href="${localizedRegionPath(region,lang)}"><span>${label}</span><small>${esc(regionConfig(region).label || region)}</small></a>`).join('');
      el.innerHTML=`
        <div class="growth-card">
          <h2>Admin diagnostics ${esc(cfg.flag || '')}</h2>
          <p>${esc(copy.desc || 'Explore offers by region, category and partner.')}</p>
          <div class="insight-strip">
            <div class="insight"><strong>${partners.length}</strong><span>regional partners</span></div>
            <div class="insight"><strong>${categories.length}</strong><span>active categories</span></div>
            <div class="insight"><strong>${totalClicks}</strong><span>tracked local clicks</span></div>
          </div>
        </div>
        <div class="growth-card">
          <h3>Admin category links</h3>
          <div class="seo-grid">${seoLinks || '<div class="empty">No categories available.</div>'}</div>
        </div>
        <div class="growth-card">
          <h3>Admin partner links</h3>
          <div class="seo-grid">${partnerLinks || '<div class="empty">No partners available.</div>'}</div>
        </div>
        <div class="growth-card">
          <h3>Admin region switcher</h3>
          <div class="region-grid">${regions}</div>
        </div>`;
    }

    function renderRegionTestPanel(){
      const params=new URLSearchParams(location.search);
      const enabled=isAdminView();
      let panel=document.getElementById('sbTestPanel');
      if(!panel){
        panel=document.createElement('div');
        panel.id='sbTestPanel';
        panel.className='sb-test-panel';
        document.body.appendChild(panel);
      }
      const tests=[
        ['US','us','en'],['BR','br','pt'],['PL','pl','pl'],['UK','uk','en'],['LATAM','es-latam','es'],['RU','ru','ru'],['OT','ot','en']
      ];
      panel.classList.toggle('is-visible', enabled);
      if(!enabled){ panel.innerHTML=''; return; }
      panel.innerHTML=tests.map(([label,region,lang])=>`<a href="?region=${region}&lang=${lang}&sbadmin=1">${label}</a>`).join('');
    }

    function auditRegionSafety(partners){
      const report={region:ACTIVE_REGION,language:ACTIVE_LANGUAGE,partners:partners.length,missingUrls:partners.filter(p=>!partnerUrl(p)||partnerUrl(p)==='#').map(p=>p.name),emptyCategories:[]};
      column1Categories.forEach(cat=>{
        const key=displayCategoryKey(cat);
        if(!partners.some(p=>displayCategoryKey(p.category_key)===key)) report.emptyCategories.push(cat);
      });
      window.signalBoostRegionAudit=report;
      return report;
    }

    function renderAll(){
      const partners=visiblePartners();
      auditRegionSafety(partners);
      updateDynamicSeo(partners);
      renderRegionTestPanel();
      renderHeader(partners);
      renderTrendingStrip(partners);
      renderRegionHero(partners);
      renderColumn1(partners);
      renderRight(partners);
      renderSticky(partners);
      resetFeed(partners);
      renderGrowthSection(partners);
    }

    document.getElementById("partnerSearch").addEventListener("input",()=>renderColumn1(visiblePartners()));
    document.getElementById("magnetoColumn").addEventListener("scroll",e=>{
      const el=e.currentTarget;
      if(el.scrollTop+el.clientHeight>=el.scrollHeight-700) renderNextFeedBatch();
    });

    async function init(){
      ACTIVE_REGION=detectRegion();
      ACTIVE_LANGUAGE=getPreferredLanguage(ACTIVE_REGION);
      ACTIVE_TRANSLATIONS=await loadTranslations(ACTIVE_LANGUAGE);
      ACTIVE_PARTNERS=await loadPartners();
      applyTranslations(ACTIVE_TRANSLATIONS);
      setupLanguageSwitcher();
      renderAll();
      if(window.dataLayer) window.dataLayer.push({event:'page_region_view',region:ACTIVE_REGION,language:ACTIVE_LANGUAGE,path:location.pathname});
    }

    init();
  </script>
</body>
</html>
