<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SignalBoost AI Travel</title>

<style>
body {
margin: 0;
font-family: Arial, sans-serif;
background: linear-gradient(135deg, #0b1220, #172554);
color: white;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
min-height: 100vh;
}

.container {
text-align: center;
padding: 30px;
border-radius: 18px;
background: rgba(255,255,255,0.08);
border: 1px solid rgba(255,255,255,0.15);
box-shadow: 0 10px 30px rgba(0,0,0,0.25);
max-width: 500px;
width: 90%;
}

h1 {
margin-bottom: 20px;
}

#live-clock {
font-size: 36px;
font-weight: bold;
margin-bottom: 20px;
}

.button {
display: inline-block;
padding: 14px 20px;
margin-top: 20px;
background: #3b82f6;
color: white;
text-decoration: none;
border-radius: 10px;
font-weight: bold;
transition: 0.3s;
}

.button:hover {
background: #2563eb;
}

.description {
margin-top: 10px;
color: #cbd5e1;
font-size: 14px;
}
</style>
</head>

<body>

<div class="container">
<h1>SignalBoost AI Travel</h1>

<!-- CLOCK -->
<div id="live-clock">--:--:--</div>

<!-- AI RESULT EXAMPLE -->
<p>Top things to do in Paris:</p>
<ul style="text-align:left;">
<li>Eiffel Tower guided tour</li>
<li>Seine River cruise</li>
<li>Louvre Museum visit</li>
</ul>

<!-- 🔥 YOUR AFFILIATE LINK -->
<a
class="button"
href="https://www.viator.com/paris/d479-ttd?pid=P00294693&mcid=42383&medium=link"
target="_blank"
>
Explore Activities in Paris
</a>

<div class="description">
Book top experiences and tours with trusted providers.
</div>
</div>

<!-- CLOCK SCRIPT -->
<script>
(function () {
const clockEl = document.getElementById("live-clock");

function updateClock() {
const now = new Date();
clockEl.textContent = now.toLocaleTimeString();
}

updateClock();

setInterval(updateClock, 1000);

document.addEventListener("visibilitychange", function () {
if (document.visibilityState === "visible") {
updateClock();
}
});

window.addEventListener("focus", updateClock);
})();
</script>

</body>
</html>
