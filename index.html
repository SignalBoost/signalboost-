    function detectRegionFromLocale() {
      const locale = (navigator.languages && navigator.languages[0]) || navigator.language || "";
      const lang = locale.toLowerCase();

      if (lang.startsWith("pt-br") || lang === "pt") return "br";
      if (lang.startsWith("pl")) return "pl";
      if (lang.startsWith("es")) return "latam";
      if (lang.startsWith("en-gb")) return "gb";
      if (lang.startsWith("en-ca")) return "ca";
      if (lang.startsWith("en")) return "us";
      if (lang.startsWith("de")) return "de";
      if (lang.startsWith("fr")) return "fr";
      if (lang.startsWith("it")) return "it";

      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
      if (tz.includes("Sao_Paulo")) return "br";
      if (tz.includes("Warsaw")) return "pl";
      if (tz.includes("Mexico") || tz.includes("Bogota") || tz.includes("Lima") || tz.includes("Buenos_Aires") || tz.includes("Santiago")) return "latam";

      return "us";
    }

    function getRegion() {
      const params = new URLSearchParams(window.location.search);
      const raw = (params.get("region") || "").toLowerCase();
      if (raw && REGION_CONFIG[raw]) return raw;
      const detected = detectRegionFromLocale();
      return REGION_CONFIG[detected] ? detected : "us";
    }

      return REGION_CONFIG[getRegion()].lang;

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

      const region = getRegion();

      const map = {

        ca: ["global", "ca", "us", "gb", "uk"],
        gb: ["global", "gb", "uk", "eu"],
        uk: ["global", "gb", "uk", "eu"],
        br: ["global", "br"],
        pl: ["global", "pl", "eu"],
        latam: ["global", "latam", "mx"],
        mx: ["global", "mx", "latam"],
        es: ["global", "es", "eu"],
        de: ["global", "de", "eu"],
        fr: ["global", "fr", "eu"],
        it: ["global", "it", "eu"]
      };

      return map[region] || ["global", region];
    }

    function isBrazilOnlyPartner(partner) {
      const region = String(partner.region || "").toLowerCase();
      const name = String(partner.name || "").toLowerCase();
      return region === "br" || /\bbr\b|brazil|brasil/.test(name);
    }

    function isPolandOnlyPartner(partner) {
      const region = String(partner.region || "").toLowerCase();
      const name = String(partner.name || "").toLowerCase();
      return region === "pl" || /\bpl\b|poland|polska/.test(name);
    }

    function isPartnerAllowedForRegion(partner) {
      const currentRegion = getRegion();
      const partnerRegion = String(partner.region || "global").toLowerCase();
      const partnerName = String(partner.name || "").toLowerCase();

      if (currentRegion === "us" && (isBrazilOnlyPartner(partner) || isPolandOnlyPartner(partner))) return false;
      if (currentRegion === "us" && (partnerRegion === "us" || /\busa?\b/.test(partnerName))) return true;

      return allowedPartnerRegions().includes(partnerRegion);
    }

      return {

    async function fetchJsonWithTimeout(url, timeoutMs = 3500) {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeoutMs);

      try {
        const response = await fetch(url, {
          signal: controller.signal,
          cache: "no-store"
        });

        if (!response.ok) throw new Error("Feed request failed");
        return await response.json();
      } finally {
        clearTimeout(id);
      }
    }


    function inferItemRegion(item) {
      const explicit = String(item.region || "").toLowerCase();
      if (explicit) return explicit;

      const text = [
        item.title,
        item.description,
        item.summary,
        item.caption,
        item.author,
        item.channel,
        item.creator,
        item.url
      ].filter(Boolean).join(" ").toLowerCase();

      if (/\bperu\b|\bperú\b|\blima\b|\bcusco\b|\bmachu picchu\b/.test(text)) return "latam";
      if (/\bbrazil\b|\bbrasil\b|\bsão paulo\b|\brio de janeiro\b/.test(text)) return "br";
      if (/\bpoland\b|\bpolska\b|\bwarsaw\b|\bkrakow\b|\bkraków\b/.test(text)) return "pl";
      if (/\bmexico\b|\bméxico\b|\bcancun\b|\bcancún\b/.test(text)) return "mx";
      if (/\busa\b|\bunited states\b|\bnew york\b|\blas vegas\b|\bmiami\b|\blos angeles\b|\bcalifornia\b|\bflorida\b/.test(text)) return "us";

      return "global";
    }

        ca: ["global", "ca", "us"],
        gb: ["global", "gb", "uk", "eu"],
        uk: ["global", "gb", "uk", "eu"],
        br: ["global", "br"],
        pl: ["global", "pl", "eu"],
        latam: ["global", "latam", "mx"],
        mx: ["global", "mx", "latam"],
        es: ["global", "es", "eu"],
        de: ["global", "de", "eu"],
        fr: ["global", "fr", "eu"],
        it: ["global", "it", "eu"]
      };

      return map[region] || ["global", region];
    }

    function isVideoAllowedForRegion(item) {
      return allowedVideoRegions().includes(inferItemRegion(item));
    }

    async function loadHeroFeedItems() {
      const status = document.getElementById("heroFeedStatus");
      if (status) status.textContent = t().loadingVideos || "Loading current videos…";

      for (const endpoint of getHybridFeedEndpoints()) {
        try {
          const data = await fetchJsonWithTimeout(endpoint);
          const rawItems = Array.isArray(data) ? data : (data.items || data.videos || data.results || []);
          const normalizedItems = rawItems
            .map(normalizeHeroFeedItem)
            .filter(item => item.url && item.title);

          const regionalItems = normalizedItems.filter(isVideoAllowedForRegion);
          const items = regionalItems.length ? regionalItems : normalizedItems.filter(item => inferItemRegion(item) === "global");

          if (items.length) {
            if (status) status.textContent = "";
            return items
              .sort((a, b) => (b.score || 0) - (a.score || 0))
              .slice(0, 30);
          }
        } catch (error) {
          // Try the next source silently.
        }
      }

      if (status) status.textContent = "";
      return fallbackHeroFeedItems.filter(isVideoAllowedForRegion).length ? fallbackHeroFeedItems.filter(isVideoAllowedForRegion) : fallbackHeroFeedItems;
    }

    }

    async function renderFeed() {
      let items = [];

      try {

    function getAmazonLink(type = "general") {
      const base = getAmazonBaseByRegion();
      const tag = getAmazonTagByRegion();
      const dict = getCurrentTranslations();
      const queries = dict.amazonQueries || I18N.en.amazonQueries;
      const q = encodeURIComponent(queries[type] || queries.general);
      return `${base}/s?k=${q}&tag=${tag}`;
    }

    function hydrateAmazonLinks() {
      const amazonCards = document.querySelectorAll(".amazon-card");
      const cardKeys = ["power", "adapter", "luggage", "packing"];

      amazonCards.forEach((card, index) => {
        const key = cardKeys[index] || "general";
        const url = getAmazonLink(key);
        card.href = url;
        card.target = "_blank";
        card.rel = "noopener noreferrer";
      });

      const form = document.getElementById("amazonSearchForm");
      if (form) {
        form.action = `${getAmazonBaseByRegion()}/s`;
        const hiddenTag = form.querySelector('input[name="tag"]');
        if (hiddenTag) hiddenTag.value = getAmazonTagByRegion();
      }
    }

    function setFeatured() {
      const featured = visibleTopTravelPartners().find(p => p.tier === 1) || visibleTopTravelPartners()[0];
      if (!featured) return;

      document.getElementById("stickyCopy").textContent = t().stickyCopy;
      document.getElementById("stickyLink").href = featured.url;
      document.getElementById("stickyLink").addEventListener("click", trackClick);
    }

    partnerSearch.addEventListener("input", renderPartnersRail);

async function loadLanguage(lang) {
  const res = await fetch(`/i18n/${lang}.json`);
  const translations = await res.json();

  document.querySelectorAll("[data-i18n]").forEach(el => {

async function loadTravelDirectory(region) {
  const res = await fetch('/api/data/partners.json');
  const partners = await res.json();

  const travelCategories = [
    "Flights & Meta Search",
    "Hotels",
    "Car Rentals",
    "Transfers & Transport",
    "Tours & Activities",
    "SIM & Connectivity",
    "Insurance & Claims",
    "Travel Services"
  ];

  const grouped = {};
  travelCategories.forEach(cat => grouped[cat] = []);

  partners.forEach(p => {
    if (grouped[p.category]) {
      if (p.region === "global" || p.region === region) {
        grouped[p.category].push(p);
      }
    }
  });

  const bar = document.getElementById("travelBar");
  bar.innerHTML = "";

  travelCategories.forEach(cat => {
    const group = document.createElement("div");
    group.className = "ttb-group";

    const btn = document.createElement("button");
    btn.className = "ttb-item";
    btn.textContent = `${cat} ▾`;

    const dropdown = document.createElement("div");
    dropdown.className = "ttb-dropdown";

    grouped[cat].forEach(partner => {
      const link = document.createElement("a");
      link.href = partner.url;
      link.textContent = partner.name;
      dropdown.appendChild(link);
    });

    group.appendChild(btn);
    group.appendChild(dropdown);
    bar.appendChild(group);
  });
}

(async () => {
  const lang = await detectUserLanguage();
  const region = await detectUserRegion();

  await loadLanguage(lang);
  await loadTravelDirectory(region);
})();
