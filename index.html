    }

    html, body {

      background: #0d1117;
      color: #ffffff;
    }

    body {
      overflow: hidden;
    }

    .app {
      display: grid;

      height: 100vh;
      min-height: 0;
      gap: 0;
      padding: 0;
    }

    .column {
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .column-1 {

      background: #0f141b;
      border-right: 1px solid rgba(255,255,255,0.06);
    }

    .column-1-header {
      padding: 14px 16px;
      font-size: 16px;
      font-weight: 700;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      position: sticky;
      top: 0;
      background: #0f141b;
      z-index: 5;
      text-align: center;
    }

    .column-1-search-wrap {
      padding: 8px 12px 0 12px;
      display: flex;
      justify-content: center;
    }

    .column-1-search {
      padding: 8px 12px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      background: #0d1117;
      color: #ffffff;
      font-size: 13px;
      width: 100%;
      max-width: 232px;
      outline: none;
    }

    .column-1-search::placeholder {
      color: rgba(255,255,255,0.45);
    }

    .column-1-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      scrollbar-width: none;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .category {
      margin-bottom: 10px;
      width: 100%;
      max-width: 244px;
    }

    .category details {
      border-radius: 10px;
      overflow: hidden;
      background: rgba(255,255,255,0.02);
    }

    .category summary {
      cursor: pointer;
      padding: 11px 12px;
      border-radius: 10px;
      user-select: none;
      font-weight: 700;
      list-style: none;
      color: #ffffff;
    }

    .category summary::-webkit-details-marker {
      display: none;
    }

    .category summary::before {
      content: "▶";
      display: inline-block;
      width: 14px;
      margin-right: 6px;
      font-size: 10px;
      transform: translateY(-1px);
      color: rgba(255,255,255,0.9);
    }

    .category details[open] summary::before {
      content: "▼";
    }

    .category ul {
      list-style: none;
      margin: 0;
      padding: 10px 10px 4px 10px;
    }

    .category li {
      margin: 7px 0;
    }

    .category a {
      color: rgba(255,255,255,0.92);
      text-decoration: none;
      font-size: 14px;
      line-height: 1.4;
    }

    .category a:hover {
      text-decoration: underline;
    }

    .column-1-empty {
      font-size: 14px;
      color: rgba(255,255,255,0.65);
      padding: 8px 4px;
    }

    .column-2 {
      background: #0d1117;
      min-width: 0;
    }

    #magnetoColumn.feed-wrapper {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      height: 100%;
      overflow-y: auto;
      padding: 24px 16px 40px;
      align-items: center;
      scrollbar-width: none;
    }

    .feed-container {
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-height: 0;
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }

    .feed-card {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      background: #161b22;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 14px;
      transition: box-shadow 0.15s ease;
    }

    .feed-card:hover {
      box-shadow: 0 8px 24px rgba(0,0,0,0.22);
    }

    .media-box {
      width: 100%;
      aspect-ratio: 9 / 16;
      min-height: 500px;
      max-height: 720px;
      border-radius: 14px;
      overflow: hidden;
      background: #0b0f14;
      display: block;
    }

    .media-box iframe,
    .media-box video,
    .media-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border: 0;
      display: block;
    }

    .fallback {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 14px;
      width: 100%;
      min-height: 220px;
      padding: 16px;
      border-radius: 14px;
      background: #0b0f14;
      justify-content: center;
    }

    .fallback img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 12px;
      flex-shrink: 0;
    }

    .feed-content h3 {
      margin: 0 0 8px 0;
      font-size: 18px;
      line-height: 1.3;
      word-break: break-word;
    }

    .feed-content p {
      margin: 0 0 10px 0;
      color: rgba(255,255,255,0.82);
      line-height: 1.5;
      font-size: 14px;
      word-break: break-word;
    }

    .feed-meta {
      font-size: 13px;
      color: rgba(255,255,255,0.6);
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .feed-platform {
      display: inline-block;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 999px;
      margin-right: 6px;
      text-transform: capitalize;
      background: rgba(255,255,255,0.08);
      color: #dddddd;
      vertical-align: middle;
    }

    .feed-platform.youtube {
      background: rgba(255, 0, 0, 0.15);
      color: #ff6b6b;
    }

    .feed-platform.reddit {
      background: rgba(255, 69, 0, 0.15);
      color: #ff4500;
    }

    .feed-platform.instagram {
      background: rgba(255, 0, 150, 0.15);
      color: #ff4fa3;
    }

    .feed-platform.facebook {
      background: rgba(24, 119, 242, 0.15);
      color: #66a3ff;
    }

    .feed-platform.tiktok {
      background: rgba(255,255,255,0.12);
      color: #ffffff;
    }

    .feed-link,

      display: inline-block;
      color: #58a6ff;
      text-decoration: none;
      font-size: 14px;
    }

    .feed-link:hover,
    .fallback a:hover {
      text-decoration: underline;
    }

    .feed-loader {
      text-align: center;
      padding: 18px 0;
      color: rgba(255,255,255,0.65);
      font-size: 14px;
      display: none;
    }

    .feed-message {
      text-align: center;
      padding: 18px 0;
      color: rgba(255,255,255,0.65);
      font-size: 14px;
    }

    #feedSentinel {
      height: 1px;
    }

    .column-3 {
      background: #0f141b;
      border-left: 1px solid rgba(255,255,255,0.06);
      overflow-y: auto;
      padding: 20px;
      min-width: 0;
      width: 100%;
      scrollbar-width: none;
    }

    *::-webkit-scrollbar {
      width: 0px;
      height: 0px;
    }

    .column-3 h2 {
      margin: 0 0 16px 0;
      font-size: 18px;
      font-weight: 700;
      text-align: center;
    }

    .brand-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 236px;
      margin: 0 auto;
    }

    .brand-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(145deg, #161b22, #0f141b);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      min-height: 92px;
      padding: 12px;
      text-decoration: none;
      overflow: hidden;
      transition: all 0.2s ease;
      position: relative;
    }

    .brand-tile::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top left, rgba(255,255,255,0.08), transparent 60%);
      pointer-events: none;
    }

    .brand-tile:hover {
      border-color: rgba(255,255,255,0.2);
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);

    .brand-tile:hover {
      border-color: rgba(255,255,255,0.14);
      transform: translateY(-1px);
    }

    .brand-tile img {
      width: 28px;
      height: 28px;
      object-fit: contain;
      display: block;
      flex-shrink: 0;
    }

    .brand-tile span {
      font-size: 12px;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      line-height: 1.2;
      display: block;
    }

    @media (max-width: 1200px) {
      .app {
        grid-template-columns: 260px minmax(0, 1fr) 260px;
      }

      }

    @media (max-width: 960px) {
      .app {
        grid-template-columns: 240px minmax(0, 1fr);
      }

      .column-3 {
        display: none;
      }
    }

    @media (max-width: 768px) {
      .app {
        grid-template-columns: 1fr;
      }

      .column-1 {
        display: none;
      }

      #magnetoColumn.feed-wrapper {

      }

      .feed-container {
        max-width: 100%;
        gap: 14px;
      }

      .feed-card {

        border-radius: 14px;
      }

      .media-box {
        min-height: 360px;
        max-height: 70vh;
        border-radius: 12px;
      }

      .fallback {
        min-height: 180px;
        padding: 14px;
      }

      .fallback img {
        height: 180px;
      }
    }
  </style>
</head>

    function buildDemoFeed(seedItems, repeats) {
      const output = [];
      for (let round = 0; round < repeats; round += 1) {
        seedItems.forEach(function(item, index) {
          const copy = Object.assign({}, item);
          const baseDate = new Date(item.publishedAt || Date.now());
          baseDate.setMinutes(baseDate.getMinutes() - (round * seedItems.length + index) * 7);
          copy.publishedAt = baseDate.toISOString();
          copy.title = item.title + ' #' + (round + 1);
          copy.url = (item.url || '#') + (item.url && item.url.includes('?') ? '&' : '?') + 'demo=' + (round + 1) + '-' + index;
          output.push(copy);
        });
      }
      return output;
    }

    function dedupeFeedItems(items) {
      const seen = new Set();
      return items.filter(function(item) {
        const platform = normalizePlatform(item.platform || '');
        const embed = item.embedUrl || '';
        const video = item.videoUrl || '';
        const thumb = item.thumbnail || '';
        const resolvedYouTube = platform === 'youtube'
          ? (embed || getYouTubeEmbedUrl(item.url || '') || '')
          : '';

        const key = [
          platform,
          resolvedYouTube,
          video,
          thumb
        ].join('|').toLowerCase();

        if (!key.replace(/\|/g, '')) return true;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    function interleaveByPlatform(items, limit) {
      const buckets = new Map();
      items.forEach(function(item) {
        const key = normalizePlatform(item.platform || 'unknown');
        if (!buckets.has(key)) buckets.set(key, []);
        buckets.get(key).push(item);
      });

      const order = Array.from(buckets.keys());
      const output = [];
      let added = true;

      while (added && output.length < limit) {
        added = false;
        order.forEach(function(key) {
          const bucket = buckets.get(key);
          if (bucket && bucket.length && output.length < limit) {
            output.push(bucket.shift());
            added = true;
          }
        });
      }

      return output;
    }

    function mixNonYoutubeFallback(liveItems, fallbackItems, limit) {
      const live = interleaveByPlatform(dedupeFeedItems(liveItems), limit);
      const fallbackPool = interleaveByPlatform(
        dedupeFeedItems(
          fallbackItems.filter(function(item) {
            return normalizePlatform(item.platform) !== 'youtube';
          })
        ),
        limit
      );

      const output = [];
      let liveIndex = 0;
      let fallbackIndex = 0;

      while (output.length < limit && (liveIndex < live.length || fallbackIndex < fallbackPool.length)) {
        if (liveIndex < live.length) {
          output.push(live[liveIndex++]);
        }
        if (output.length >= limit) break;
        if (fallbackIndex < fallbackPool.length) {
          output.push(fallbackPool[fallbackIndex++]);
        }
      }

      return dedupeFeedItems(output);
    }

    function getYouTubeVideoId(url) {
      try {
        const parsed = new URL(url, window.location.origin);
        const hostname = parsed.hostname.toLowerCase();

        if (hostname.includes('youtube.com')) {
          if (parsed.pathname === '/watch') return parsed.searchParams.get('v');
          if (parsed.pathname.startsWith('/shorts/')) return parsed.pathname.split('/shorts/')[1].split('/')[0];
          if (parsed.pathname.startsWith('/embed/')) return parsed.pathname.split('/embed/')[1].split('/')[0];
        }

        if (hostname.includes('youtu.be')) {
          const path = parsed.pathname.replace(/^\/+/, '');
          return path ? path.split('/')[0] : null;
        }
      } catch (err) {
        console.error('Invalid YouTube URL:', url, err);
      }

      return null;
    }

    function getYouTubeEmbedUrl(url) {
      const videoId = getYouTubeVideoId(url);
      return videoId ? 'https://www.youtube.com/embed/' + videoId : null;
    }

      });

      if (!response.ok) {

    function monetizeUrl(url, meta) {
      if (!isValidHttpUrl(url)) return '#';

      const host = window.location.hostname || '';

        protocol === 'file:' ||
        host === 'localhost' ||
        host === '127.0.0.1' ||
        host.endsWith('.oausercontent.com') ||
        host.includes('sandbox');

      if (isPreview) {

      const params = new URLSearchParams();
      params.set('url', url);

      if (meta && meta.partner) {
        params.set('partner', meta.partner);

      if (meta && meta.source) {

      return '/api/out?' + params.toString();

    async function loadPartners() {

            const base = byName.get(categoryName) || {

            const existing = new Map(base.partners.map(function(p) {

            }));

            (Array.isArray(category.partners) ? category.partners : []).forEach(function(partner) {
              const key = String(partner.name || '').toLowerCase();
              if (!key || !partner.url) return;
              existing.set(key, {
                name: partner.name,
                url: partner.url,
                logo: partner.logo || partnerLogoOverrides[partner.name] || existing.get(key)?.logo || ''
              });
            });

            base.color = category.color || base.color || '#8f9fb3';

            byName.set(categoryName, base);
          });

          return Array.from(byName.values()).filter(function(category) {
            return category.partners.length > 0;
          });
        }

        const flatPartners = Array.isArray(data) ? data : data.partners;
        if (Array.isArray(flatPartners) && flatPartners.length) {
          const byName = new Map();
          fallbackGrouped.forEach(function(category) {

            } else {
              base.partners.push(mergedPartner);
            }

            base.color = partner.color || base.color || '#8f9fb3';
            byName.set(category, base);
          });

          return Array.from(byName.values()).filter(function(category) {

    function hexToRgb(hex) {
      const clean = String(hex || '').replace('#', '');
      if (clean.length !== 6) return '143,159,179';
      const bigint = parseInt(clean, 16);
      const r = (bigint >> 16) & 255;
      const g = (bigint >> 8) & 255;
      const b = bigint & 255;
      return r + ',' + g + ',' + b;
    }

    async function loadHybridFeed() {
      const settled = await Promise.allSettled(sourceConfigs.map(function(source) {
        return fetchJson(source.url);
      }));

      let merged = [];
      const debugParts = [];

      settled.forEach(function(result, index) {
        const source = sourceConfigs[index];

        if (result.status === 'fulfilled') {
          const items = normalizeFeedData(result.value).map(function(item) {
            const normalized = normalizeFeedItem(item);
            if (!normalized.platform || normalized.platform === 'unknown') {
              normalized.platform = source.key;
            }
            if ((!normalized.videoUrl || !isValidHttpUrl(normalized.videoUrl)) && source.key === 'youtube') {
              normalized.embedUrl = normalized.embedUrl || getYouTubeEmbedUrl(normalized.url || '');
            }
            return normalized;
          });
          merged.push.apply(merged, items);
          debugParts.push(source.key + ': ' + items.length);
        } else {
          debugParts.push(source.key + ': failed');
        }
      });

      const uniqueLive = interleaveByPlatform(dedupeFeedItems(merged), 60);
      const livePlatforms = Array.from(new Set(uniqueLive.map(function(item) {
        return normalizePlatform(item.platform || 'unknown');
      }).filter(Boolean)));
      const onlyYoutubeLive = livePlatforms.length === 1 && livePlatforms[0] === 'youtube';

      if (uniqueLive.length >= 12 && !onlyYoutubeLive) {
        setDebug('Sources → ' + debugParts.join(' | ') + ' | unique live: ' + uniqueLive.length);
        return uniqueLive;
      }

      const fallbackNormalized = demoFeedItems.map(normalizeFeedItem);

      if (onlyYoutubeLive && uniqueLive.length) {
        const mixedYoutube = mixNonYoutubeFallback(uniqueLive, fallbackNormalized, 60);
        setDebug('Sources → ' + debugParts.join(' | ') + ' | mixed non-youtube fallback: ' + mixedYoutube.length);
        return mixedYoutube;
      }

      const fallbackUnique = interleaveByPlatform(dedupeFeedItems(fallbackNormalized), 60);
      const mixedFallback = interleaveByPlatform(dedupeFeedItems(uniqueLive.concat(fallbackUnique)), 60);
      setDebug('Sources → ' + debugParts.join(' | ') + ' | unique mixed: ' + mixedFallback.length);
      return mixedFallback;
    }

    function renderFeedBatch() {
      const nextItems = visibleFeedItems.slice(currentIndex, currentIndex + pageSize);

      nextItems.forEach(function(item) {

      observePlayback();
      currentIndex += nextItems.length;

      if (currentIndex >= visibleFeedItems.length) {
        if (observer) observer.disconnect();
        feedLoader.style.display = 'none';
      }
    }

    function applyFeed() {
      visibleFeedItems = allFeedItems.slice();
      currentIndex = 0;
      feedContainer.innerHTML = '';

      if (observer) observer.disconnect();

      if (!visibleFeedItems.length) {
        showFeedMessage('No feed items found.');
        return;
      }

      renderFeedBatch();

      if (observer && currentIndex < visibleFeedItems.length) {
        observer.observe(feedSentinel);
      }
    }

    async function loadMoreFeedItems() {
      if (isLoading) return;
      if (currentIndex >= visibleFeedItems.length) return;

      isLoading = true;
      feedLoader.style.display = 'block';

      try {
        renderFeedBatch();
      } finally {
        feedLoader.style.display = 'none';
        isLoading = false;
      }
    }

    async function initFeed() {
      try {
        allFeedItems = await loadHybridFeed();
        allFeedItems.sort(function(a, b) {
          return new Date(b.publishedAt || 0) - new Date(a.publishedAt || 0);
        });

        if (!allFeedItems.length) {
          setDebug('Feed loaded but returned zero items');
          showFeedMessage('Could not load feed data.');
          return;
        }

        setDebug('Feed loaded: ' + allFeedItems.length + ' items');
        applyFeed();
      } catch (err) {
        console.error('Feed failed:', err);
        setDebug('Feed failed: ' + err.message);
        showFeedMessage('Could not load feed data.');
      }
    }

    observer = new IntersectionObserver(function(entries) {
      if (entries[0] && entries[0].isIntersecting) {
        loadMoreFeedItems();
      }
    }, {
      root: magnetoColumn,
      threshold: 0.1
    });

    playbackObserver = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        const video = entry.target;
        if (!(video instanceof HTMLVideoElement)) return;

        if (entry.isIntersecting && entry.intersectionRatio >= 0.6) {
          feedContainer.querySelectorAll('video').forEach(function(other) {
            if (other !== video) other.pause();
          });
          const playPromise = video.play();
          if (playPromise && typeof playPromise.catch === 'function') {
            playPromise.catch(function() {});
          }
        } else {
          video.pause();
        }
      });
    }, {
      root: magnetoColumn,
      threshold: [0.6]
    });

    loadPartners().then(function(data) {
      renderBrandGrid(data);
      renderPartners(data);

      const search = document.getElementById('partnerSearch');
      if (search) {
        search.addEventListener('input', function() {
          const q = search.value.toLowerCase();
          const filtered = data.map(function(cat) {
            return {
              name: cat.name,
              color: cat.color,
              partners: cat.partners.filter(function(p) {
                return p.name.toLowerCase().includes(q);
              })
            };
          }).filter(function(cat) {
            return cat.partners.length > 0;
          });
          renderPartners(filtered);
        });
      }
    });

    observer.observe(feedSentinel);
    initFeed();
  </script>
</body>
</html>
