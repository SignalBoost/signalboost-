<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>3-Column HMI Layout</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #05070a;
      color: #fff;
      height: 100vh;
      overflow: hidden;
    }
    .layout {
      display: grid;
      grid-template-columns: 280px 1fr 320px;
      height: 100vh;
    }

    /* COLUMN 1 – PARTNER DIRECTORY */
    .column-1 {
      border-right: 1px solid #222;
      background: #0b0d11;
      display: flex;
      flex-direction: column;
    }
    .column-1-header {
      padding: 12px 16px;
      font-weight: 700;
      border-bottom: 1px solid #222;
    }
    .column-1-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0 16px;
    }
    .category {
      border-bottom: 1px solid #15171d;
    }
    .category-header {
      padding: 8px 16px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #10131a;
    }
    .category-header:hover {
      background: #171b24;
    }
    .category-title {
      font-size: 14px;
      font-weight: 600;
    }
    .category-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.25s ease;
      background: #0d1017;
    }
    .category-body.open {
      max-height: 400px; /* enough to show items; scroll is on column */
    }
    .partner-item {
      padding: 6px 20px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .partner-item:hover {
      background: #181c26;
    }
    .partner-sub {
      font-size: 11px;
      opacity: 0.7;
    }

    /* COLUMN 2 – HYBRID FEED */
    .column-2 {
      display: flex;
      justify-content: center;
      align-items: stretch;
      background: radial-gradient(circle at top, #151a24, #05070a);
    }
    .feed-container {
      width: 100%;
      max-width: 720px;
      padding: 16px 0;
      overflow-y: auto;
      scrollbar-width: thin;
    }
    .feed-container::-webkit-scrollbar {
      width: 8px;
    }
    .feed-container::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 4px;
    }
    .video-card {
      background: #10131a;
      border-radius: 16px;
      padding: 16px;
      margin: 0 16px 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .video-meta {
      font-size: 11px;
      opacity: 0.7;
      margin-bottom: 6px;
    }
    .video-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .video-frame {
      width: 100%;
      height: 360px;
      border-radius: 12px;
      background: #000;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
      font-size: 13px;
    }
    .video-footer {
      font-size: 12px;
      opacity: 0.8;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* COLUMN 3 – FRUIT LOOPS BOWL */
    .column-3 {
      border-left: 1px solid #222;
      background: #05070a;
      display: flex;
      flex-direction: column;
      padding: 10px;
    }
    .column-3-header {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .fruit-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    #shuffleButton, #muteButton {
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #ff6f61, #ffcc00, #00c4ff);
      color: #000;
    }
    #shuffleButton:hover, #muteButton:hover {
      filter: brightness(1.1);
    }
    #volumeSlider {
      flex: 1;
      accent-color: #ff6f61;
    }
    .fruit-bowl {
      position: relative;
      flex: 1;
      margin-top: 6px;
      border-radius: 24px;
      padding: 10px;
      background: radial-gradient(circle at center, #1f2433, #05070a);
      overflow-y: auto;
    }
    .fruit-bowl::-webkit-scrollbar {
      width: 6px;
    }
    .fruit-bowl::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 3px;
    }
    .loop-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
    }
    .loop {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      background: conic-gradient(from 0deg, #ff6f61, #ffcc00, #00c4ff, #ff6f61);
      box-shadow: 0 0 0 2px #05070a;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      text-align: center;
      padding: 4px;
    }
    .loop:hover {
      transform: scale(1.15);
      box-shadow: 0 0 0 2px #fff;
    }
    .loop img {
      max-width: 70%;
      max-height: 70%;
      border-radius: 50%;
    }
    .shake {
      animation: bowlShake 0.4s ease;
    }
    @keyframes bowlShake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      50% { transform: translateX(4px); }
      75% { transform: translateX(-2px); }
    }
  </style>
</head>
<body>
  <div class="layout">
    <!-- COLUMN 1 -->
    <div class="column-1">
      <div class="column-1-header">Partners</div>
      <div class="column-1-scroll" id="column1Scroll">
        <!-- Categories injected by JS -->
      </div>
    </div>

    <!-- COLUMN 2 -->
    <div class="column-2">
      <div class="feed-container" id="feedContainer">
        <!-- Cards injected by JS -->
      </div>
    </div>

    <!-- COLUMN 3 -->
    <div class="column-3">
      <div class="column-3-header">Fruit Loops Bowl</div>
      <div class="fruit-controls">
        <button id="shuffleButton">🍭 Mix</button>
        <button id="muteButton">🔇 Mute</button>
        <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.5">
        <audio id="shuffleSound" src="" preload="auto"></audio> <!-- add your sound file -->
      </div>
      <div class="fruit-bowl" id="fruitBowl">
        <div class="loop-container" id="loopContainer"></div>
      </div>
    </div>
  </div>

  <script>
    /* ---------------- COLUMN 1 – PARTNERS IN CATEGORIES ---------------- */

    const partnerCategories = [
      {
        name: "Flights",
        partners: [
          { name: "Kiwi.com", sub: "Meta search", url: "https://www.kiwi.com" },
          { name: "Aviasales", sub: "Meta search", url: "https://www.aviasales.com" },
          { name: "Skyscanner", sub: "Meta search", url: "https://www.skyscanner.net" }
        ]
      },
      {
        name: "Hotels",
        partners: [
          { name: "Booking.com", sub: "Hotels", url: "https://www.booking.com" },
          { name: "Airbnb", sub: "Homes", url: "https://www.airbnb.com" },
          { name: "Expedia", sub: "Hotels & more", url: "https://www.expedia.com" }
        ]
      },
      {
        name: "Activities",
        partners: [
          { name: "GetYourGuide", sub: "Tours & activities", url: "https://www.getyourguide.com" },
          { name: "Viator", sub: "Tours & activities", url: "https://www.viator.com" }
        ]
      }
      // add more categories/partners as needed
    ];

    const column1Scroll = document.getElementById("column1Scroll");

    function renderColumn1() {
      column1Scroll.innerHTML = "";
      partnerCategories.forEach((cat, idx) => {
        const catDiv = document.createElement("div");
        catDiv.className = "category";

        const header = document.createElement("div");
        header.className = "category-header";
        header.innerHTML = `
          <span class="category-title">${cat.name}</span>
          <span>▾</span>
        `;

        const body = document.createElement("div");
        body.className = "category-body";
        if (idx === 0) body.classList.add("open");

        cat.partners.forEach(p => {
          const item = document.createElement("div");
          item.className = "partner-item";
          item.innerHTML = `
            <span>${p.name}</span>
            <span class="partner-sub">${p.sub || ""}</span>
          `;
          item.addEventListener("click", () => {
            window.open(p.url, "_blank");
          });
          body.appendChild(item);
        });

        header.addEventListener("click", () => {
          // close others
          document.querySelectorAll(".category-body").forEach(b => {
            if (b !== body) b.classList.remove("open");
          });
          body.classList.toggle("open");
        });

        catDiv.appendChild(header);
        catDiv.appendChild(body);
        column1Scroll.appendChild(catDiv);
      });
    }

    /* ---------------- COLUMN 2 – HYBRID INFINITE FEED ---------------- */

    const feedContainer = document.getElementById("feedContainer");
    let feedPage = 0;
    let isLoading = false;

    const mockSources = ["YouTube", "Reddit", "Instagram", "TikTok", "X/Twitter"];

    function mockFetchHybridFeed(page) {
      // simulate 5 items per page
      const items = [];
      for (let i = 0; i < 5; i++) {
        const source = mockSources[Math.floor(Math.random() * mockSources.length)];
        items.push({
          id: `item_${page}_${i}`,
          title: `Sample ${source} video #${page * 5 + i + 1}`,
          source,
          publishedAt: new Date().toISOString(),
          description: "Hybrid feed demo card. Replace with real API data.",
        });
      }
      return new Promise(resolve => {
        setTimeout(() => resolve(items), 400);
      });
    }

    async function loadMoreFeed() {
      if (isLoading) return;
      isLoading = true;
      const items = await mockFetchHybridFeed(feedPage);
      items.forEach(item => {
        const card = document.createElement("div");
        card.className = "video-card";
        card.innerHTML = `
          <div class="video-meta">${item.source} • ${new Date(item.publishedAt).toLocaleString()}</div>
          <div class="video-title">${item.title}</div>
          <div class="video-frame">[ ${item.source} embed placeholder ]</div>
          <div class="video-footer">
            <span>${item.description}</span>
            <span>ID: ${item.id}</span>
          </div>
        `;
        feedContainer.appendChild(card);
      });
      feedPage++;
      isLoading = false;
    }

    feedContainer.addEventListener("scroll", () => {
      const nearBottom =
        feedContainer.scrollTop + feedContainer.clientHeight >= feedContainer.scrollHeight - 80;
      if (nearBottom) {
        loadMoreFeed();
      }
    });

    /* ---------------- COLUMN 3 – FRUIT LOOPS BOWL ---------------- */

    const fruitPartners = [
      // BUSINESS PARTNERS FIRST
      { name: "Kiwi.com", url: "https://www.kiwi.com", logo: "", type: "partner" },
      { name: "Aviasales", url: "https://www.aviasales.com", logo: "", type: "partner" },
      { name: "Booking.com", url: "https://www.booking.com", logo: "", type: "partner" },
      { name: "Airbnb", url: "https://www.airbnb.com", logo: "", type: "partner" },
      { name: "Expedia", url: "https://www.expedia.com", logo: "", type: "partner" },
      // PLATFORMS AFTER
      { name: "Instagram", url: "https://www.instagram.com", logo: "", type: "platform" },
      { name: "Discord", url: "https://discord.com", logo: "", type: "platform" },
      { name: "TikTok", url: "https://www.tiktok.com", logo: "", type: "platform" },
      { name: "LinkedIn", url: "https://www.linkedin.com", logo: "", type: "platform" },
      { name: "Facebook", url: "https://www.facebook.com", logo: "", type: "platform" },
      { name: "Threads", url: "https://www.threads.net", logo: "", type: "platform" },
      { name: "Telegram", url: "https://telegram.org", logo: "", type: "platform" },
      { name: "WeChat", url: "https://www.wechat.com", logo: "", type: "platform" },
      { name: "Pinterest", url: "https://www.pinterest.com", logo: "", type: "platform" },
      { name: "WhatsApp", url: "https://www.whatsapp.com", logo: "", type: "platform" },
      { name: "Reddit", url: "https://www.reddit.com", logo: "", type: "platform" },
      { name: "Amazon", url: "https://www.amazon.com", logo: "", type: "platform" },
      { name: "X/Twitter", url: "https://twitter.com", logo: "", type: "platform" },
      { name: "YouTube", url: "https://www.youtube.com", logo: "", type: "platform" }
    ];

    const loopContainer = document.getElementById("loopContainer");
    const fruitBowl = document.getElementById("fruitBowl");
    const shuffleButton = document.getElementById("shuffleButton");
    const muteButton = document.getElementById("muteButton");
    const volumeSlider = document.getElementById("volumeSlider");
    const shuffleSound = document.getElementById("shuffleSound");

    shuffleSound.volume = volumeSlider.value;

    volumeSlider.addEventListener("input", () => {
      shuffleSound.volume = volumeSlider.value;
    });

    muteButton.addEventListener("click", () => {
      shuffleSound.muted = !shuffleSound.muted;
      muteButton.textContent = shuffleSound.muted ? "🔊 Unmute" : "🔇 Mute";
    });

    function shuffleArray(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function renderFruitBowl(items) {
      loopContainer.innerHTML = "";
      // partners first, platforms second
      const partners = items.filter(i => i.type === "partner");
      const platforms = items.filter(i => i.type === "platform");
      const ordered = [...shuffleArray(partners), ...shuffleArray(platforms)];

      ordered.forEach(item => {
        const loop = document.createElement("div");
        loop.className = "loop";
        loop.textContent = item.name;
        loop.addEventListener("click", () => {
          window.open(item.url, "_blank");
        });
        loopContainer.appendChild(loop);
      });

      fruitBowl.classList.add("shake");
      setTimeout(() => fruitBowl.classList.remove("shake"), 400);

      if (!shuffleSound.muted && shuffleSound.src) {
        shuffleSound.currentTime = 0;
        shuffleSound.play().catch(() => {});
      }
    }

    shuffleButton.addEventListener("click", () => {
      renderFruitBowl(fruitPartners);
    });

    /* ---------------- INIT ---------------- */

    renderColumn1();
    loadMoreFeed();      // initial feed
    renderFruitBowl(fruitPartners); // initial bowl
  </script>
</body>
</html>
