






<!DOCTYPE html>
<html lang="en" data-i18n-ready="0">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SignalBoost</title>
  <meta name="description" content="Find travel, marketplace and service offers by region." />
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#0d1117;color:#fff}
    body{overflow:hidden}
    a{color:inherit}

    .top{
      height:40px;
      background:#232f3e;
      display:grid;
      grid-template-columns:240px 1fr 0;
      align-items:center;
      border-bottom:1px solid rgba(255,255,255,.1);
      position:fixed;
      inset:0 0 auto 0;
      z-index:1000;
    }
    .logo{color:#f5c542;font-weight:900;padding-left:2px;font-size:16px;white-space:nowrap}

    .navbar{
      display:flex;
      justify-content:center;
      align-items:center;
      background:#111;
      height:100%;
      width:100%;
      overflow:visible;
    }
    .nav-list{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:20px;
      list-style:none;
      margin:0;
      padding:0;
      height:100%;
    }
    .dropdown{position:relative;display:flex;align-items:center;height:100%}
    .dropbtn{
      height:100%;
      background:none;
      border:none;
      border-bottom:2px solid transparent;
      color:#fff;
      cursor:pointer;
      padding:0 10px;
      font-size:14px;
      font-weight:900;
      white-space:nowrap;
    }
    .dropbtn::after{content:'⌄';font-size:11px;margin-left:5px;color:#fff}
    .dropbtn:hover,.dropdown:hover .dropbtn{color:#f5c542;border-bottom-color:#f5c542}
    .dropdown-content{
      display:none;
      position:absolute;
      top:100%;
      left:50%;
      transform:translateX(-50%);
      background:#222;
      min-width:190px;
      max-height:420px;
      overflow:auto;
      z-index:1001;
      border:1px solid rgba(255,255,255,.12);
      border-radius:0 0 10px 10px;
      box-shadow:0 14px 28px rgba(0,0,0,.45);
      list-style:none;
      margin:0;
      padding:6px 0;
    }
    .dropdown:hover .dropdown-content{display:block}
    .dropdown-content li{list-style:none;margin:0;padding:0}
    .dropdown-content a,.dropdown-empty{
      display:block;
      color:#fff;
      padding:9px 14px;
      text-decoration:none;
      font-size:13px;
      font-weight:800;
      white-space:nowrap;
    }
    .dropdown-content a:hover{background:#232f3e;color:#f5c542}
    .dropdown-empty{color:#9aa8b8}

    .lang-switcher{display:none;justify-content:flex-end;padding-right:8px}
    #lang-select{background:#0f1724;color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:6px;padding:6px 10px;font-weight:700}

    .app{display:grid;grid-template-columns:260px minmax(720px,1fr)320px;height:100vh;padding-top:40px}
    .col{min-height:0;overflow:hidden}
    .left,.right{background:#0f141b}
    .left{border-right:1px solid rgba(255,255,255,.08)}
    .right{border-left:1px solid rgba(255,255,255,.08);padding:20px;overflow-y:auto}

    .controls{padding:10px 8px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
    .small-title{font-size:13px;color:#c9d7e8;text-transform:uppercase;font-weight:900;letter-spacing:.05em;margin-bottom:8px}
    #partnerSearch{width:100%;height:32px;background:#0d1117;color:#fff;border:1px solid rgba(255,255,255,.13);border-radius:10px;padding:8px 10px}

    #column1{
      height:calc(100vh - 96px);
      overflow-y:auto;
      overflow-x:hidden;
      padding:12px 10px 28px;
      display:block;
      white-space:normal;
      scrollbar-width:thin;
    }
    #column1::-webkit-scrollbar{width:8px}
    #column1::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:999px}
    .left{overflow:hidden}
    .column-category{
      position:relative;
      margin:0 0 10px;
      border:1px solid rgba(255,255,255,.08);
      border-radius:14px;
      overflow:hidden;
      background:#111822;
    }
    .column-category button{
      background:#111822;
      color:#fff;
      border:none;
      padding:13px 12px;
      cursor:pointer;
      width:100%;
      text-align:left;
      font-size:14px;
      font-weight:900;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
      white-space:normal;
    }
    .column-category button:hover{color:#f5c542}
    .column-category .cat-left{display:flex;align-items:center;gap:8px;min-width:0}
    .column-category .cat-name{overflow:hidden;text-overflow:ellipsis}
    .column-category .cat-count{color:#f5c542;margin-left:6px}
    .column-category .column-arrow{color:#f5c542;font-size:16px;line-height:1}
    .column-category ul{
      display:none;
      position:static;
      min-width:0;
      max-height:300px;
      overflow:auto;
      margin:0;
      padding:6px;
      list-style:none;
      background:#0d1117;
      border-top:1px solid rgba(255,255,255,.08);
      border-radius:0;
      z-index:auto;
      box-shadow:none;
    }
    .column-category[data-open="1"] ul{display:block}
    .column-category ul li{list-style:none;margin:0;padding:0}
    .column-category a,.column-category .dropdown-empty{
      display:block;
      color:#fff;
      padding:10px 10px;
      text-decoration:none;
      font-size:13px;
      font-weight:800;
      white-space:normal;
      border-radius:10px;
    }
    .column-category a:hover{background:#232f3e;color:#f5c542}
    .column-category .dropdown-empty{color:#9aa8b8}

    .main{
      position:relative;
      background:#0d1117;
      display:flex;
      align-items:flex-start;
      justify-content:center;
      padding:18px 18px 96px;
      overflow-y:auto;
      scroll-snap-type:y proximity;
      -webkit-overflow-scrolling:touch;
    }
    .feed-container{width:100%;max-width:520px;display:flex;flex-direction:column;gap:22px}
    .feed-card{
      position:relative;
      display:block;
      text-decoration:none;
      border:1px solid rgba(245,197,66,.22);
      border-radius:22px;
      background:#111822;
      padding:10px;
      min-height:calc(100vh - 168px);
      transition:transform .18s ease,border-color .18s ease;
      cursor:pointer;
      scroll-snap-align:start;
      box-shadow:0 16px 42px rgba(0,0,0,.28);
    }
    .feed-card:hover{transform:translateY(-2px);border-color:rgba(245,197,66,.42)}
    .media{position:relative;aspect-ratio:9/16;height:min(76vh,760px);border-radius:18px;overflow:hidden;background:#0b0f14}
    .media img,.media video,.feed-video,.platform-frame{width:100%;height:100%;object-fit:cover;display:block;border:0}
    .media img{filter:brightness(.60)}
    .media.has-video img{filter:none}
    .media.has-embed{background:#000}
    .platform-frame{background:#000}
    .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
    .play span{width:74px;height:74px;border-radius:50%;background:#fff;color:#06101b;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900}

    .feed-content{
      position:absolute;
      left:20px;
      right:20px;
      bottom:22px;
      padding:16px 14px;
      border-radius:18px;
      background:linear-gradient(180deg,rgba(8,12,18,0),rgba(8,12,18,.78) 20%,rgba(8,12,18,.92));
      text-shadow:0 2px 14px rgba(0,0,0,.75);
      pointer-events:none;
    }
    .feed-label{display:inline-block;margin-bottom:8px;padding:5px 9px;border:1px solid rgba(245,197,66,.22);border-radius:999px;background:rgba(245,197,66,.16);color:#f5c542;font-size:11px;font-weight:900;text-transform:uppercase}
    .feed-source{float:right;color:rgba(255,255,255,.82);font-size:11px;font-weight:900;text-transform:uppercase;margin-top:6px}
    .feed-content h3{clear:both;margin:0 0 8px;font-size:22px;line-height:1.15}
    .feed-content p{margin:0;color:rgba(255,255,255,.86);font-size:14px;line-height:1.4}
    .feed-loader{width:100%;padding:18px;text-align:center;color:#9aa8b8;font-size:12px}
    .feed-empty{width:100%;padding:30px;text-align:center;color:#9aa8b8;border:1px solid rgba(255,255,255,.08);border-radius:14px;background:#111822}

    #stickyBar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(720px,calc(100% - 24px));background:rgba(15,20,27,.96);border:1px solid rgba(245,197,66,.25);border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;gap:12px;z-index:999}
    .sticky-link{color:#f5c542;text-decoration:none;font-weight:900}
    .right h2{text-align:center;margin:0 0 16px}
    #partnerChips{display:block}
    .chip-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.chip{min-height:72px;display:flex;align-items:center;justify-content:center;text-align:center;border:1px solid rgba(255,255,255,.08);background:#1b2128;border-radius:10px;padding:10px;font-weight:800;font-size:13px;text-decoration:none}
    .see-more-btn{width:100%;margin:8px 0 12px;padding:10px 12px;border:1px solid rgba(245,197,66,.35);border-radius:10px;background:#111;color:#f5c542;font-weight:900;cursor:pointer}
    .see-more-btn:hover{background:#192532}
    .featured{display:block;text-decoration:none;border:1px solid rgba(245,197,66,.25);border-radius:16px;background:#111822;overflow:hidden;margin-bottom:16px;box-shadow:0 14px 28px rgba(0,0,0,.22)}
    .featured img{width:100%;height:138px;object-fit:cover;display:block;background:#0b0f14}
    .featured-body{padding:12px}
    .featured h4{margin:0 0 8px;color:#f5c542;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.04em}
    .featured p{margin:0 0 8px;font-weight:900;font-size:16px}
    .featured span{display:block;color:rgba(255,255,255,.78);font-size:13px;line-height:1.35}
    .chips-title{margin:6px 0 12px;color:#c9d7e8;text-transform:uppercase;font-weight:900;letter-spacing:.05em;font-size:12px}
    .empty{color:#9aa8b8;padding:16px;font-size:13px}

    #debug-overlay{position:fixed;right:10px;bottom:10px;background:rgba(0,0,0,.84);color:#fff;padding:10px 14px;border-radius:8px;font:13px monospace;z-index:9999;box-shadow:0 4px 14px rgba(0,0,0,.35);display:none}
    html[data-i18n-ready="0"] body{opacity:0}
    html[data-i18n-ready="1"] body{opacity:1;transition:opacity .12s}


    /* Column 2 stable conversion layout: regional hero + portrait reels feed */
    .main{
      align-items:flex-start;
      justify-content:center;
      padding:14px 14px 96px;
    }
    .main-layout{
      width:100%;
      max-width:900px;
      margin:0 auto;
      display:grid;
      gap:14px;
    }
    .trend-strip{
      width:100%;
      padding:10px 12px;
      border:1px solid rgba(245,197,66,.18);
      border-radius:999px;
      background:rgba(17,24,34,.92);
      display:flex;
      align-items:center;
      gap:10px;
      overflow-x:auto;
      scrollbar-width:none;
    }
    .trend-strip::-webkit-scrollbar{display:none}
    .trend-kicker{color:#f5c542;font-size:12px;font-weight:900;white-space:nowrap;text-transform:uppercase}
    .trend-items{display:flex;align-items:center;gap:8px;min-width:0}
    .trend-pill{display:inline-flex;align-items:center;white-space:nowrap;text-decoration:none;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);border-radius:999px;padding:7px 10px;font-size:12px;font-weight:900;color:#fff;transition:.18s ease}
    .trend-pill:hover{background:rgba(245,197,66,.15);border-color:rgba(245,197,66,.35);transform:translateY(-1px)}
    .hero-feed-row{
      width:100%;
      display:grid;
      grid-template-columns:minmax(260px,320px) minmax(320px,360px);
      justify-content:center;
      align-items:start;
      gap:16px;
    }
    .region-hero{
      min-height:470px;
      border:1px solid rgba(245,197,66,.24);
      border-radius:26px;
      background:radial-gradient(circle at 18% 14%,rgba(245,197,66,.24),transparent 34%),linear-gradient(135deg,#152032,#0c1118);
      box-shadow:0 20px 46px rgba(0,0,0,.30);
      padding:24px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      overflow:hidden;
      position:sticky;
      top:58px;
    }
    .region-hero::after{content:"";position:absolute;right:-120px;bottom:-120px;width:320px;height:320px;border-radius:50%;background:rgba(245,197,66,.13);filter:blur(5px)}
    .hero-copy,.hero-partners{position:relative;z-index:1}
    .region-badge{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border-radius:999px;background:rgba(245,197,66,.16);border:1px solid rgba(245,197,66,.25);color:#f5c542;font-size:12px;font-weight:900;text-transform:uppercase;margin-bottom:14px}
    .region-hero h1{margin:0 0 12px;font-size:34px;line-height:1.04;letter-spacing:-.04em}
    .region-hero p{margin:0;color:rgba(255,255,255,.82);font-size:15px;line-height:1.45}
    .hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
    .primary-cta,.secondary-cta{display:inline-flex;align-items:center;justify-content:center;border-radius:14px;padding:11px 15px;text-decoration:none;font-weight:900;font-size:13px;transition:.18s ease}
    .primary-cta{background:#f5c542;color:#10151d;box-shadow:0 12px 28px rgba(245,197,66,.18)}
    .secondary-cta{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff}
    .primary-cta:hover,.secondary-cta:hover{transform:translateY(-2px)}
    .hero-partners{display:grid;gap:10px;margin-top:18px}
    .hero-mini-card{display:block;text-decoration:none;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:12px;transition:.18s ease;color:#fff}
    .hero-mini-card:hover{transform:translateX(3px);border-color:rgba(245,197,66,.36);background:rgba(245,197,66,.10)}
    .hero-mini-card strong{display:block;font-size:14px;margin-bottom:4px}.hero-mini-card span{display:block;color:rgba(255,255,255,.72);font-size:12px;line-height:1.3}
    .feed-container{max-width:360px;gap:22px}
    .feed-card{min-height:auto;padding:10px;border-radius:24px}
    .media{height:min(76vh,660px);aspect-ratio:9/16;border-radius:18px}
    .feed-content{left:20px;right:20px;bottom:22px}
    body.region-br .region-hero{background:radial-gradient(circle at 18% 14%,rgba(255,204,0,.25),transparent 34%),linear-gradient(135deg,#16351d,#0c1118)}
    body.region-pl .region-hero{background:radial-gradient(circle at 18% 14%,rgba(245,197,66,.20),transparent 34%),linear-gradient(135deg,#202737,#0c1118)}
    body.region-uk .region-hero,body.region-us .region-hero{background:radial-gradient(circle at 18% 14%,rgba(245,197,66,.18),transparent 34%),linear-gradient(135deg,#17243a,#0c1118)}


    /* Desktop layout must preserve: hero left + portrait feed right. */
    @media(min-width:901px){
      .app{grid-template-columns:260px minmax(720px,1fr)320px}
      .main{padding:14px 14px 96px}
      .main-layout{max-width:900px}
      .hero-feed-row{grid-template-columns:minmax(260px,320px) minmax(320px,360px)}
      .feed-container{max-width:360px}
      .feed-card{min-height:auto}
      .media{aspect-ratio:9/16;height:min(76vh,660px)}
    }

    @media(max-width:900px){
      body{overflow:auto}
      .top{grid-template-columns:140px 1fr;height:40px;min-height:40px}
      .navbar{justify-content:flex-start;overflow-x:auto}
      .nav-list{justify-content:flex-start;gap:12px;padding-left:8px}
      .dropdown-content{left:0;transform:none}
      .app{display:block;height:auto;padding-top:40px}
      .left,.right{border:0}
      #column1{height:auto;max-height:none;overflow-x:auto;overflow-y:visible}
      .main{min-height:500px;padding:14px 10px 96px}
      .right{padding-bottom:40px}
      .main-layout{max-width:100%}
      .trend-strip{border-radius:16px;align-items:flex-start;flex-direction:column}
      .hero-feed-row{display:block}
      .region-hero{position:relative;top:auto;min-height:auto;margin-bottom:16px;border-radius:20px}
      .region-hero h1{font-size:28px}
      .feed-container{max-width:100%}
      .feed-card{min-height:calc(100vh - 128px)}
      .media{height:calc(100vh - 150px);min-height:0;max-height:none;aspect-ratio:9/16}
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="logo" data-i18n="brand_name">SignalBoost</div>
    <nav class="navbar" id="travelDirectory"></nav>
    <div class="lang-switcher" id="languageSwitcher">
      <select id="lang-select" onchange="setLanguage(this.value)"></select>
    </div>
  </header>

  <div class="app">
    <aside class="col left">
      <div class="controls">
        <div class="small-title" data-i18n="explore_offers">Explore offers</div>
        <input id="partnerSearch" data-i18n-placeholder="search_placeholder" placeholder="Flights, hotels, eSIM, tours..." />
      </div>
      <div id="column1"></div>
    </aside>

    <main class="col main" id="magnetoColumn">
      <div class="main-layout">
        <section id="trendingStrip" class="trend-strip" aria-label="Trending offers"></section>
        <div class="hero-feed-row">
          <section id="regionHero" class="region-hero" aria-label="Regional featured offers"></section>
          <div id="feedContainer" class="feed-container"></div>
        </div>
      </div>
    </main>

    <aside class="col right">
      <h2 data-i18n="partners">Partners</h2>
      <div id="partnerChips"></div>
    </aside>
  </div>

  <div id="stickyBar">
    <div id="stickyCopy" data-i18n="featured_service">Explore a featured service picked for you.</div>
    <a id="stickyLink" class="sticky-link" href="#" target="_blank" rel="noopener" data-i18n="view_more">View More</a>
  </div>

  <div id="debug-overlay"></div>

  <script>

      const box = document.getElementById("debug-overlay");
      if(box){
        box.style.display = "block";
        box.textContent = "JS error: " + e.message + " @ " + e.lineno + ":" + e.colno;
      }

      region=normalizeRegion(region);
      if(ENGLISH_LOCKED.has(region)) return "en";
      const p=new URLSearchParams(location.search).get("lang");
      if(p==="en") return "en";
      return detectLanguage(region);

    async function loadTranslations(lang){
      const base={...(BUILT_IN_TRANSLATIONS.en||{}),...(BUILT_IN_TRANSLATIONS[lang]||{})};
      try{
        const r=await fetch(`i18n/${lang}.json`,{cache:"no-store"});
        if(r.ok) return {...base,...await r.json()};
      }catch(e){}
      return base;
    }

    function applyTranslations(t){
      document.querySelectorAll("[data-i18n]").forEach(el=>{const k=el.getAttribute("data-i18n"); if(t[k]) el.textContent=t[k];});
      document.querySelectorAll("[data-i18n-placeholder]").forEach(el=>{const k=el.getAttribute("data-i18n-placeholder"); if(t[k]) el.setAttribute("placeholder",t[k]);});
      document.documentElement.lang = ACTIVE_LANGUAGE;
      document.documentElement.dataset.i18nReady = "1";
    }

      if(ENGLISH_LOCKED.has(ACTIVE_REGION)) lang="en";

      if(lang!==native && lang!=="en") lang=native;
      ACTIVE_LANGUAGE=lang;

    function normalizePartnerRegions(p){return Array.isArray(p.regions) ? [...new Set(p.regions.map(normalizeRegion))] : [normalizeRegion(p.region||"ot")];}
    function normalizePartnerName(name){return String(name||"").toLowerCase().replace(/\([^)]*\)/g,"").replace(/\.com/g,"").replace(/\b(global|ot|us|usa|uk|gb|mx|br|pl|eu|latam|es-latam|ru|ca|de|fr|it|es|ar|co|pe|cl|nz)\b/g,"").replace(/\s+/g," ").trim();}
    function categoryKey(p){return displayCategoryKey(p.category_key || p.category || "marketplace");}

    function mergePartners(arr){
      const map=new Map();
      (Array.isArray(arr)?arr:[]).forEach(p=>{
        if(!p||!p.name||!p.url||p.status==="hold"||p.status==="disabled") return;
        const c=categoryKey(p);
        // Deduplicate by normalized partner name, not name + category.
        // This prevents the same partner from appearing twice when stale/external data
        // codes it under aliases such as sim/esim or a wrong category.
        const key=normalizePartnerName(p.name);
        const regs=normalizePartnerRegions(p);
        let e=map.get(key);
        if(!e){
          e={...p,category_key:c,category:c,regions:[],regional_urls:{...(p.regional_urls||{})}};
          map.set(key,e);
        }
        regs.forEach(r=>{
          if(!e.regions.includes(r)) e.regions.push(r);
          if(p.regional_urls && p.regional_urls[r]) e.regional_urls[r]=p.regional_urls[r];
          else if(!e.regional_urls[r]) e.regional_urls[r]=p.url;
        });
        // Keep the best-ranked row's naming/coding while preserving all regional URLs.
        if((p.tier||99)<(e.tier||99)){
          ["name","url","network","description","tier","category_label","logo"].forEach(f=>{if(p[f]) e[f]=p[f];});
          e.category_key=c;
          e.category=c;
        }
      });
      return [...map.values()];
    }

    function partnerMatchesRegion(p, region){return normalizePartnerRegions(p).includes(normalizeRegion(region));}

    function partnerForRegion(p, region){
      region=normalizeRegion(region);
      const regs=normalizePartnerRegions(p);
      const urls=p.regional_urls || {};
      const key=categoryKey(p);
      return {
        ...p,
        regions:regs,
        matched_region:region,
        region,
        url:urls[region] || p.url || "#",
        category_key:key,
        category_label:ACTIVE_TRANSLATIONS[key] || ACTIVE_TRANSLATIONS[canonicalCategoryKey(key)] || p.category_label || key,
        description:p.description || ""
      };
    }

    async function loadPartners(){
      let external=[];
      for(const endpoint of ["partners.json","/partners.json"]){
        try{
          const r=await fetch(endpoint,{cache:"no-store"});
          if(r.ok){
            const d=await r.json();
            external=Array.isArray(d)?d:(d.partners||[]);
            break;
          }
        }catch(e){}
      }
      // Always merge embedded inventory with external JSON so regional partners do not disappear
      // when partners.json is partial or stale. External rows can still add/override via mergePartners().
      return [...(EMBEDDED_PARTNERS.partners||[]), ...external];
    }

    function visiblePartners(){
      const seen=new Set();
      return mergePartners(ACTIVE_PARTNERS)
        .filter(p=>partnerMatchesRegion(p,ACTIVE_REGION))
        .map(p=>partnerForRegion(p,ACTIVE_REGION))
        .filter(p=>{const k=normalizePartnerName(p.name); if(seen.has(k)) return false; seen.add(k); return true;})
        .sort((a,b)=>(a.tier||99)-(b.tier||99)||String(a.name).localeCompare(String(b.name)));
    }

      (Array.isArray(partners)?partners:[]).forEach(p=>{

        if(!index[c]) index[c]=[];
        index[c].push({...p,category_key:c});
      });
      return index;
    }

    function mediaHTML(item){

    function renderNextFeedBatch(){
      if(FEED_LOADING) return;
      FEED_LOADING=true;

      if(!FEED_ITEMS.length){
        container.innerHTML='<div class="feed-empty">No feed items for this region.</div>';
        FEED_LOADING=false;
        return;
      }
      const start=FEED_PAGE*FEED_PAGE_SIZE;
      const batch=FEED_ITEMS.slice(start,start+FEED_PAGE_SIZE);
      if(!batch.length){
        FEED_PAGE=0;
        FEED_LOADING=false;
        renderNextFeedBatch();
        return;
      }
      const frag=document.createDocumentFragment();
      batch.forEach(item=>{
        const card=document.createElement("article");
        card.className="feed-card";
        card.innerHTML=`
          ${mediaHTML(item)}
          <div class="feed-content">
            <span class="feed-label">${esc(item.category_label || translatedCategory(item.category_key))}</span>
            <span class="feed-source">${esc(item.feed_source || "feed")}</span>
            <h3>${esc(item.feed_title)}</h3>

          if(["video","iframe","source","a","button"].includes(tag)) return;
          window.open(item.url,"_blank","noopener");
        });
        frag.appendChild(card);
      });
      container.appendChild(frag);
      FEED_PAGE++;
      FEED_LOADING=false;
    }

    function isColumn3EligiblePartner(p){
      if(!p || !p.name || !p.url) return false;

    function curatedColumn3Partners(partners){
      const region=normalizeRegion(ACTIVE_REGION);
      const whitelist=COLUMN3_FAMOUS_BY_REGION[region] || COLUMN3_FAMOUS_BY_REGION.ot;
      const used=new Set();
      const out=[];
      const add=p=>{
        if(!p || !isColumn3EligiblePartner(p)) return;
        const id=partnerId(p);
        if(used.has(id)) return;
        used.add(id);
        out.push(p);
      };

      whitelist.forEach(name=>{
        const p=partners.find(x=>normalizePartnerName(x.name)===normalizePartnerName(name));
        add(p);
      });

      [...partners]
        .filter(isColumn3EligiblePartner)
        .sort((a,b)=>{
          const af=a.featured?0:1, bf=b.featured?0:1;
          const at=a.tier||99, bt=b.tier||99;
          const ac=COLUMN3_TRUST_CATEGORIES.has(displayCategoryKey(a.category_key))?0:1;
          const bc=COLUMN3_TRUST_CATEGORIES.has(displayCategoryKey(b.category_key))?0:1;
          return af-bf || at-bt || ac-bc || String(a.name).localeCompare(String(b.name));
        })
        .forEach(p=>{ if(out.length<COLUMN3_MAX_PARTNERS) add(p); });

      return out.slice(0,COLUMN3_MAX_PARTNERS);
    }

      applyTranslations(ACTIVE_TRANSLATIONS);
      setupLanguageSwitcher();
      renderAll();
    }

    init();
  </script>
