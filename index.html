<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SignalBoost AI</title>

<style>
body { font-family: Arial; margin:0; background:#f5f7fb; }
.app { max-width:1100px; margin:auto; padding:20px; }

.hero { background:white; padding:20px; border-radius:12px; }
h1 { margin:0; }

.search-box { display:flex; gap:10px; margin-top:15px; }
input { flex:1; padding:10px; }
button { padding:10px; cursor:pointer; }

.results { margin-top:20px; }

.card {
  background:white;
  padding:15px;
  border-radius:10px;
  margin-bottom:10px;
}

.hidden { display:none; }
.section { margin-top:30px; }

</style>
</head>

<body>
<div class="app">

<!-- HERO -->
<div class="hero">
<h1>SignalBoost AI</h1>
<p>Your digital shopping mall for smart deals, travel, tech, and business tools.</p>

<div class="search-box">
<input id="searchInput" placeholder="Search anything (hotel, esim, website, laptop)" />
<button onclick="runSearch()">Search</button>
</div>

</div>

<!-- RESULTS -->
<div class="results" id="results"></div>

<!-- ADMIN ANALYTICS (HIDDEN) -->
<div id="analyticsSection" class="section hidden">
<h2>📊 Admin Analytics</h2>
<pre id="analyticsOutput"></pre>
</div>

</div>

<script>

/* ============================================
   SIGNALBOOST AI ENGINE (v5)

   This is your AI + HMI core system.

   It simulates AI by:
   - detecting user intent
   - routing to monetized categories
   - tracking behavior

   NEXT LEVEL:
   - connect to backend
   - real AI model
============================================ */

/* ---------- INTENT DETECTION ---------- */
function detectIntent(query) {
  const q = query.toLowerCase();

  if (q.match(/hotel|travel|flight|vacation|stay/)) return "travel";
  if (q.match(/esim|phone|laptop|tech|charger/)) return "tech";
  if (q.match(/website|business|marketing|software/)) return "business";

  return "general";
}

/* ---------- RESULT ENGINE ---------- */
function getResults(query) {
  const intent = detectIntent(query);

  if (intent === "travel") {
    return [
      { title:"Expedia", link:"https://expedia.com/affiliate/6N7hRHZ" },
      { title:"Hotels.com", link:"https://www.hotels.com/affiliate/5BoP8Nf" },
      { title:"Vrbo", link:"https://vrbo.com/affiliate/M2nsa7i" }
    ];
  }

  if (intent === "tech") {
    return [
      { title:"eSIM Plans", link:"https://www.awin1.com/cread.php?awinmid=119369&awinaffid=2834806&ued=https%3A%2F%2Fwww.birday.com" },
      { title:"Tech Deals", link:"#"}
    ];
  }

  if (intent === "business") {
    return [
      { title:"Website Tools", link:"#"},
      { title:"Marketing Tools", link:"#"}
    ];
  }

  return [
    { title:"Explore Travel", link:"#"}
  ];
}

/* ---------- SEARCH FUNCTION ---------- */
function runSearch() {
  const query = document.getElementById("searchInput").value;

  track("search", query);

  const results = getResults(query);

  const container = document.getElementById("results");
  container.innerHTML = results.map(r => `
    <div class="card">
      <strong>${r.title}</strong><br/>
      <a href="${r.link}" target="_blank" onclick="track('click','${r.title}')">
        Open
      </a>
    </div>
  `).join("");
}

/* ---------- ANALYTICS SYSTEM ---------- */
function track(type, value) {
  const data = JSON.parse(localStorage.getItem("sb_data") || "[]");

  data.push({
    type,
    value,
    time: new Date().toISOString()
  });

  localStorage.setItem("sb_data", JSON.stringify(data));
  renderAnalytics();
}

function renderAnalytics() {
  const el = document.getElementById("analyticsOutput");
  const data = localStorage.getItem("sb_data");

  if (el) el.textContent = data || "No data yet";
}

/* ---------- ADMIN MODE ---------- */
function enableAdmin() {
  const params = new URLSearchParams(window.location.search);
  const isAdmin = params.get("admin") === "true";

  const section = document.getElementById("analyticsSection");
  if (section) {
    section.classList.toggle("hidden", !isAdmin);
  }

  if (isAdmin) renderAnalytics();
}

enableAdmin();

</script>

</body>
</html>
