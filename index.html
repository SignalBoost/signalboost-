    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatDate(dateString) {
      const d = new Date(dateString);
      if (Number.isNaN(d.getTime())) return '';
      return d.toLocaleString();
    }

    function isValidHttpUrl(value) {
      try {
        const url = new URL(value, window.location.origin);
        return url.protocol === 'http:' || url.protocol === 'https:';
      } catch (err) {
        return false;
      }
    }

    function updateClickDisplay() {
      const el = document.getElementById('clickCount');
      if (!el) return;
      const count = localStorage.getItem('clickCount') || '0';
      el.textContent = count;
    }

    function monetizeUrl(url, meta) {
      if (!isValidHttpUrl(url)) return '#';

      const host = window.location.hostname || '';
      const protocol = window.location.protocol || '';
      const isPreview =
        protocol === 'file:' ||
        host === 'localhost' ||
        host === '127.0.0.1' ||
        host.endsWith('.oausercontent.com') ||
        host.includes('sandbox');

      if (isPreview) return url;

      const params = new URLSearchParams();
      params.set('url', url);
      if (meta && meta.partner) params.set('partner', meta.partner);
      if (meta && meta.source) params.set('source', meta.source);
      return '/api/out?' + params.toString();
    }

      if (!link) return;
      if (!link.href.includes('/api/out?') && !link.target) return;
      try {
        const current = parseInt(localStorage.getItem('clickCount') || '0', 10);
        localStorage.setItem('clickCount', String(current + 1));
        updateClickDisplay();
      } catch (err) {}
    });

    function hexToRgb(hex) {
      const clean = String(hex || '').replace('#', '');
      if (clean.length !== 6) return '143,159,179';
      const bigint = parseInt(clean, 16);
      const r = (bigint >> 16) & 255;
      const g = (bigint >> 8) & 255;
      const b = bigint & 255;
      return r + ',' + g + ',' + b;
    }

    function getYouTubeEmbed(url) {
      try {

        let videoId = parsed.searchParams.get('v');
        if (!videoId && parsed.hostname.includes('youtu.be')) videoId = parsed.pathname.replace(/^\//, '').split('/')[0];
        if (!videoId && parsed.pathname.includes('/embed/')) videoId = parsed.pathname.split('/embed/')[1].split('/')[0];
        if (!videoId && parsed.pathname.includes('/shorts/')) videoId = parsed.pathname.split('/shorts/')[1].split('/')[0];
        if (videoId) return 'https://www.youtube.com/embed/' + videoId + '?rel=0&modestbranding=1&playsinline=1';
      } catch (e) {}
      return '';
    }
