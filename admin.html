<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SignalBoost Admin</title>

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#0f172a;
  color:#e2e8f0;
}

.container {
  max-width:1200px;
  margin:auto;
  padding:20px;
}

h1 {
  font-size:28px;
  margin-bottom:20px;
}

.card {
  background:#1e293b;
  border-radius:12px;
  padding:16px;
  margin-bottom:16px;
}

.grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.stat {
  font-size:22px;
  font-weight:bold;
}

.label {
  font-size:12px;
  color:#94a3b8;
}

table {
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

th, td {
  padding:10px;
  border-bottom:1px solid #334155;
  text-align:left;
  font-size:13px;
}

th {
  color:#94a3b8;
}

.refresh-btn {
  background:#2563eb;
  border:none;
  padding:10px 14px;
  border-radius:8px;
  color:white;
  cursor:pointer;
}

</style>
</head>

<body>

<div class="container">

  <h1>SignalBoost Admin</h1>

  <button class="refresh-btn" onclick="loadData()">Refresh</button>

  <!-- STATS -->
  <div class="grid">
    <div class="card">
      <div class="stat" id="searchCount">0</div>
      <div class="label">Searches</div>
    </div>
    <div class="card">
      <div class="stat" id="clickCount">0</div>
      <div class="label">Clicks</div>
    </div>
    <div class="card">
      <div class="stat" id="conversionRate">0%</div>
      <div class="label">Conversion Rate</div>
    </div>
  </div>

  <!-- SEARCHES -->
  <div class="card">
    <h3>Recent Searches</h3>
    <table id="searchTable">
      <thead>
        <tr>
          <th>Query</th>
          <th>Time</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- CLICKS -->
  <div class="card">
    <h3>Recent Clicks</h3>
    <table id="clickTable">
      <thead>
        <tr>
          <th>Provider</th>
          <th>Query</th>
          <th>Time</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

</div>

<script>

async function loadData() {
  try {
    const res = await fetch('/api/events');
    const data = await res.json();

    const searches = data.filter(e => e.eventType === 'search_submitted');
    const clicks = data.filter(e => e.eventType === 'provider_clicked');

    document.getElementById('searchCount').textContent = searches.length;
    document.getElementById('clickCount').textContent = clicks.length;

    const conversion = searches.length ? ((clicks.length / searches.length) * 100).toFixed(1) : 0;
    document.getElementById('conversionRate').textContent = conversion + '%';

    renderSearches(searches);
    renderClicks(clicks);

  } catch (e) {
    console.error('Error loading admin data', e);
  }
}

function renderSearches(searches) {
  const tbody = document.querySelector('#searchTable tbody');
  tbody.innerHTML = '';

  searches.slice(0, 20).forEach(s => {
    const row = `
      <tr>
        <td>${s.payload.query}</td>
        <td>${new Date(s.timestamp).toLocaleString()}</td>
      </tr>
    `;
    tbody.innerHTML += row;
  });
}

function renderClicks(clicks) {
  const tbody = document.querySelector('#clickTable tbody');
  tbody.innerHTML = '';

  clicks.slice(0, 20).forEach(c => {
    const row = `
      <tr>
        <td>${c.payload.title}</td>
        <td>${c.payload.query}</td>
        <td>${new Date(c.timestamp).toLocaleString()}</td>
      </tr>
    `;
    tbody.innerHTML += row;
  });
}

loadData();

</script>

</body>
</html>
