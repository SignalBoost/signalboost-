<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SignalBoost Admin</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: #fff;
      padding: 24px;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 28px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .card {
      background: #161b22;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 16px;
    }

    .label {
      font-size: 12px;
      color: rgba(255,255,255,0.65);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }

    .value {
      font-size: 28px;
      font-weight: 700;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #161b22;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      overflow: hidden;
    }

    th, td {
      text-align: left;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 14px;
      vertical-align: top;
    }

    th {
      color: rgba(255,255,255,0.7);
      font-weight: 700;
      background: #11161d;
    }

    .section {
      margin-top: 20px;
    }

    .muted {
      color: rgba(255,255,255,0.65);
      font-size: 13px;
    }

    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <h1>SignalBoost Admin</h1>

  <div class="grid">
    <div class="card">
      <div class="label">Total Clicks</div>
      <div id="totalClicks" class="value">—</div>
    </div>
    <div class="card">
      <div class="label">Clicks Today</div>
      <div id="clicksToday" class="value">—</div>
    </div>
    <div class="card">
      <div class="label">Top Source</div>
      <div id="topSource" class="value">—</div>
    </div>
  </div>

  <div class="section">
    <h2>Top Partners</h2>
    <table>
      <thead>
        <tr>
          <th>Partner</th>
          <th>Clicks</th>
        </tr>
      </thead>
      <tbody id="partnersTable">
        <tr><td colspan="2" class="muted">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="section">
    <h2>Recent Clicks</h2>
    <table>
      <thead>
        <tr>
          <th>Time</th>
          <th>Partner</th>
          <th>Source</th>
          <th>Target</th>
        </tr>
      </thead>
      <tbody id="recentTable">
        <tr><td colspan="4" class="muted">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    async function loadStats() {
      const res = await fetch('/api/stats');
      const data = await res.json();

      document.getElementById('totalClicks').textContent = data.total ?? 0;
      document.getElementById('clicksToday').textContent = data.clicksToday ?? 0;

      const sourceEntries = Object.entries(data.sourceCounts || {}).sort((a, b) => b[1] - a[1]);
      document.getElementById('topSource').textContent = sourceEntries[0]?.[0] || '—';

      const partnersTable = document.getElementById('partnersTable');
      partnersTable.innerHTML = (data.topPartners || []).length
        ? data.topPartners.map(row => `
            <tr>
              <td>${escapeHtml(row.name)}</td>
              <td>${row.clicks}</td>
            </tr>
          `).join('')
        : `<tr><td colspan="2" class="muted">No data yet.</td></tr>`;

      const recentTable = document.getElementById('recentTable');
      recentTable.innerHTML = (data.recent || []).length
        ? data.recent.map(row => `
            <tr>
              <td>${escapeHtml(new Date(row.ts).toLocaleString())}</td>
              <td>${escapeHtml(row.partner || '')}</td>
              <td>${escapeHtml(row.source || '')}</td>
              <td><span class="muted">${escapeHtml(row.target || '')}</span></td>
            </tr>
          `).join('')
        : `<tr><td colspan="4" class="muted">No recent clicks.</td></tr>`;
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    loadStats();
    setInterval(loadStats, 30000);
  </script>
</body>
</html>
